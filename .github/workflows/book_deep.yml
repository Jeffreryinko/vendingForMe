name: 책 깊이 소개 (Claude)

# vfm-story 의 많이 추천된 책 순서로 깊이 소개를 써서 data/book/deep_ai.json 에 쌓음.
# 다 쓰면 할 일이 없어 바로 끝남. 돈은 Claude 주기 한도·하루 몫을 따름.
on:
  # 정해진 시각 실행은 끔(11/15) — 한꺼번에 쓰는 글은 작업 시간에 구독으로 직접 씀. 필요하면 Actions 에서 손으로 실행
  workflow_dispatch:
    inputs:
      n:
        description: "이번에 쓸 장 수 (기본 40)"
        required: false
        default: "40"
      fast:
        description: "하루 몫 무시하고 한 번에 (주기 한도는 지킴) — 1 이면 켬"
        required: false
        default: ""

concurrency:
  group: data-book
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q json-repair || true
      - name: 카드 쓰기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MONTHLY_USD: ${{ vars.CLAUDE_MONTHLY_USD }}
          BOOK_N: ${{ inputs.n || '40' }}
          BOOK_FAST: ${{ inputs.fast }}
          CLAUDE_NO_DAILY: ${{ inputs.fast }}
        run: python robot/book_deep.py
      - name: 저장소에 올리기
        run: |
          git config user.name "book-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data/book data/claude_usage
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "책 깊이 소개: $(TZ=Asia/Seoul date '+%m월 %d일 %H시') Claude 카드"
          for i in 1 2 3; do (git pull --rebase -X theirs --autostash || (git rebase --abort; false)) && git push && break || sleep 10; done
