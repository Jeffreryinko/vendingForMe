name: 딜 로봇 (하루 4번, 토큰 0)

on:
  schedule:
    - cron: "50 22 * * *"      # 한국시간 07:50
    - cron: "50 4 * * *"       # 13:50
    - cron: "50 10 * * *"      # 19:50
    - cron: "50 15 * * *"      # 00:50
  workflow_dispatch:
    inputs:
      no_translate:
        description: "번역 건너뛰기 (빠른 확인용) — yes 라고 쓰면 건너뜀"
        required: false

concurrency:
  group: data-deal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deal:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TG_MINUTES: "15"      # 구글 번역기(TranslateGemma)에 쓸 시간 — 넘으면 NLLB로 이어서
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 번역 모델 캐시 (다른 로봇과 공유)
        if: inputs.no_translate != 'yes'
        uses: actions/cache@v4
        with:
          path: |
            /tmp/nllb-600m-ct2
            ~/.cache/huggingface
          key: nllb-600m-ct2-v1
      - name: 구글 번역 모델 캐시 (TranslateGemma 4B, 약 2.5GB)
        if: inputs.no_translate != 'yes'
        uses: actions/cache@v4
        with:
          path: /tmp/tgemma
          key: tgemma-4b-q4km-v1
      - name: 라이브러리 설치
        run: |
          pip install -q requests
          if [ "${{ inputs.no_translate }}" != "yes" ]; then
            pip install -q "ctranslate2>=4" "transformers>=4.40" sentencepiece "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
            pip install -q llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || echo "구글 번역기 설치 실패 — 예전 번역기(NLLB)로"
          fi
      - name: 투자·인수합병·상장·펀드 모으기
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DEAL_MAX_MINUTES: "50"
        run: python robot/deal_run.py ${{ inputs.no_translate == 'yes' && '--no-translate' || '' }}
      - name: 저장소에 올리기
        run: |
          git config user.name "deal-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data/deal
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "딜: $(TZ=Asia/Seoul date '+%m월 %d일 %H시') 자동 수집"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 10; done
