name: 종이 자판기 (이북리더기판 다시 만들기, 토큰 0)

# 다른 로봇이 자료를 올리고 끝나면 바로 따라 돌아요. 교실 글을 고쳐 올려도 돌아요.
on:
  workflow_run:
    workflows:
      - "시사 자판기 로봇 (3시간마다, 로봇 편집장 포함 · 토큰 0)"
      - "시사·딜·AI 브리핑 (아침 · 점심 · 저녁, Claude → 무료 AI)"
      - "AI 로봇 (매일 새벽 4시 30분, 토큰 0)"
      - "도구 로봇 (하루 4번, 토큰 0)"
      - "딜 로봇 (하루 4번, 토큰 0)"
      - "트렌드 로봇 (3시간마다)"
      - "배움 깊이 읽기 (Claude가 코스 카드를 5배로)"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "sisa/learn/**"
      - "deal/learn/**"
      - "ai/learn/**"
      - "gicho/**"
      - "robot/ebook_build.js"
      - "robot/ebook_more.js"
      - "robot/ebook_hub.js"
      - "robot/ebook_webreader.min.js"
      - "data/hub/**"
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다 — 이야기·사람·뷰티게임 자판기(다른 저장소) 자료도 이때 따라와요
  workflow_dispatch:

concurrency:
  group: ebook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 최신 자료로 맞추기
        run: git pull --rebase || true
      - name: 다른 자판기 자료 받기 (이야기·사람·뷰티게임, 필요한 파일만)
        run: |
          mkdir -p /tmp/ext && cd /tmp/ext
          git clone -q --depth 1 https://github.com/Jeffreryinko/vfm-mind || true
          git clone -q --depth 1 https://github.com/Jeffreryinko/vfm-consumer || true
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Jeffreryinko/vfm-story && cd vfm-story && \
          git sparse-checkout set --no-cone '/iyagi/' '/brain/' '/history/*.js' '/book/deep.js' '/data/iyagi/stories/' '/data/iyagi/wiki/' \
            '/data/brain/regions.json' '/data/brain/stories.json' '/data/brain/news.json' '/data/history/top.json' '/data/history/days/' '/data/history/editorial/' '/data/book/top.json' && \
          python3 -c "
          import json,subprocess
          t=json.load(open('data/history/top.json')); want={r[0] for k in t for r in t[k]}
          names=subprocess.run(['git','ls-tree','-r','--name-only','HEAD','data/history/pages'],capture_output=True,text=True).stdout.split()
          print('\n'.join('/'+n for n in names if n.rsplit('/',1)[-1][:-5] in want))" > /tmp/want.txt && \
          git sparse-checkout add --stdin < /tmp/want.txt || echo "이야기 자판기 받기 실패 — 그 부분만 빼고 만듦"
      - name: 종이 자판기 만들기
        env:
          VFM_EXT: /tmp/ext
        run: node robot/ebook_build.js
      - name: 저장소에 올리기
        run: |
          git config user.name "ebook-robot"
          git config user.email "robot@users.noreply.github.com"
          git add -A ebook
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "종이 자판기: $(TZ=Asia/Seoul date '+%m월 %d일 %H시') 다시 만듦"
          for i in 1 2 3; do (git pull --rebase -X theirs --autostash || (git rebase --abort; false)) && git push && break || sleep 10; done
