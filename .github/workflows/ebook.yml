name: 종이 자판기 (이북리더기판 다시 만들기, 토큰 0)

# 다른 로봇이 자료를 올리고 끝나면 바로 따라 돌아요. 교실 글을 고쳐 올려도 돌아요.
on:
  workflow_run:
    workflows:
      - "시사 자판기 로봇 (3시간마다, 로봇 편집장 포함 · 토큰 0)"
      - "시사·딜·AI 브리핑 (아침 · 점심 · 저녁, Claude → 무료 AI)"
      - "AI 로봇 (매일 새벽 4시 30분, 토큰 0)"
      - "도구 로봇 (하루 4번, 토큰 0)"
      - "딜 로봇 (하루 4번, 토큰 0)"
      - "트렌드 로봇 (3시간마다)"
      - "배움 깊이 읽기 (Claude가 코스 카드를 5배로)"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "sisa/learn/**"
      - "deal/learn/**"
      - "ai/learn/**"
      - "gicho/**"
      - "robot/ebook_build.js"
  schedule:
    - cron: "17 */6 * * *"   # 예비 (6시간마다)
  workflow_dispatch:

concurrency:
  group: ebook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 최신 자료로 맞추기
        run: git pull --rebase || true
      - name: 종이 자판기 만들기
        run: node robot/ebook_build.js
      - name: 저장소에 올리기
        run: |
          git config user.name "ebook-robot"
          git config user.email "robot@users.noreply.github.com"
          git add -A ebook
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "종이 자판기: $(TZ=Asia/Seoul date '+%m월 %d일 %H시') 다시 만듦"
          for i in 1 2 3; do (git pull --rebase -X theirs --autostash || (git rebase --abort; false)) && git push && break || sleep 10; done
