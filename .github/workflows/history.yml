name: 역사 로봇 (매일 새벽 5시 + 다 받을 때까지 이어서, 토큰 0)

# 한 회차 최대 약 5시간 15분. 받을 차례가 남아 있으면 끝날 때 스스로 다음 회차를 시작한다 (chain_left 회까지).
# 처음 큰 수확: Actions → 역사 로봇 → Run workflow (기본값 그대로). 그 뒤로는 손댈 것 없음.

on:
  schedule:
    - cron: "0 20 * * *"        # 한국시간 05:00 (UTC 20:00 전날). 이야기 04:00 · AI 04:30 다음
  workflow_dispatch:
    inputs:
      max_pages:
        description: "이번 회차에 받을 최대 편 수"
        required: false
        default: "100000"
      max_minutes:
        description: "받기 최대 분 (마무리 15분 별도, GitHub 한도 360분)"
        required: false
        default: "300"
      seeds:
        description: "종자: normal(7일마다) · skip(건너뜀) · force(지금 다시) · only(종자만)"
        required: false
        default: "normal"
      chain_left:
        description: "남은 게 있으면 이어서 시작할 회차 수 (0이면 이어가지 않음)"
        required: false
        default: "30"
      quick:
        description: "빠른 시험 — yes 라고 쓰면 종자 몇 개만"
        required: false
        default: "no"

concurrency:
  group: data-history
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  guard:   # GitHub 자체 예약(예비)으로 깨어났는데, 정시 알람(Supabase → 실행 버튼)이 이미 최근에 돌렸으면 건너뜀
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW_MIN: "1200"
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          ref="${GITHUB_WORKFLOW_REF%%@*}"; wf="${ref##*/}"
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=10" --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\") | .created_at][0] // empty" || true)
          if [ -n "$last" ]; then
            age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
            echo "지난 실행: $last ($age분 전) · 기준 $WINDOW_MIN분"
            if [ "$age" -lt "$WINDOW_MIN" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "→ 최근에 이미 돌았으니 건너뜀"; exit 0; fi
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"
  history:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 라이브러리 설치
        run: pip install -q requests mwparserfromhell
      - name: git 설정
        run: |
          git config user.name "history-robot"
          git config user.email "robot@users.noreply.github.com"
      - name: 역사 글 모으기 (위키백과·위키데이터)
        id: run
        env:
          HIST_MAX_PAGES: ${{ inputs.max_pages || '100000' }}
          HIST_MAX_MINUTES: ${{ inputs.max_minutes || '300' }}
          HIST_BUDGET_MB: "380"
          HIST_GIT_PUSH: "1"
          HIST_PUSH_EVERY: "40"
          HIST_RECHECK: "3000"
          HIST_VIEWS_BUDGET: "2500"
        run: |
          FLAGS=""
          case "${{ inputs.seeds || 'normal' }}" in
            skip) FLAGS="$FLAGS --no-seeds" ;;
            force) FLAGS="$FLAGS --force-seeds" ;;
            only) FLAGS="$FLAGS --seeds-only" ;;
          esac
          if [ "${{ inputs.quick }}" = "yes" ]; then FLAGS="$FLAGS --quick"; fi
          python -u robot/history_run.py $FLAGS
      - name: 저장소에 올리기
        if: always()
        run: |
          git add -A data/history
          git diff --cached --quiet && echo "변경 없음" && exit 0
          N=$(python -c "import json;print(json.load(open('data/history/_index.json'))['counts']['total'])" 2>/dev/null || echo "?")
          git commit -q -m "역사: $(TZ=Asia/Seoul date '+%m월 %d일 %H시') 자동 수집 (전체 ${N}편)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break || sleep 20; done
      - name: 다음 회차 이어서 (받을 차례가 남았으면)
        if: steps.run.outcome == 'success' && steps.run.outputs.progress == '1' && steps.run.outputs.queue != '0' && inputs.quick != 'yes' && inputs.seeds != 'only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=${{ inputs.chain_left || '30' }}
          if [ "$LEFT" -le 0 ]; then echo "이어갈 회차 없음"; exit 0; fi
          echo "받을 차례 ${{ steps.run.outputs.queue }}편 남음 → 다음 회차 시작 (남은 회차 $((LEFT-1)))"
          printf '{"ref":"%s","inputs":{"chain_left":"%s","max_pages":"%s","max_minutes":"%s","seeds":"normal"}}' \
            "${{ github.ref_name }}" "$((LEFT-1))" "${{ inputs.max_pages || '100000' }}" "${{ inputs.max_minutes || '300' }}" \
            | gh api -X POST "repos/${{ github.repository }}/actions/workflows/history.yml/dispatches" --input -
