name: 이야기 원문 번역 로봇 (주 2회, 토큰 0)

on:
  schedule:
    - cron: "0 17 * * 2,5"      # 한국시간 수·토 새벽 2시 (UTC 화·금 17시)
  workflow_dispatch:
    inputs:
      book:
        description: "특정 책 id (비우면 안 된 책 중 짧은 것부터)"
        required: false

concurrency:
  group: data-iyagi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 345          # GitHub 무료 러너 최대 6시간
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 번역 모델 캐시
        uses: actions/cache@v4
        with:
          path: |
            /tmp/nllb-600m-ct2
            ~/.cache/huggingface
          key: nllb-600m-ct2-v1
      - name: 라이브러리 설치
        run: pip install -q "ctranslate2>=4" "transformers>=4.40" sentencepiece "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: 번역
        run: python robot/iyagi_translate.py --max-minutes 300 ${{ inputs.book && format('--book {0}', inputs.book) || '' }}
      - name: 저장소에 올리기
        run: |
          git config user.name "iyagi-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data/iyagi/orig
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "이야기: 원문 번역 추가 $(TZ=Asia/Seoul date '+%m/%d')"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 10; done
