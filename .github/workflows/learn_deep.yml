name: 배움 깊이 읽기 (Claude가 코스 카드를 5배로)

# robot/learn_deep.py — 아직 긴 글이 없는 코스 카드에 '깊이 읽기'를 써서 data/<앱>/deep_long.json 에 쌓음.
on:
  # 정해진 시각 실행은 끔(11/15) — 한꺼번에 쓰는 글은 작업 시간에 구독으로 직접 씀. 필요하면 Actions 에서 손으로 실행
  workflow_dispatch:
    inputs:
      app:
        description: "앱 (gicho · ai · sisa)"
        required: false
        default: ""
      fast:
        description: "하루 몫 무시하고 한 번에 (주기 한도는 지킴) — 1 이면 켬"
        required: false
        default: ""

concurrency:
  group: data-learn-deep
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q json-repair || true
      - name: 깊이 읽기 쓰기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MONTHLY_USD: ${{ vars.CLAUDE_MONTHLY_USD }}
          LEARN_FAST: ${{ inputs.fast }}
          LEARN_N: ${{ inputs.fast && '400' || '40' }}
        run: |
          if [ -n "${{ inputs.app }}" ]; then python robot/learn_deep.py ${{ inputs.app }}; else for a in gicho ai sisa; do python robot/learn_deep.py $a; done; fi
      - name: 저장소에 올리기
        run: |
          git config user.name "learn-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data/claude_usage $(ls data/*/deep_long.json)
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "배움 깊이 읽기: $(TZ=Asia/Seoul date '+%m월 %d일 %H시')"
          for i in 1 2 3; do (git pull --rebase -X theirs --autostash || (git rebase --abort; false)) && git push && break || sleep 10; done
