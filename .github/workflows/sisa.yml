name: 시사 자판기 로봇 (3시간마다)

on:
  schedule:
    - cron: "10 */3 * * *"      # UTC 기준 3시간마다 → 한국시간 00·03·06·09·12·15·18·21시 10분쯤
  workflow_dispatch:            # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

concurrency:
  group: data-sisa
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  guard:   # GitHub 자체 예약(예비)으로 깨어났는데, 정시 알람(Supabase → 실행 버튼)이 이미 최근에 돌렸으면 건너뜀
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW_MIN: "150"
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          ref="${GITHUB_WORKFLOW_REF%%@*}"; wf="${ref##*/}"
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=10" --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\") | .created_at][0] // empty" || true)
          if [ -n "$last" ]; then
            age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
            echo "지난 실행: $last ($age분 전) · 기준 $WINDOW_MIN분"
            if [ "$age" -lt "$WINDOW_MIN" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "→ 최근에 이미 돌았으니 건너뜀"; exit 0; fi
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"
  crawl:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 라이브러리 설치
        run: pip install -q feedparser pyyaml requests
      - name: 수집·번역·판 만들기
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
        run: python robot/sisa_run.py
      - name: 저장소에 올리기
        run: |
          git config user.name "sisa-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data/sisa
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "시사: $(TZ=Asia/Seoul date '+%m월 %d일 %H시판') 자동 수집"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 10; done
