name: 도구 로봇 (하루 4번, 토큰 0)

on:
  schedule:
    - cron: "40 21 * * *"      # 한국시간 06:40
    - cron: "40 3 * * *"       # 12:40
    - cron: "40 9 * * *"       # 18:40
    - cron: "40 14 * * *"      # 23:40
  workflow_dispatch:
    inputs:
      no_translate:
        description: "번역 건너뛰기 (빠른 확인용) — yes 라고 쓰면 건너뜀"
        required: false

concurrency:
  group: data-tools
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 번역 모델 캐시 (AI·이야기 로봇과 공유)
        if: inputs.no_translate != 'yes'
        uses: actions/cache@v4
        with:
          path: |
            /tmp/nllb-600m-ct2
            ~/.cache/huggingface
          key: nllb-600m-ct2-v1
      - name: 라이브러리 설치
        run: |
          pip install -q requests
          if [ "${{ inputs.no_translate }}" != "yes" ]; then
            pip install -q "ctranslate2>=4" "transformers>=4.40" sentencepiece "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          fi
      - name: 도구·오픈소스·활용법 모으기
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          TOOLS_MAX_MINUTES: "40"
        run: python robot/tools_run.py ${{ inputs.no_translate == 'yes' && '--no-translate' || '' }}
      - name: 저장소에 올리기
        run: |
          git config user.name "tools-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data/tools
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "도구: $(TZ=Asia/Seoul date '+%m월 %d일 %H시') 자동 수집"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 10; done
