name: 트렌드 로봇 (3시간마다)

on:
  schedule:
    - cron: "25 */3 * * *"      # 시사 로봇(10분)과 15분 차이 → 서로 커밋이 겹치지 않게
  workflow_dispatch:

concurrency:
  group: data-trends
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 라이브러리 설치
        run: pip install -q requests
      - name: 나라별 트렌드 모으기
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
        run: python robot/trends_run.py
      - name: 저장소에 올리기
        run: |
          git config user.name "trends-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data/trends
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "트렌드: $(TZ=Asia/Seoul date '+%m월 %d일 %H시') 자동 수집"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 10; done
