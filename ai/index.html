<style>
/* AI 탭 — 논문·발표·코드를 하루 한 판으로. 시사 탭과 같은 색·글꼴 체계, 읽기 화면은 이야기 탭처럼 전체 화면 */
:root{--bg:#EEF2F3;--surface:#fff;--sunk:#E3E9EB;--ink:#13232B;--muted:#5A6B73;--line:#D3DCDF;--accent:#0C6E77;--accent-ink:#fff;--accent-soft:#D5ECEE;

  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}

u.tm{text-decoration:none;border-bottom:1.5px dotted var(--term);color:inherit;cursor:pointer}u.tm.my{background:var(--mine-soft);border-bottom-color:var(--mine)}
.nou u.tm{border:0;background:none}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}

.rbar button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--ap-tint-t);padding:4px 0}.rbar button b{font-size:21px;font-weight:400}.rbar button.on{color:var(--ap-orange)}

.back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9500;display:flex;align-items:flex-end;justify-content:center}

.acts button{padding:12px 12px;border-radius:12px;border:0;background:var(--surface);font-size:15px;font-weight:600;text-align:left;color:var(--ap-label)}.acts button.on{color:var(--ap-tint-t)}
.acts button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.wiki{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ap-tint);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;z-index:9400;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;z-index:9600}
.search{width:100%;padding:10px 14px;border-radius:10px;border:0;background:var(--ap-fill);color:inherit;font:inherit;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{padding:7px 13px;border-radius:999px;border:0;background:var(--ap-fill);font-size:14px;font-weight:500;color:var(--ap-label)}.chips button.on{background:var(--ap-tint);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
.termcard{background:var(--surface);border:0;border-radius:var(--r);padding:12px 14px;margin:0 0 8px;text-align:left;width:100%}
.termcard b{font-size:16px}.termcard .wk{font-size:13px;color:var(--ap-label2);margin-top:6px;border-left:2px solid var(--ap-tint);padding-left:8px}.termcard .en{font-size:13px;color:var(--muted)}.termcard p{margin:4px 0 0;font-size:14px}
.sub{font-size:13px;color:var(--muted)}
.health{font-size:12.5px;color:var(--warn);margin:6px 0}

.easy{background:color-mix(in srgb,var(--ap-purple,#AF52DE) 8%,var(--surface,#fff));border-radius:14px;padding:12px 14px;margin:10px 0}
.easy p,.easy li{line-height:1.6}.easy ol{padding-left:20px;margin:4px 0}.ez-h{font-weight:700;font-size:16px;margin:0 0 6px}.ez-one{font-size:16.5px;font-weight:600}
.ez-k{font-size:13px;font-weight:700;color:var(--muted,#666);margin:14px 0 4px}
.kterms{display:flex;flex-direction:column;gap:6px}.kterm{display:flex;gap:10px;align-items:center;background:var(--surface,#fff);border-radius:12px;padding:8px 10px;border:1px solid var(--line,#e5e5ea)}
.kterm>div{flex:1;min-width:0}.kterm p{margin:2px 0 0;font-size:14px;line-height:1.45}.kterm button{flex:none;border:0;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;font-weight:600;background:var(--ap-fill,rgba(118,118,128,.12));color:inherit}
.kterm button.on{background:color-mix(in srgb,var(--ap-green,#34C759) 18%,transparent);color:var(--ap-green-t,#248A3D)}
.ezreq{margin:14px 0 4px;padding:12px;border-radius:12px;background:var(--ap-fill2,rgba(118,118,128,.08))}.ezreq p{margin:0 0 8px}
.bd.ez{background:color-mix(in srgb,var(--ap-purple,#AF52DE) 16%,transparent);color:var(--ap-purple-t,#8E3BBF)}
.kstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}.kstat div{background:var(--surface,#fff);border-radius:14px;padding:12px;text-align:center}.kstat b{display:block;font-size:24px}.kstat span{font-size:12.5px;color:var(--muted,#666)}
.vdk-card .en{color:var(--muted,#666);font-size:13px;margin:-6px 0 8px}
</style></head><body>
<script src="../assets/deck.js"></script>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs">
  <button data-v="today" aria-current="page"><b>☀︎</b>오늘</button>
  <button data-v="know"><b>✦</b>내 지식</button>
  <button data-v="terms"><b>ⓣ</b>용어장</button>
  <button data-v="box"><b>☆</b>보관함</button>
</nav>
<script>
"use strict";
/* ───── 저장 (폰 브라우저). 키는 vfm:ai:* → 껍데기의 내보내기에 포함됨 ───── */
const LS = { g(k, d) { try { const v = localStorage.getItem("vfm:ai:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             s(k, v) { try { localStorage.setItem("vfm:ai:" + k, JSON.stringify(v)); } catch (e) { toast("저장 공간이 꽉 찼어요"); } } };
const DEF_TAGS = ["LLM", "에이전트", "RAG", "영상", "음성", "로봇", "의료", "데이터", "학습법", "하드웨어"];
const S = { view: "today", day: null, idx: null, days: {}, more: {}, moreShown: 0, terms: [], termById: {}, paper: null, cfg: LS.g("cfg", { underline: true, fs: 1 }),
  star: LS.g("star", {}), hide: LS.g("hide", {}), tags: LS.g("tags", {}), tagdefs: LS.g("tagdefs", DEF_TAGS), memo: LS.g("memo", {}), tmemo: LS.g("tmemo", {}), myterms: LS.g("myterms", {}), read: LS.g("read", {}), know: LS.g("know", { papers: {}, terms: {} }), easyIdx: null, easy: {} };
function save(k) { LS.s(k, S[k]); }
document.documentElement.style.setProperty("--fs", S.cfg.fs || 1);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
async function getJ(p) { const r = await fetch("../data/ai/" + p, { cache: "no-cache" }); if (!r.ok) throw new Error(p); return r.json(); }
const fmtDay = d => d ? `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일` : "";

/* ───── 데이터 ───── */
async function loadIndex() { S.idx = await getJ("_index.json"); S.terms = await getJ("terms.json"); S.terms.forEach(t => S.termById[t.id] = t); if (!S.day) S.day = S.idx.today || S.idx.days.at(-1); }
async function loadDay(d) { if (!S.days[d]) S.days[d] = await getJ("days/" + d + ".json"); return S.days[d]; }
async function loadMore(d) { if (!S.more[d]) S.more[d] = (await getJ("days/" + d + "_more.json")).papers || []; return S.more[d]; }
function allLoadedPapers() { const out = []; Object.values(S.days).forEach(x => out.push(...(x.papers || []))); Object.values(S.more).forEach(x => out.push(...x)); Object.values(S.star).forEach(s => { if (s.item && !out.find(p => p.id === s.item.id)) out.push(s.item); }); return out; }
function findPaper(id) { return allLoadedPapers().find(p => p.id === id) || (S.star[id] && S.star[id].item); }

/* ───── 용어 밑줄 ───── */
let termRx = null;
function buildRx() {
  const parts = [];
  S.terms.forEach(t => t.aliases.forEach(a => parts.push(a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\\ /g, "[\\s-]"))));
  parts.sort((a, b) => b.length - a.length);
  termRx = new RegExp("(?<![\\w-])(" + parts.join("|") + ")(?![\\w-])", "gi");
}
function aliasToId(a) { const k = a.toLowerCase().replace(/[\s-]+/g, " "); for (const t of S.terms) if (t.aliases.some(x => x.toLowerCase().replace(/[\s-]+/g, " ") === k)) return t.id; return null; }
function underline(text) {   // 영문 글에서 용어 찾기 (한글 번역문은 영문 용어가 섞여 있을 때만 잡힘)
  if (!termRx) buildRx();
  return esc(text).replace(termRx, m => { const id = aliasToId(m); if (!id) return m; const t = S.termById[id]; if (/^[A-Z][A-Za-z0-9.\-]{0,5}$/.test(t.aliases.find(x => x.toLowerCase() === m.toLowerCase()) || "") && !t.aliases.includes(m)) return m; return `<u class="tm${S.myterms[id] ? " my" : ""}" data-t="${id}">${m}</u>`; });
}
function myCount(p) { return (p.terms || []).filter(([id]) => S.myterms[id]).length; }

/* ───── 화면: 오늘 ───── */
function srcBadge(p) { return p.src === "hf" ? '<span class="bd hf">HF 추천</span>' : p.src === "arxiv" ? '<span class="bd ax">arXiv</span>' : ""; }
function card(p) {
  const my = myCount(p), tags = S.tags[p.id] || [];
  return `<button type="button" class="card${S.read[p.id] ? " read" : ""}${S.star[p.id] ? " star" : ""}" data-open="${esc(p.id)}">
    <p class="t">${esc(p.ko || p.title)}</p>${p.ko ? `<p class="en">${esc(p.title)}</p>` : ""}
    ${p.one ? `<p class="one">${esc(p.one)}</p>` : ""}
    <div class="meta">${srcBadge(p)}${p.up ? `<span class="up">▲ ${p.up}</span>` : ""}${p.code ? '<span class="bd gh">코드</span>' : ""}${p.yt && p.yt.length ? '<span class="bd yt">영상</span>' : ""}
      ${my ? `<span class="mine">내 용어 ${my}</span>` : ""}${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}<span>${fmtDay(p.daily || p.day || S.day)}</span>${S.star[p.id] ? '<span class="up">★</span>' : ""}</div></button>`;
}
function liRow(p, kind) {
  const my = myCount(p);
  return `<a class="li" href="${esc(p.url)}" target="_blank" rel="noopener" data-visit="${esc(p.id)}"><p class="t">${esc(p.ko || p.title || p.name)}${p.new ? ' <span class="bd kr">NEW</span>' : ""}</p>

  else if (d.act === "hide") { S.hide[p.id] = 1; save("hide"); toast("오늘 목록에서 숨겼어요 (설정에서 되살리기)"); aiBack() || nav("#today"); }
  else if (d.act === "tag") tagSheet(p);
  else if (d.act === "share") { const text = `${p.ko || p.title}\n${p.title}\n${p.url}${S.memo[p.id] ? "\n메모: " + S.memo[p.id] : ""}`; if (navigator.share) navigator.share({ title: p.ko || p.title, text, url: p.url }).catch(() => { }); else { try { await navigator.clipboard.writeText(text); toast("복사했어요"); } catch (x) { } } }
});

/* ───── 시작 ───── */
(async () => {
  try { await loadIndex(); } catch (e) { document.getElementById("app").innerHTML = `<div class="top"><h1 class="lt">AI</h1></div><p class="empty">아직 자료가 없어요. 로봇이 처음 돌고 나면(새벽 4시 30분) 채워집니다.<br><small>${esc(e.message)}</small></p>`; return; }
  const h = location.hash; if (h.startsWith("#p=")) { const id = decodeURIComponent(h.slice(3)); for (const d of (S.idx.days || []).slice().reverse()) { await loadDay(d).catch(() => { }); if (findPaper(id)) { S.day = d; break; } } }
  route();
  window.vfm = window.vfm || {}; window.vfm.aiExport = exportMine;
})();
</script>
