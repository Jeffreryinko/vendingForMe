<style>
/* 딜 — 세계 투자 유치·인수합병·사모·상장·펀드 결성. 로봇(robot/deal_run.py)이 하루 4번 모아 같은 거래끼리 묶어 둠. 자료는 data/deal/
   메뉴 [오늘 · 탐색 · 따라가기 · 보관함]. 공식 신고 자료(미국 SEC Form D·상장·합병 서류, 한국 DART)는 탐색 아래 '숫자·공시'에서. */
:root{--bg:#F2F2F7;--surface:#fff;--sunk:#E9E9EE;--ink:#000;--muted:#6E6E73;--line:#E5E5EA;--accent:#8F6200;--accent-ink:#fff;--accent-soft:#FBF0D5;
  --up:#1E7F4F;--up-soft:#DDF2E6;--fs:1;--r:14px;--nav-h:58px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1C1C1E;--sunk:#2C2C2E;--ink:#fff;--muted:#98989F;--line:#38383A;--accent:#FFC94D;--accent-soft:#3A2E12;--up:#5BD18F;--up-soft:#173325;color-scheme:dark}
  html.ap.ap-deal:not([data-theme="light"]){--accent-ink:#2B1D00}}
:root[data-theme="dark"]{--bg:#000;--surface:#1C1C1E;--sunk:#2C2C2E;--ink:#fff;--muted:#98989F;--line:#38383A;--accent:#FFC94D;--accent-soft:#3A2E12;--up:#5BD18F;--up-soft:#173325;color-scheme:dark}
html.ap.ap-deal[data-theme="dark"]{--accent-ink:#2B1D00}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ap-font,system-ui);font-size:calc(15px*var(--fs));line-height:1.55;word-break:keep-all;overflow-wrap:break-word;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}a{color:var(--accent)}
.wrap{max-width:660px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 2px 2px}
.lt{margin:0;font:800 34px/1.15 var(--ap-display);letter-spacing:-.03em}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:var(--ap-fill);color:var(--accent);display:grid;place-items:center;font-size:17px;font-weight:600;flex:none}

h2.sec small{font:400 13px var(--ap-font);color:var(--muted);letter-spacing:0;flex:1}h2.sec button{background:none;border:0;color:var(--accent);font:600 14px var(--ap-font);padding:0;flex:none}
.note{font-size:13px;color:var(--muted);margin:0 2px 8px}.health{font-size:13px;color:#C24E00;margin:6px 2px}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:6px -14px;padding:0 14px}.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:0;background:var(--ap-fill);font-size:14px;color:var(--ink)}.chips button small{color:var(--muted);font-size:12px;margin-left:3px}
.chips button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}.chips button.on small{color:inherit;opacity:.8}
.flab{font-size:12px;color:var(--muted);font-weight:600;margin:10px 2px 0}
.card{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:13px 14px;margin:0 0 8px;position:relative;transition:transform .12s}.card:active{transform:scale(.985)}
.card.read{opacity:.55}.card.star{box-shadow:inset 0 0 0 1.5px var(--ap-orange)}
.card .bx{flex:1;min-width:0}
.card .amt{font:750 17px/1.25 var(--ap-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0 0 2px;color:var(--accent)}
.card .amt small{font:500 12.5px var(--ap-font);color:var(--muted);letter-spacing:0;margin-left:5px}
.card .t{font-weight:650;letter-spacing:-.015em;font-size:calc(15px*var(--fs));line-height:1.42;margin:0 0 3px}

.card .o{font-size:12.5px;color:var(--muted);margin:0 0 5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.bd.k{background:var(--accent-soft);color:var(--accent)}.bd.new{background:var(--up-soft);color:var(--up)}.bd.fil{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}.bd.fol{background:var(--up);color:#fff}
.btn{font-size:15px;font-weight:600;padding:11px 18px;border-radius:12px;border:0;background:var(--ap-fill);color:var(--accent);text-decoration:none;display:inline-block;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}.btn.sm{padding:8px 13px;font-size:14px;border-radius:10px}.more{width:100%;margin:4px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.tile{border:0;background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left}.tile b{display:block;font:700 16px var(--ap-display)}.tile small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block}
.search{width:100%;padding:11px 14px;border-radius:10px;border:0;background:var(--ap-fill);color:inherit;font:inherit;font-size:16px;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
.list{background:var(--surface);border-radius:var(--r);padding:0 16px;margin:0 0 10px}
.list .li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 0;border:0;border-bottom:.5px solid var(--ap-sep);background:none;color:inherit;text-decoration:none}.list .li:last-child{border-bottom:0}
.list .li .bx{flex:1;min-width:0}.list .li .t{font-weight:600;margin:0 0 1px;font-size:calc(14.5px*var(--fs))}.list .li .s{font-size:12.5px;color:var(--muted);margin:0}
.list .li .v{flex:none;font-weight:650;font-variant-numeric:tabular-nums;font-size:14px;color:var(--accent);text-align:right}
.bars{background:var(--surface);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
.bar{display:grid;grid-template-columns:7.5em 1fr auto;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar i{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:2px}.bar span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right}
.bar b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;margin:10px 0 4px}.cols div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.cols div.alt{background:var(--up)}.cols-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.fol-row{display:flex;gap:8px;margin:8px 0}.fol-row input{flex:1;margin:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;z-index:6}
nav.tabs button{flex:1;border:0;background:none;display:grid;justify-items:center;align-content:center;gap:1px}
nav.tabs button b{font-size:20px;font-weight:400;line-height:1.1}
.back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9500;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--ap-label3);margin:0 auto 10px}
.sheet h3{margin:0 0 4px;font:700 20px/1.35 var(--ap-display);letter-spacing:-.02em}
.sheet .big{font:800 26px/1.2 var(--ap-display);letter-spacing:-.02em;color:var(--accent);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.sheet .orig{font-size:13px;color:var(--muted);margin:0 0 8px}
.sheet .body{background:var(--surface);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:calc(14.5px*var(--fs))}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:6px 10px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.nm{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--ap-fill);border-radius:999px;padding:4px 10px;margin:2px 4px 2px 0;font-size:13.5px}.nm.on{background:var(--up);color:#fff}
.sheet textarea{width:100%;min-height:70px;border-radius:10px;border:0;background:var(--surface);padding:10px 12px;font:inherit;font-size:15px;color:inherit;resize:vertical}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:9px 15px;border-radius:14px;font-size:13.5px;z-index:9600}
.help{background:var(--surface);border-radius:var(--r);padding:12px 14px;margin:8px 0;font-size:13.5px;color:var(--muted)}.help b{color:var(--ink)}
.vdk .vdk-amt{font:800 30px/1.15 var(--ap-display);letter-spacing:-.02em;color:var(--accent);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.vdk .vdk-amt small{display:block;font:500 13px var(--ap-font);color:var(--muted);letter-spacing:0;margin-top:3px}
</style></head><body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs">
  <button data-v="today" aria-current="page"><b>☀︎</b>오늘</button>
  <button data-v="x"><b>⌕</b>탐색</button>
  <button data-v="follow"><b>◎</b>따라가기</button>
  <button data-v="shelf"><b>☆</b>보관함</button>
</nav>
<script>
"use strict";
/* ───── 상태 (폰 브라우저에만 저장) ───── */
const LS = { g(k, d) { try { const v = localStorage.getItem("vfm:deal:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             s(k, v) { try { localStorage.setItem("vfm:deal:" + k, JSON.stringify(v)); } catch (e) { toast("저장 공간이 꽉 찼어요"); } } };
const S = { star: LS.g("star", {}), read: LS.g("read", {}), hide: LS.g("hide", {}), memo: LS.g("memo", {}), fol: LS.g("fol", {}), kind: LS.g("kind", ""),
            idx: null, now: null, byId: {}, days: {}, files: {}, wk: LS.g("wk", "sec") };
const F = Object.assign({ q: "", per: 7, kind: "", stage: "", sec: "", cc: "", band: "", sort: "amt" }, LS.g("F", {}), { q: "" });
function save(k) { LS.s(k, S[k]); }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
const getJ = p => fetch("../data/deal/" + p, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); });
function ago(iso) { if (!iso) return ""; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); if (m < 60) return Math.max(m, 1) + "분 전"; const h = Math.floor(m / 60); if (h < 48) return h + "시간 전"; return Math.floor(h / 24) + "일 전"; }
const kst = (t = Date.now()) => new Date(t + 9 * 3600e3).toISOString().slice(0, 10);
function dayLbl(d) { if (!d) return ""; const td = kst(), y = kst(Date.now() - 864e5); return d === td ? "오늘" : d === y ? "어제" : (+d.slice(5, 7)) + "/" + (+d.slice(8, 10)); }
// 금액 (원) → '1.2조 원' · '3,400억 원' · '12억 원'
function won(v) { v = +v || 0; if (!v) return ""; if (v >= 1e12) return (v / 1e12).toFixed(v >= 1e13 ? 0 : 1).replace(/\.0$/, "") + "조 원"; if (v >= 1e8) return Math.round(v / 1e8).toLocaleString() + "억 원"; return Math.round(v / 1e4).toLocaleString() + "만 원"; }
function usd(v) { v = +v || 0; return v >= 1e9 ? "$" + (v / 1e9).toFixed(1).replace(/\.0$/, "") + "B" : v >= 1e6 ? "$" + Math.round(v / 1e6) + "M" : "$" + Math.round(v / 1e3) + "K"; }
const FLAG = { EU: "🇪🇺", ME: "🌍", AF: "🌍", LATAM: "🌎", SEA: "🌏", WW: "🌐" };
const flag = c => FLAG[c] || (c && c.length === 2 ? String.fromCodePoint(...[...c].map(x => 0x1F1A5 + x.charCodeAt(0))) : "🌐");
const KN = () => Object.fromEntries((S.idx.kinds || []).map(x => [x[0], x[1]]));
const SN = () => Object.fromEntries((S.idx.sectors || []).map(x => [x[0], x[1]]));
const STN = () => Object.fromEntries((S.idx.stages || []).map(x => [x[0], x[1]]));
const CN = c => (S.idx.regions || {})[c] || c;
const SRC_T = { formd: "미국 Form D 신고", dart: "한국 공시" };

/* ───── 자료 ───── */
async function loadAll() {
  [S.idx, S.now] = await Promise.all([getJ("_index.json"), getJ("now.json")]);
  for (const d of S.now.deals || []) S.byId[d.id] = d;
  loadFirms();
}
async function loadDays(n) {                                                  // 최근 n일 쌓인 파일 (now.json 보다 넓게)
  const want = (S.idx.days || []).slice(-n);
  await Promise.all(want.filter(d => !S.days[d]).map(d => getJ(`news/${d}.json`).then(x => { S.days[d] = x.items || []; }).catch(() => { S.days[d] = []; })));
  const seen = new Set(), out = [];
  for (const d of (S.now.deals || [])) { seen.add(d.id); out.push(d); }
  for (const day of want.slice().reverse()) for (const d of S.days[day]) if (!seen.has(d.id)) { seen.add(d.id); out.push(d); if (!S.byId[d.id]) S.byId[d.id] = d; }
  const cut = kst(Date.now() - (n - 1) * 864e5);
  return out.filter(d => d.date >= cut);
}
const vis = l => l.filter(d => !S.hide[d.id] && (!S.kind || d.kind === S.kind));
const big = (a, b) => (b.amt || 0) - (a.amt || 0) || (b.n || 1) - (a.n || 1);
const folNames = () => Object.keys(S.fol);
function folHit(d) { const hay = [d.title, d.ko, d.co, d.tgt, (d.inv || []).join(" ")].join(" ").toLowerCase(); return folNames().filter(n => hay.includes(n.toLowerCase())); }

/* ───── 카드 ───── */
function amtLine(d) {
  if (!d.amt) return ["vc", "ma", "pe", "fund"].includes(d.kind) ? `<p class="amt" style="color:var(--muted);font-size:14px;font-weight:600">금액 비공개</p>` : "";
  const orig = d.amtS && !/[원조억만]$/.test(d.amtS) ? d.amtS : d.usd ? usd(d.usd) : "";
  return `<p class="amt">${won(d.amt)}${orig ? `<small>${esc(orig)}</small>` : ""}</p>`;
}
function badges(d) {
  const b = [`<span class="bd k">${esc(KN()[d.kind] || "기타")}</span>`];
  if (d.stage) b.push(`<span class="bd">${esc(STN()[d.stage] || d.stage)}</span>`);
  if (SRC_T[d.t]) b.push(`<span class="bd fil">${SRC_T[d.t]}</span>`);
  if (d.new) b.push('<span class="bd new">NEW</span>');
  if (folHit(d).length) b.push('<span class="bd fol">따라가는 이름</span>');
  return b.join("");
}
function card(d) {
  const read = S.read[d.id] ? " read" : "", star = S.star[d.id] ? " star" : "";
  const ko = d.ko || d.title, orig = d.ko && d.ko !== d.title ? d.title : "";
  const sec = (d.sec || []).filter(s => s !== "etc").map(s => SN()[s] || s).join(" · ");
  return `<button class="card${read}${star}" data-open="${esc(d.id)}"><span class="fl" aria-hidden="true">${flag(d.cc)}</span><div class="bx">${amtLine(d)}
    <p class="t">${esc(ko)}</p>${orig ? `<p class="o">${esc(orig)}</p>` : ""}${d.ksum || d.sum ? `<p class="s">${esc(d.ksum || d.sum)}</p>` : ""}
    <div class="meta">${badges(d)}<span>${esc(CN(d.cc))}</span>${sec ? `<span>${esc(sec)}</span>` : ""}${(d.n || 1) > 1 ? `<span>보도 ${d.n}곳</span>` : ""}<span>${dayLbl(d.date)}</span>${S.memo[d.id] ? "<span>✎ 메모</span>" : ""}</div></div></button>`;
}
function kindChips(lst) {
  const cnt = {}; for (const d of lst) cnt[d.kind] = (cnt[d.kind] || 0) + 1;
  return `<div class="chips"><button data-kind="" class="${S.kind ? "" : "on"}">전체<small>${lst.length}</small></button>${(S.idx.kinds || []).filter(k => cnt[k[0]]).map(k => `<button data-kind="${k[0]}" class="${S.kind === k[0] ? "on" : ""}">${esc(k[1])}<small>${cnt[k[0]]}</small></button>`).join("")}</div>`;
}

/* ───── 넘겨보기 (assets/deck.js) ───── */
const D = window.VfmDeck || null;
const MODE = "deal";
const isDeck = () => !!D && D.mode(MODE) === "deck";
function toList() { try { localStorage.setItem("vfm:mode:" + MODE, '"list"'); } catch (e) { } paint(); }
function deckCard(d) {
  const ko = d.ko || d.title, orig = d.ko && d.ko !== d.title ? d.title : "";
  const sec = (d.sec || []).filter(s => s !== "etc").map(s => SN()[s] || s).join(" · ");
  const sum = d.ksum || d.sum || "";
  return `<div class="vdk-body"><div class="vdk-k">${badges(d)}<span>${flag(d.cc)} ${esc(CN(d.cc))}</span><span>${dayLbl(d.date)}</span></div>
    ${d.amt ? `<p class="vdk-amt">${won(d.amt)}<small>${esc(d.amtS && !/[원조억만]$/.test(d.amtS) ? d.amtS : d.usd ? usd(d.usd) : "")}${d.val ? " · 기업가치 " + won(d.val) : ""}</small></p>` : ""}
    <h2 class="vdk-t">${esc(ko)}</h2>${orig ? `<p class="vdk-note" style="margin:-6px 0 10px">${esc(orig)}</p>` : ""}
    ${who(d)}
    ${sum ? `<p class="vdk-h">기사 첫 문단</p><p class="vdk-p">${esc(sum.slice(0, 360))}</p>` : ""}
    ${sec ? `<p class="vdk-note">분야: ${esc(sec)}${(d.n || 1) > 1 ? ` · 보도 ${d.n}곳` : ""}</p>` : (d.n || 1) > 1 ? `<p class="vdk-note">보도 ${d.n}곳</p>` : ""}
    <a class="vdk-more" href="${esc(d.url)}" target="_blank" rel="noopener">${d.t === "formd" ? "SEC 신고서 보기 ↗" : d.t === "dart" ? "DART 공시 보기 ↗" : "기사 원문 ↗"}</a>
    <button type="button" class="vdk-more" data-open="${esc(d.id)}">자세히 · 따라가기 · 별표 ›</button></div>`;
}
function who(d) {
  const r = [];
  if (d.co) r.push(`<p class="vdk-p" style="margin:0 0 4px"><b>${esc(d.co)}</b>${d.tgt ? ` → ${esc(d.tgt)}` : ""}</p>`);

  let h = location.hash || "#today"; const app = document.getElementById("app"); const y = scrollY;
  if (h.startsWith("#f=")) {                                                    // 홈 랜덤 카드에서 '이 카드부터 보기'
    const fid = decodeURIComponent(h.slice(3)); h = "#today";
    try { history.replaceState(history.state, "", location.pathname + location.search + h); localStorage.setItem("vfm:mode:" + MODE, '"deck"'); } catch (e) { }
    if (D && S.byId[fid]) { S.kind = ""; const dk = makeDeck("deal-today", todayOrder); dk.queue = null; dk.hist = []; dk.pos = -1; dk.cur = fid; }
  }
  const tab = ["#stats", "#formd", "#sec", "#dart", "#find"].includes(h) ? "x" : h === "#kr" ? "today" : h.startsWith("#firm") || h.startsWith("#vc") ? "follow" : h.slice(1);
  document.querySelectorAll("#tabs button").forEach(b => { if (b.dataset.v === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  try {
    if (h === "#x" || h === "#find") { app.innerHTML = await renderX(); bindSearch("xq", v => { F.q = v; xLimit = 60; }, async () => { app.innerHTML = await renderX(); bindSearch("xq", v => { F.q = v; }, paint); }); if (h === "#find") setTimeout(() => { const q = document.getElementById("xq"); if (q) q.focus(); }, 50); }
    else if (h === "#stats") app.innerHTML = await renderStats();
    else if (h === "#kr") app.innerHTML = await renderKr();
    else if (h === "#firms") app.innerHTML = await renderFirms();
    else if (h === "#vcs") { app.innerHTML = await renderVcs(); bindSearch("kvq", v => { kvQ = v; kvLimit = 60; }, paint); }
    else if (h.startsWith("#vc=")) app.innerHTML = await renderVc(decodeURIComponent(h.slice(4)));
    else if (h.startsWith("#firm=")) app.innerHTML = await renderFirm(decodeURIComponent(h.slice(6)));
    else if (h === "#formd") { app.innerHTML = await renderFormd(); bindSearch("fdq", v => { fdF.q = v; }, paint); }
    else if (h === "#sec") { app.innerHTML = await renderSec(); bindSearch("secq", v => { secQ = v; }, paint); }
    else if (h === "#dart") { app.innerHTML = await renderDart(); bindSearch("dartq", v => { dartQ = v; }, paint); }
    else if (h === "#follow") { app.innerHTML = await renderFollow(); const i = document.getElementById("fadd"); if (i) i.addEventListener("keydown", e => { if (e.key === "Enter") { follow(i.value, true); paint(); } }); }
    else if (h === "#shelf") app.innerHTML = renderShelf();
    else app.innerHTML = renderToday();
  } catch (e) { app.innerHTML = `<p class="empty">못 불러왔어요<br><small>${esc(e.message)}</small></p>`; }
  if (document.querySelector(".back") == null) scrollTo(0, y);
}
function debounce(f, ms) { let t; return () => { clearTimeout(t); t = setTimeout(f, ms); }; }
function saveF() { const o = Object.assign({}, F); delete o.q; LS.s("F", o); }

document.addEventListener("click", async e => {

  if (d.f) { F[d.f] = d.val; if (d.f === "kind" && d.val !== "vc") F.stage = ""; xLimit = 60; saveF(); return paint(); }
  if (d.per) { F.per = +d.per; saveF(); return paint(); }

  if (d.wk) { S.wk = d.wk; save("wk"); return paint(); }

  if (d.fisort) { fiSort = d.fisort; return paint(); }

  if (d.firm) { closeSheet(); return nav("#firm=" + d.firm); }

  const a = d.act;

  if (a === "find") return nav("#find");

  if (a === "kvmore") { kvLimit += 120; return paint(); }

  if (a === "unhide") { S.hide = {}; save("hide"); toast("다시 보여요"); return paint(); }

  const sh = t.closest(".back"); if (!sh) return;
  const id = sh.dataset.id, p = S.byId[id] || (S.star[id] && S.star[id].item) || {};
  if (a === "think") { if (window.vfm && window.vfm.think) window.vfm.think({ app: "deal", key: id, title: p.ko || p.title, url: p.url }); return; }
