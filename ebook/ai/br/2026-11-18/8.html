<h1>MS 장애, 4개월 전 버그가 원인</h1>
<p class="sub">8/9</p>
<p class="tag">규칙·정책 · 마이크로소프트</p><p class="lead">MS 글로벌 서비스 장애는 7월에 적용한 소프트웨어 변경의 결함 때문이었어요. 자동 복구 시스템까지 연쇄 장애를 내서 아웃룩 핵심 서버의 80% 이상이 응답하지 않았어요.</p><section class="box"><h3>왜 중요해요</h3><p>매일 쓰는 업무 도구도 한 번 멈추면 크게 흔들린다는 걸 보여 줘요.</p></section><section><h3>원문</h3><ul><li><a href="https://www.aitimes.com/news/articleView.html?idxno=217485">AI타임스</a></li></ul></section>
