<h1>MS 장애 원인은 4개월 전 버그</h1>
<p class="sub">9/9</p>
<p class="tag">규칙·정책 · 마이크로소프트</p><p class="lead">MS가 15일 예비 보고서에서 글로벌 장애 원인이 7월에 적용한 소프트웨어 결함이라고 밝혔어요. 자동 복구까지 연쇄 장애를 일으켜 아웃룩 핵심 서버의 80% 이상이 응답하지 않았어요.</p><section class="box"><h3>왜 중요해요</h3><p>업무 도구가 한 번 멈추면 많은 사람의 일이 멈춘다는 걸 보여 줘요.</p></section><section><h3>원문</h3><ul><li><a href="https://www.aitimes.com/news/articleView.html?idxno=217485">AI타임스</a></li></ul></section>
