<h1>요시다 유리</h1>
<p class="sub">일본의 여자 성우 · 18년</p>
<p>요시다 유리(吉田有里, 8월 18일 ~ )은 사가현 출신의 일본의 여자 성우다. 시그마 세븐 소속이며 신장은 151cm. 미확인으로 진행형의 미츠미네 마시로 역으로 데뷔하였으며 펀치라인의 고양이 유령인 치라노스케 역으로 나왔다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EC%9A%94%EC%8B%9C%EB%8B%A4_%EC%9C%A0%EB%A6%AC">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
