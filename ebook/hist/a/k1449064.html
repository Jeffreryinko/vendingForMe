<h1>노스 선더 훈련</h1>

<p>북쪽의 천둥(라드 알-샤말, 아랍어: رعد الشمال)은 아랍 및 이슬람 국가들, 특히 이집트, 아랍 에미리트, 바레인, 수단, 요르단, 파키스탄, 카타르, 쿠웨이트, 모로코, 차드, 코모로 제도, 튀니지, 오만, 예멘이 참여했던 사우디 아라비아의 합동 군사 훈련이다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EB%85%B8%EC%8A%A4_%EC%84%A0%EB%8D%94_%ED%9B%88%EB%A0%A8">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
