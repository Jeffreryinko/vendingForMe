<h1>소매들어허리채기</h1>
<p class="sub">Judo technique</p>
<p>소매들어허리채기(袖釣込腰, Sode Tsurikomi Goshi)는 유도의 메치기의 허리기술 16개 중 하나이다. 신명 기술 목록에 채택한 기술 중 하나이다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EC%86%8C%EB%A7%A4%EB%93%A4%EC%96%B4%ED%97%88%EB%A6%AC%EC%B1%84%EA%B8%B0">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
