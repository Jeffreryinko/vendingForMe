<h1>세단 핵 실험</h1>
<p class="sub">1962년 미국 네바다주 네바다 시험장 지하 핵실험 · 1962년</p>
<p>세단 핵 실험(Sedan nuclear test)은 미국이 1962년 7월 6일 네바다 핵 실험장에서 실시한 핵 실험이다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EC%84%B8%EB%8B%A8_%ED%95%B5_%EC%8B%A4%ED%97%98">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
