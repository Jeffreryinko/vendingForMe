<h1>미소짓는 부처</h1>
<p class="sub">1974 India's first successful nuclear test · 1974년</p>
<p>미소짓는 부처(Smiling Buddha)는 1974년 5월 18일 라자스탄 주 포카란의 지하 핵 실험장에서 실시된 인도 최초의 핵 실험이다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EB%AF%B8%EC%86%8C%EC%A7%93%EB%8A%94_%EB%B6%80%EC%B2%98">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
