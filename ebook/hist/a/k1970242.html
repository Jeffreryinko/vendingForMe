<h1>쌍룡훈련</h1>
<p class="sub">military exercise in South Korea · 2012년</p>
<p>쌍룡훈련(雙龍訓練, 영어: Ssangyong Exercise)은 2012년부터 격년제로 실시하고 있는 한미연합 상륙훈련이다. 한미연합 야외기동연습인 독수리 훈련의 일환으로 실시된다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EC%8C%8D%EB%A3%A1%ED%9B%88%EB%A0%A8">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
