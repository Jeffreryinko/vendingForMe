<h1>보스토크 2018</h1>
<p class="sub">military exercise in Vostok, Russia · 2018년</p>
<p>보스토크 2018(Vostok 2018)은 2018년 러시아 극동군의 대규모 연합 군사훈련이다. 동방 2018(East 2018) 훈련이라고도 한다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EB%B3%B4%EC%8A%A4%ED%86%A0%ED%81%AC_2018">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
