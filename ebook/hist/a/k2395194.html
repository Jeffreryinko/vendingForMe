<h1>분노의 전쟁</h1>
<p class="sub">실마릴리온에 나오는 가상의 전쟁</p>
<p>분노의 전쟁은 《실마릴리온》에서 언급된 대전쟁이다. 태양의 첫 시대 말엽, 에아렌딜의 구원 요청에 따라 발리노르 대군이 가운데땅에서 전투를 벌여 모르고스를 제압한 의의를 가진다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EB%B6%84%EB%85%B8%EC%9D%98_%EC%A0%84%EC%9F%81">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
