<h1>유취관</h1>
<p class="sub">일본의 야스쿠니 신사 경내에 병설된 보물관 · 1882년</p>
<p>유취관(遊就館)은 야스쿠니 신사 경내에 병설된 그 신사의 제신(祭神) 연고의 자료를 모은 박물관이다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EC%9C%A0%EC%B7%A8%EA%B4%80">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
