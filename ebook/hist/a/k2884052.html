<h1>무기 밀매</h1>
<p class="sub">illegal trafficking or smuggling of contraband weapons or ammunition</p>
<p>무기 밀매 또는 무기 불법거래는 화기와 탄약 등의 살상무기를 불법적으로 밀매하는 것을 말한다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EB%AC%B4%EA%B8%B0_%EB%B0%80%EB%A7%A4">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
