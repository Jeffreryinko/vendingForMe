<h1>프리아모스</h1>
<p class="sub">그리스 신화에 등장하는 트로이아의 왕</p>
<p>프리아모스(고대 그리스어: Πρίαμος, 발음 [prí.amos])는 그리스 신화에서 트로이 전쟁 당시 트로이의 전설적이고 마지막 왕이었다. 라오메돈의 아들이자 헥토르, 파리스, 카산드라 등의 아버지였다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%ED%94%84%EB%A6%AC%EC%95%84%EB%AA%A8%EC%8A%A4">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
