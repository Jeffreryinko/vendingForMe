<h1>플럼밥 작전</h1>
<p class="sub">series of nuclear tests · 1957년</p>
<p>플럼밥 작전(영어: Operation Plumbbob)은 1957년 5월 28일부터 10월 7일까지 네바다 핵 실험장에서 프로젝트 57에 이어 프로젝트 58/58A에 앞서 진행된 핵실험 시리즈이다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%ED%94%8C%EB%9F%BC%EB%B0%A5_%EC%9E%91%EC%A0%84">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
