<h1>자유 독일 운동</h1>
<p class="sub">political party</p>
<p>자유 독일 운동(독일어: Frei-Deutschland-Bewegung)은 제2차 세계 대전 중 아돌프 히틀러의 통치에 반대하여 망명한 독일인들의 운동이었다. 이 운동은 오토 슈트라서가 이끌었다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EC%9E%90%EC%9C%A0_%EB%8F%85%EC%9D%BC_%EC%9A%B4%EB%8F%99">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
