<h1>포르투갈의 반다 오리엔탈 침공 (1811년~1812년)</h1>
<p class="sub">1811년</p>
<p>포르투갈의 반다 오리엔탈 침공은 1811년에 시작되어 이듬해 끝난 포르투갈 제국의 단기적이고 실패로 돌아간 리오데라플라타 부왕령 잔여 영토 합병 시도였다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%ED%8F%AC%EB%A5%B4%ED%88%AC%EA%B0%88%EC%9D%98_%EB%B0%98%EB%8B%A4_%EC%98%A4%EB%A6%AC%EC%97%94%ED%83%88_%EC%B9%A8%EA%B3%B5_%281811%EB%85%84~1812%EB%85%84%29">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
