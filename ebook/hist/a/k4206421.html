<h1>실업협약</h1>
<p class="sub">1919년</p>
<p>실업협약(Unemployment Convention, 1919)은 국제 노동 기구의 협약이다.</p><p>이 협약은 1919년에 제정되었다.</p><p>&quot;실업 예방 또는 실업에 대비한 제안의 채택을 결정한 후...&quot;</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EC%8B%A4%EC%97%85%ED%98%91%EC%95%BD">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
