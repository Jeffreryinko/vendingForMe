<h1>엘리제 르클뤼</h1>
<p class="sub">프랑스 지리학자, 작가 · 1830년</p>
<p>자크 엘리제 르클뤼(프랑스어: Jacques Élisée Reclus, 1830년 3월 15일 - 1905년 7월 4일)는 프랑스의 지리학자, 아나키스트, 채식주의자다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EC%97%98%EB%A6%AC%EC%A0%9C_%EB%A5%B4%ED%81%B4%EB%A4%BC">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
