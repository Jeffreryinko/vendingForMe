<h1>1927년 전조선중등학교육상경기대회</h1>
<p class="sub">1927년</p>
<p>1927년 전조선중등학교육상경기대회는 전조선중등학교육상경기대회의 1927년 시즌 육상 대회이다. 1927년 9월 24일에 일제강점기 조선 경기도 경성부에 있는 연희전문학교 운동장에서 개최되었다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/1927%EB%85%84_%EC%A0%84%EC%A1%B0%EC%84%A0%EC%A4%91%EB%93%B1%ED%95%99%EA%B5%90%EC%9C%A1%EC%83%81%EA%B2%BD%EA%B8%B0%EB%8C%80%ED%9A%8C">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
