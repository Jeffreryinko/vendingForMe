<h1>리처드 로이드</h1>
<p class="sub">미국의 기타리스트, 싱어송라이터 (1951–2026) · 1951년</p>
<p>리처드 로이드(Richard Lloyd, 1951년 10월 25일 ~ 2026년 11월 7일)는 미국의 기타리스트이자 싱어송라이터로, 록 밴드 텔레비전의 창립 멤버로 가장 잘 알려져 있다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EB%A6%AC%EC%B2%98%EB%93%9C_%EB%A1%9C%EC%9D%B4%EB%93%9C">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
