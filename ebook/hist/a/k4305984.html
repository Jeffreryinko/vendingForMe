<h1>도이치펑크</h1>
<p class="sub">punk music in German language · 1975년</p>
<p>도이치펑크(독일어: Deutschpunk)는 1970년대 독일에서 발생한 펑크 록 장르이자 그 주변에 형성된 하위문화였다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EB%8F%84%EC%9D%B4%EC%B9%98%ED%8E%91%ED%81%AC">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
