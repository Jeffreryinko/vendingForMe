<h1>김태허</h1>
<p class="sub">38년</p>
<p>김태허(金太虛, 1555∼1620)는 조선 중기의 무신으로 임진왜란 당시 활동한 무장이다.</p><p>임진왜란 때 밀양부사로 분전, 울산군수로 전임되어 울산성 전투에서 도원수 권율(權慄)을 도와 큰 전공을 세워 당상관에 올랐고, 선조 38년(1605년) 선무원종공신 1등에 책록되었다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EA%B9%80%ED%83%9C%ED%97%88">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
</main>
