<h1>빌헬름 졸프</h1>
<p class="sub">독일 정치인 · 1862년</p>
<p>빌헬름 하인리히 졸프 (독일어: Wilhelm Heinrich Solf, 1862년 10월 5일~1936년 2월 6일)는 독일의 문헌학자, 외교관, 정치인으로 독일 민주당의 당원으로 활동했다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EB%B9%8C%ED%97%AC%EB%A6%84_%EC%A1%B8%ED%94%84">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
