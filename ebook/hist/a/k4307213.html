<h1>아흐마드 카밤</h1>
<p class="sub">이란의 정치인 · 1876년</p>
<p>아흐마드 카밤(페르시아어: احمد قوام‎, 1873년 1월 2일 ~ 1955년 7월 23일)은 이란의 정치인으로, 이란 총리를 다섯 번 지냈다. 카자르 왕조와 팔라비 왕조 양쪽에서 총리를 지내면서 소련의 이란 북부 병합 시도를 막았다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EC%95%84%ED%9D%90%EB%A7%88%EB%93%9C_%EC%B9%B4%EB%B0%A4">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
