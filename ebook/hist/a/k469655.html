<h1>영생교</h1>
<p class="sub">controversial South Korean religious group · 1981년</p>
<p>영생교(永生敎)는 대한민국의 사이비 종교로서 조희성에 의해 1981년 경기도 부천시에서 영생교 하나님의 성회 승리제단이라는 이름으로 창설되었다. 영생교 또는 승리제단으로 부르는 것이 보통이다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EC%98%81%EC%83%9D%EA%B5%90">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
