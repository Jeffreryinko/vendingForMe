<h1>성인보</h1>
<p class="sub">고려의 문신(文臣)으로 정치인(政治人)이며, 창녕 성씨의 시조이다 · 1189년</p>
<p>성인보(成仁輔, 1189년~?)는 고려의 문신(文臣)으로 정치인(政治人)이며, 창녕 성씨의 시조이다. 고려 중기(中期) 명종에서 고종 때 창녕의 토호(土豪)로서 호장(戶長)이 되어 창녕 지역을 다스렸다.</p><p class="note">글: <a href="https://ko.wikipedia.org/wiki/%EC%84%B1%EC%9D%B8%EB%B3%B4">한국어 위키백과</a> (CC BY-SA 4.0) · 앞부분만 받아 둔 글</p>
