<h1>알고리즘</h1>
<p class="sub">Algorithm · 꼭 알아 둘 말</p>
<p class="lead">문제를 푸는 순서를 하나하나 정해 둔 절차.</p><section class="box"><h3>비유하면</h3><p>라면 끓이는 법: 물 550ml → 끓으면 면과 수프 → 4분 30초. 순서대로만 하면 누구나 같은 라면.</p></section><section><h3>이렇게 나와요</h3><p>옛 AI는 사람이 알고리즘(규칙)을 다 짰고, 지금 AI는 규칙을 데이터에서 스스로 찾아요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/ai/t/rule-based.html">규칙 기반 AI</a> · <a href="../../../learn/ai/t/ml.html">머신러닝</a></p></section>
