<h1>CPU</h1>
<p class="sub">Central Processing Unit · 보통 알아 둘 말</p>
<p class="lead">컴퓨터의 두뇌. 복잡한 일을 차례로 빠르게 처리하는 데 강해요.</p><section class="box"><h3>비유하면</h3><p>만능 요리사 한 명. 무엇이든 잘하지만 만두 만 개를 빚는 데는 손이 모자라요.</p></section><section><h3>이렇게 나와요</h3><p>AI 학습은 GPU가 맡고, CPU는 전체를 지휘해요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/ai/t/gpu.html">GPU</a> · <a href="../../../learn/ai/t/npu.html">NPU</a></p></section>
