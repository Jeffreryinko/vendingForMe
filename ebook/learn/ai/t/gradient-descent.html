<p class="sub">Gradient Descent · 보통 알아 둘 말</p>
<p class="lead">틀린 정도(오차)가 줄어드는 쪽으로 가중치를 조금씩 옮겨 가는 방법.</p><section class="box"><h3>비유하면</h3><p>짙은 안개 속 산에서, 발밑이 내려가는 쪽으로 한 걸음씩 걸어 골짜기를 찾는 것.</p></section><section><h3>이렇게 나와요</h3><p>'학습률'은 한 걸음의 크기. 너무 크면 골짜기를 넘어가고 너무 작으면 영영 못 내려가요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/ai/t/backprop.html">역전파</a> · <a href="../../../learn/ai/t/loss.html">손실(오차)</a></p></section>
