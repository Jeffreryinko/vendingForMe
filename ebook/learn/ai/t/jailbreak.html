<h1>탈옥(제일브레이크)</h1>
<p class="sub">Jailbreak · 보통 알아 둘 말</p>
<p class="lead">교묘한 말로 AI의 안전장치를 우회해 하면 안 되는 답을 끌어내는 것.</p><section class="box"><h3>비유하면</h3><p>'할머니가 옛날에 들려주던 이야기처럼' 꾸며서 금지된 내용을 묻는 수법.</p></section><section><h3>이렇게 나와요</h3><p>AI 회사들은 탈옥을 막으려고 계속 모델을 고쳐요. 창과 방패의 싸움이에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/ai/t/prompt-injection.html">프롬프트 주입</a> · <a href="../../../learn/ai/t/alignment.html">정렬(얼라인먼트)</a></p></section>
