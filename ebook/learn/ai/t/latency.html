<h1>지연 시간(레이턴시)</h1>
<p class="sub">Latency · 깊이 알아 둘 말</p>
<p class="lead">질문을 넣고 답이 나오기 시작할 때까지 걸리는 시간.</p><section class="box"><h3>비유하면</h3><p>주문하고 음식이 나올 때까지 기다리는 시간.</p></section><section><h3>이렇게 나와요</h3><p>추론 모델은 오래 생각하는 만큼 지연 시간이 길어요. 음성 비서처럼 즉답이 필요한 곳엔 작고 빠른 모델을 써요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/ai/t/inference.html">추론(사용)</a> · <a href="../../../learn/ai/t/test-time-compute.html">추론 시점 계산</a></p></section>
