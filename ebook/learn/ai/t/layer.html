<h1>층(레이어)</h1>
<p class="sub">Layer · 보통 알아 둘 말</p>
<p class="lead">뉴런들이 한 줄로 늘어선 단. 입력층 → 숨은층(여러 개) → 출력층.</p><section class="box"><h3>비유하면</h3><p>공장 조립 라인의 단계. 앞 단계가 부품을, 뒤 단계가 완제품을 만들어요.</p></section><section><h3>이렇게 나와요</h3><p>앞쪽 층은 선·점 같은 단순한 것을, 뒤쪽 층은 눈·얼굴 같은 복잡한 것을 알아봐요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/ai/t/deep-learning.html">딥러닝</a> · <a href="../../../learn/ai/t/neural-net.html">인공 신경망</a></p></section>
