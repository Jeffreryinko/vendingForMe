<h1>규칙 기반 AI</h1>
<p class="sub">Rule-based / Symbolic AI · 보통 알아 둘 말</p>
<p class="lead">'만약 ~이면 ~하라'는 규칙을 사람이 직접 잔뜩 적어 넣는 옛 방식의 AI.</p><section class="box"><h3>비유하면</h3><p>두꺼운 매뉴얼을 외운 직원. 매뉴얼에 없는 상황이 오면 멈춰요.</p></section><section><h3>이렇게 나와요</h3><p>1980년대 '전문가 시스템'이 대표적. 지금도 은행 사기 탐지 등에 규칙이 섞여 쓰여요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/ai/t/ml.html">머신러닝</a> · <a href="../../../learn/ai/t/expert-system.html">전문가 시스템</a> · <a href="../../../learn/ai/t/ai-winter.html">AI 겨울</a></p></section>
