<h1>소형 언어 모델(SLM)</h1>
<p class="sub">Small Language Model · 깊이 알아 둘 말</p>
<p class="lead">수십억 개 안팎의 파라미터로, 폰이나 노트북에서도 돌아가게 만든 작은 언어 모델.</p><section class="box"><h3>비유하면</h3><p>큰 백과사전 대신 들고 다니는 수첩.</p></section><section><h3>이렇게 나와요</h3><p>인터넷 없이 내 기기에서 돌아 개인 정보가 밖으로 안 나가는 장점이 있어요(온디바이스 AI).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/ai/t/distillation.html">증류</a> · <a href="../../../learn/ai/t/on-device.html">온디바이스 AI</a></p></section>
