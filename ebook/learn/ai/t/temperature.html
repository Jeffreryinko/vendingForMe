<h1>온도(temperature)</h1>
<p class="sub">Temperature · 깊이 알아 둘 말</p>
<p class="lead">AI가 다음 말을 고를 때 얼마나 모험할지 정하는 값. 낮으면 뻔하고 안전하게, 높으면 다양하고 엉뚱하게.</p><section class="box"><h3>비유하면</h3><p>노래방에서 정석대로 부르기(낮음) vs 애드리브 잔뜩(높음).</p></section><section><h3>이렇게 나와요</h3><p>코드·사실 답은 낮게, 아이디어·시 쓰기는 높게 써요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/ai/t/llm.html">대형 언어 모델(LLM)</a></p></section>
