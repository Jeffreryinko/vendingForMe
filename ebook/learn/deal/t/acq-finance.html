<h1>인수금융</h1>
<p class="sub">Acquisition financing · 보통 알아 둘 말</p>
<p class="lead">회사를 사려고 빌리는 돈.</p><section class="box"><h3>비유하면</h3><p>집 살 때 받는 주택담보대출.</p></section><section><h3>이렇게 나와요</h3><p>'인수금융 리파이낸싱' = 그 대출을 더 좋은 조건으로 갈아탔다.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 184" role="img" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="22" width="146" height="118" rx="8" fill="var(--sunk)"/><text x="81" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">내 돈만 100</text><rect x="24" y="50" width="114" height="20" rx="4" fill="var(--ink)"/><text x="81" y="64" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--surface)">내 돈 100</text><text x="81" y="92" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--up)">값이 +10% → 나는 +10%</text><text x="81" y="110" text-anchor="middle" font-size="10.5" font-weight="600" fill="#D9534F">값이 −10% → 나는 −10%</text><text x="81" y="130" text-anchor="middle" font-size="10" font-weight="500" fill="var(--muted)">심심하지만 안전</text><rect x="166" y="22" width="146" height="118" rx="8" fill="var(--accent-soft)"/><text x="239" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)">내 돈 20 + 빚 80</text><rect x="182" y="50" width="23" height="20" rx="4" fill="var(--ink)"/><rect x="206" y="50" width="90" height="20" rx="4" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="251" y="64" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">빚 80</text><text x="239" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--up)">값이 +10% → 나는 +50%</text><text x="239" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#D9534F">값이 −10% → 나는 −50%</text><text x="239" y="130" text-anchor="middle" font-size="10" font-weight="500" fill="#D9534F">−20%면 내 돈 전부 사라짐</text><text x="160" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">빚은 갚을 돈이 그대로라, 오르내림이 다 내 몫이 돼요</text><text x="160" y="177" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">차입 매수(LBO)·신용 거래·갭 투자가 다 이 원리</text><text x="160" y="13" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">같은 100짜리를 사도</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/lbo.html">차입 매수(LBO)</a> · <a href="../../../learn/deal/t/loan.html">대출</a></p></section>
