<h1>인수</h1>
<p class="sub">Acquisition · 꼭 알아 둘 말</p>
<p class="lead">한 회사가 다른 회사의 지분을 사서 주인이 되는 것. 50% 넘게 사면 경영권을 가져요.</p><section class="box"><h3>비유하면</h3><p>가게를 통째로 사는 것. 간판은 그대로일 수도 있어요.</p></section><section><h3>이렇게 나와요</h3><p>'A, B 인수 / A to acquire B / A buys B'.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 150" role="img" xmlns="http://www.w3.org/2000/svg"><text x="82" y="16" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">인수</text><circle cx="56" cy="62" r="30" fill="var(--ink)"/><circle cx="100" cy="74" r="18" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="50" y="66" text-anchor="middle" font-size="14" font-weight="800" fill="var(--surface)">A</text><text x="100" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="var(--accent-ink)">B</text><text x="82" y="116" text-anchor="middle" font-size="10" font-weight="500" fill="var(--ink)">A가 B의 지분을 사서 주인이 돼요</text><text x="82" y="131" text-anchor="middle" font-size="9.5" font-weight="500" fill="var(--muted)">B 간판은 남을 수도 있어요</text><path d="M162 10v130" stroke="var(--sunk)" stroke-width="2"/><text x="242" y="16" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">합병</text><circle cx="222" cy="62" r="26" fill="var(--ink)"/><circle cx="262" cy="62" r="26" fill="var(--accent)" opacity=".85"/><text x="212" y="66" text-anchor="middle" font-size="12" font-weight="800" fill="var(--surface)">A</text><text x="274" y="66" text-anchor="middle" font-size="12" font-weight="800" fill="var(--accent-ink)">B</text><text x="242" y="116" text-anchor="middle" font-size="10" font-weight="500" fill="var(--ink)">두 회사가 법적으로 하나가 돼요</text><text x="242" y="131" text-anchor="middle" font-size="9.5" font-weight="500" fill="var(--muted)">새 이름을 달기도 해요</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/ma.html">인수합병(M&amp;A)</a> · <a href="../../../learn/deal/t/control.html">경영권</a> · <a href="../../../learn/deal/t/premium.html">프리미엄</a></p></section>
