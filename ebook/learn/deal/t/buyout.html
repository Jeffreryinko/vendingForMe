<h1>바이아웃</h1>
<p class="sub">Buyout · 꼭 알아 둘 말</p>
<p class="lead">회사의 경영권을 통째로 사는 투자.</p><section class="box"><h3>비유하면</h3><p>지분 조금이 아니라 가게를 통째로 사서 직접 고쳐요.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 200" role="img" xmlns="http://www.w3.org/2000/svg"><text x="80" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">살 때 (1,000억)</text><rect x="40" y="26" width="80" height="98" rx="6" fill="var(--sunk)"/><text x="80" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">빚 700</text><rect x="40" y="124" width="80" height="42" rx="6" fill="var(--accent)"/><text x="80" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent-ink)">내 돈 300</text><path d="M130 96L186 96M186 96L180.73450462865776 98.87655323162522M186 96L180.73450462865776 93.12344676837478" stroke="var(--muted)" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="158" y="86" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">5년</text><text x="158" y="112" text-anchor="middle" font-size="9" font-weight="500" fill="var(--muted)">회사가 번 돈으로</text><text x="158" y="123" text-anchor="middle" font-size="9" font-weight="500" fill="var(--muted)">빚을 갚음</text><text x="244" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">팔 때 (1,500억)</text><rect x="204" y="26" width="80" height="37" rx="6" fill="var(--sunk)"/><text x="244" y="49" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">남은 빚 400</text><rect x="204" y="63" width="80" height="103" rx="6" fill="var(--up)"/><text x="244" y="119" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">내 몫 1,100</text><text x="160" y="186" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">회사 값은 1.5배 올랐는데 내 돈은 300 → 1,100, 약 3.7배</text><text x="160" y="198" text-anchor="middle" font-size="9.5" font-weight="500" fill="#D9534F">반대로 값이 떨어지면 내 돈부터 사라져요</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a hre
