<h1>보통주</h1>
<p class="sub">Common stock · 보통 알아 둘 말</p>
<p class="lead">가장 기본 주식. 창업자와 직원이 주로 가져요. 회사가 팔릴 때 가장 나중에 받아요.</p><section class="box"><h3>비유하면</h3><p>일반석. 특별한 보장은 없지만 대박이 나면 같이 올라가요.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 160" role="img" xmlns="http://www.w3.org/2000/svg"><text x="160" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">100억 투자받은 회사가 150억에 팔리면</text><rect x="20" y="30" width="280" height="26" rx="6" fill="var(--sunk)"/><rect x="20" y="30" width="187" height="26" rx="6" fill="var(--accent)"/><text x="113" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent-ink)">① 투자자가 먼저 100억</text><text x="254" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">② 남은 50억</text><path d="M254 60L254 82M254 82L251.12344676837478 76.73450462865776M254 82L256.8765532316252 76.73450462865776" stroke="var(--muted)" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="170" y="86" width="130" height="30" rx="6" fill="var(--ink)"/><text x="235" y="106" text-anchor="middle" font-size="11" font-weight="500" fill="var(--surface)">창업자·직원이 나눔</text><text x="160" y="138" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">신문엔 '150억 매각'이지만 창업팀 몫은 50억일 수 있어요</text><text x="160" y="153" text-anchor="middle" font-size="9.5" font-weight="500" fill="var(--muted)">(우선주에 붙은 '청산 우선권' 때문 — 조건은 계약마다 달라요)</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/preferred.html">우선주</a> · <a href="../../../learn/deal/t/share.html">주식</a></p></section>
