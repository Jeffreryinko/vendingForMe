<h1>경영권</h1>
<p class="sub">Control · 보통 알아 둘 말</p>
<p class="lead">회사의 중요한 결정을 내릴 수 있는 힘. 보통 지분 과반이나 이사회 과반에서 나와요.</p><section class="box"><h3>비유하면</h3><p>가게 열쇠. 열쇠 값은 따로 붙어요(경영권 프리미엄).</p></section><section><h3>이렇게 나와요</h3><p>'경영권 지분 60% 매각' = 회사 주인이 바뀐다.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 196" role="img" xmlns="http://www.w3.org/2000/svg"><rect x="110" y="6" width="100" height="30" rx="8" fill="var(--ink)"/><text x="160" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="var(--surface)">총수 가족</text><path d="M160 38L160 52M160 52L157.12344676837478 46.73450462865777M160 52L162.87655323162522 46.73450462865776" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="196" y="49" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--accent)">30%</text><rect x="100" y="54" width="120" height="30" rx="8" fill="var(--accent-soft)"/><text x="160" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)">지주회사</text><path d="M160 86L160 100M160 100L157.12344676837478 94.73450462865776M160 100L162.87655323162522 94.73450462865776" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="196" y="97" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--accent)">30%</text><rect x="90" y="102" width="140" height="30" rx="8" fill="var(--sunk)"/><text x="160" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">자회사</text><path d="M160 134L160 148M160 148L157.12344676837478 142.73450462865776M160 148L162.87655323162522 142.73450462865776" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="196" y="145" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--accent)">30%</text><rect x="80" y="150" width="160" height="30" rx="8" fill="var(--sunk)"/><text x="160" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">손자회사</text><text x="42" y="122" text-anchor="middle" font-size="10
