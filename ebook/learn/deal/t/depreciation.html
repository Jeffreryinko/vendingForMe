<h1>감가상각</h1>
<p class="sub">Depreciation · 보통 알아 둘 말</p>
<p class="lead">오래 쓰는 자산의 값을 쓰는 햇수에 나눠 해마다 비용으로 잡는 것.</p><section class="box"><h3>비유하면</h3><p>1,000만 원짜리 오븐을 10년 쓰면 해마다 100만 원씩 비용.</p></section><section><h3>이렇게 나와요</h3><p>현금이 나가지 않는 비용이라 EBITDA에서는 다시 더해요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/ebitda.html">에비타(EBITDA)</a> · <a href="../../../learn/deal/t/capex.html">설비 투자(CAPEX)</a></p></section>
