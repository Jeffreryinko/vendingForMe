<h1>공시</h1>
<p class="sub">Filing / Disclosure · 꼭 알아 둘 말</p>
<p class="lead">회사가 법에 따라 중요한 일을 공개 장부에 알리는 것. 한국은 DART, 미국은 SEC.</p><section class="box"><h3>비유하면</h3><p>소문이 아니라 관공서에 낸 신고서. 거짓으로 쓰면 처벌받아서 가장 믿을 만해요.</p></section><section><h3>이렇게 나와요</h3><p>이 앱의 초록 점 '공시로 확인'이 이 뜻이에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/formd.html">Form D</a> · <a href="../../../learn/deal/t/public.html">상장사</a></p></section>
