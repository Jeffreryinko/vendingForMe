<h1>회수(엑시트)</h1>
<p class="sub">Exit · 꼭 알아 둘 말</p>
<p class="lead">투자자가 가진 지분을 팔아 돈으로 바꾸는 일. 길은 상장, 매각, 다른 투자자에게 팔기 셋.</p><section class="box"><h3>비유하면</h3><p>가게에 넣은 돈을 되찾는 날. 가게가 팔리거나, 시장에 조각을 내다 팔 수 있어야 가능해요.</p></section><section><h3>이렇게 나와요</h3><p>'투자자들의 엑시트 길이 열렸다' = 이제 지분을 팔 수 있게 됐다.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/ipo.html">기업공개(IPO)·상장</a> · <a href="../../../learn/deal/t/ma.html">인수합병(M&amp;A)</a> · <a href="../../../learn/deal/t/secondary.html">세컨더리(구주 거래)</a></p></section>
