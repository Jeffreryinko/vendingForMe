<h1>팹리스·파운드리</h1>
<p class="sub">Fabless / Foundry · 보통 알아 둘 말</p>
<p class="lead">팹리스는 공장 없이 칩 설계만 하는 회사(엔비디아), 파운드리는 남의 칩을 만들어 주는 공장(TSMC).</p><section class="box"><h3>비유하면</h3><p>레시피만 쓰는 요리 연구가와 주문받아 만드는 공장.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/capex.html">설비 투자(CAPEX)</a></p></section>
