<h1>잉여현금흐름(FCF)</h1>
<p class="sub">Free cash flow · 깊이 알아 둘 말</p>
<p class="lead">장사로 들어온 현금에서 설비 투자에 쓴 돈을 뺀 것. 주주에게 돌려줄 수 있는 진짜 돈.</p><section class="box"><h3>비유하면</h3><p>월급에서 생활비와 차 수리비를 빼고 남은 돈.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/ebitda.html">에비타(EBITDA)</a> · <a href="../../../learn/deal/t/capex.html">설비 투자(CAPEX)</a> · <a href="../../../learn/deal/t/dcf.html">현금흐름 할인(DCF)</a></p></section>
