<h1>모태펀드</h1>
<p class="sub">Fund of funds · 보통 알아 둘 말</p>
<p class="lead">회사에 직접 투자하지 않고 다른 펀드에 돈을 대는 펀드. 한국은 정부 돈으로 만든 한국모태펀드(2005~)가 큰 손.</p><section class="box"><h3>비유하면</h3><p>엄마 펀드. 아이 펀드(VC 펀드)들에게 종잣돈을 나눠 줘요.</p></section><section><h3>이렇게 나와요</h3><p>'모태펀드 출자사업 선정' = 그 VC가 정부 돈을 받아 새 펀드를 만든다.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/lp.html">출자자(LP)</a> · <a href="../../../learn/deal/t/fund.html">펀드</a></p></section>
