<p class="sub">Form D · 깊이 알아 둘 말</p>
<p class="lead">미국 비상장 회사가 투자를 받으면 SEC에 내는 짧은 신고서.</p><section class="box"><h3>비유하면</h3><p>'우리 이만큼 투자받았어요'라고 관공서에 내는 한 장짜리 쪽지.</p></section><section><h3>이렇게 나와요</h3><p>기사에 안 난 투자도 여기엔 남아요. 이 앱의 '조용한 돈'이 그것.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/disclosure.html">공시</a></p></section>
