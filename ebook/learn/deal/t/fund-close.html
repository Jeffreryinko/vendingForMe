<h1>펀드 결성(클로징)</h1>
<p class="sub">Fund close · 보통 알아 둘 말</p>
<p class="lead">펀드에 돈 모으기를 마감하는 것. 1차 마감(퍼스트 클로징)과 최종 마감이 있어요.</p><section class="box"><h3>비유하면</h3><p>계모임 인원 모집 끝. 이제부터 투자를 시작해요.</p></section><section><h3>이렇게 나와요</h3><p>'5억 달러 펀드 최종 클로징' = 5억 달러를 다 모았다. 회사가 받은 투자가 아니에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/fund.html">펀드</a> · <a href="../../../learn/deal/t/lp.html">출자자(LP)</a></p></section>
