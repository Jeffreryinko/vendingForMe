<h1>매출총이익률</h1>
<p class="sub">Gross margin · 보통 알아 둘 말</p>
<p class="lead">매출에서 물건을 만드는 직접 비용을 뺀 것의 비율. 소프트웨어는 80% 안팎, 유통은 20~30%.</p><section class="box"><h3>비유하면</h3><p>김밥 3,000원에 재료비 1,200원이면 60%.</p></section><section><h3>이렇게 나와요</h3><p>이 숫자가 높아야 회사가 커질수록 이익이 남아요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/op-profit.html">영업이익</a> · <a href="../../../learn/deal/t/unit-econ.html">유닛 이코노믹스</a></p></section>
