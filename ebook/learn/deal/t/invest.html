<h1>투자 유치</h1>
<p class="sub">Fundraising · 꼭 알아 둘 말</p>
<p class="lead">회사가 지분을 내주고 투자자에게 돈을 받는 일.</p><section class="box"><h3>비유하면</h3><p>가게 주인이 '가게의 20%를 줄 테니 2억 원을 넣어 달라'고 하는 것.</p></section><section><h3>이렇게 나와요</h3><p>'A사, 100억 원 투자 유치' = A사가 새 주식을 찍어 주고 100억 원을 받았다.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 170" role="img" xmlns="http://www.w3.org/2000/svg"><path d="M84 82L84 22A60 60 0 0 1 141.06339097770922 63.45898033750316Z" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><path d="M84 82L141.06339097770922 63.45898033750316A60 60 0 1 1 83.99999999999999 22Z" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/><text x="84" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">회사 = 피자 한 판</text><path d="M112 40L150 36M150 36L145.06456749607509 39.411965122799685M150 36L144.46230478566036 33.69046937385974" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="154" y="14" width="160" height="44" rx="8" fill="var(--accent-soft)"/><text x="234" y="33" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">지분 20%를 100억에 샀다</text><text x="234" y="49" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">= 조각 2개 값이 100억</text><rect x="154" y="76" width="160" height="62" rx="8" fill="var(--sunk)"/><text x="234" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)">그럼 한 판 값은?</text><text x="234" y="116" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--ink)">100억 ÷ 0.2 = 500억</text><text x="234" y="131" text-anchor="middle" font-size="10" font-weight="500" fill="var(--muted)">(이게 '기업가치')</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/round.html">라운드</a> · <a href="../../../learn/deal/t/equity.html">지분</a> · <a href="../../../learn/deal/t/valuation.html">기업가치(밸류에이션)</a></p></section>
