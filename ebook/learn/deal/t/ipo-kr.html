<h1>따상·공모주 청약</h1>
<p class="sub">IPO subscription · 보통 알아 둘 말</p>
<p class="lead">공모주 청약은 상장 전에 공모가로 주식을 신청하는 것. '따상'은 첫날 공모가의 두 배로 시작해 상한가까지 가는 것을 부르던 말.</p><section><h3>이렇게 나와요</h3><p>2023년부터 첫날 가격 제한이 공모가의 60~400%로 넓어졌어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/offer-price.html">공모가</a> · <a href="../../../learn/deal/t/bookbuilding.html">수요예측</a></p></section>
