<h1>내부수익률(IRR)</h1>
<p class="sub">IRR · 깊이 알아 둘 말</p>
<p class="lead">투자한 돈이 해마다 몇 %씩 불어난 셈인지 나타내는 수익률.</p><section class="box"><h3>비유하면</h3><p>같은 2배라도 3년 만에 벌면 IRR이 높고 10년 걸리면 낮아요. 시간까지 따지는 성적표.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 150" role="img" xmlns="http://www.w3.org/2000/svg"><path d="M20 60H300" stroke="var(--muted)" stroke-dasharray="3 3"/><path d="M20 60C60 62 80 118 120 112S200 40 300 14" stroke="var(--accent)" stroke-width="3" fill="none" stroke-linecap="round"/><text x="20" y="52" text-anchor="start" font-size="10" font-weight="500" fill="var(--muted)">0</text><text x="96" y="136" text-anchor="middle" font-size="10.5" font-weight="500" fill="#D9534F">처음 몇 해: 수수료·실패가 먼저</text><text x="240" y="44" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--up)">나중: 대박 회수</text><text x="20" y="146" text-anchor="start" font-size="9.5" font-weight="500" fill="var(--muted)">1년</text><text x="300" y="146" text-anchor="end" font-size="9.5" font-weight="500" fill="var(--muted)">10년</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/moic.html">투자 배수(MOIC)</a> · <a href="../../../learn/deal/t/fund.html">펀드</a></p></section>
