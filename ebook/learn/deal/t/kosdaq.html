<h1>코스피·코스닥</h1>
<p class="sub">KOSPI / KOSDAQ · 보통 알아 둘 말</p>
<p class="lead">한국의 두 주식시장. 코스피는 큰 회사, 코스닥(1996~)은 기술·성장 회사 중심.</p><section class="box"><h3>비유하면</h3><p>코스피가 백화점이라면 코스닥은 신생 브랜드가 모인 편집숍. 미국의 뉴욕증권거래소와 나스닥에 해당해요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/ipo.html">기업공개(IPO)·상장</a> · <a href="../../../learn/deal/t/public.html">상장사</a></p></section>
