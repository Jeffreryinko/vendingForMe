<h1>대출</h1>
<p class="sub">Loan · 보통 알아 둘 말</p>
<p class="lead">은행 같은 곳에서 직접 빌린 돈.</p><section class="box"><h3>비유하면</h3><p>채권이 '여러 사람에게 판 각서'라면 대출은 '은행 한 곳과 맺은 약속'.</p></section><section><h3>이렇게 나와요</h3><p>'인수금융 대출 1조 원' = 회사를 사려고 빌린 돈.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 190" role="img" xmlns="http://www.w3.org/2000/svg"><rect x="110" y="8" width="100" height="34" rx="8" fill="var(--ink)"/><text x="160" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="var(--surface)">회사</text><path d="M125 46L80 74M80 74L82.95101511745084 68.77587234300533M80 74L85.9903921169039 73.6605853778406" stroke="var(--muted)" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M195 46L240 74M240 74L234.0096078830961 73.6605853778406M240 74L237.04898488254915 68.77587234300533" stroke="var(--muted)" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="10" y="78" width="140" height="104" rx="8" fill="var(--sunk)"/><text x="80" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">빚 (대출·채권)</text><text x="80" y="120" text-anchor="middle" font-size="11.5" font-weight="500" fill="var(--ink)">이자를 내요</text><text x="80" y="137" text-anchor="middle" font-size="11.5" font-weight="500" fill="var(--ink)">꼭 갚아야 해요</text><text x="80" y="154" text-anchor="middle" font-size="11.5" font-weight="500" fill="var(--ink)">주인은 그대로</text><text x="80" y="173" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">은행은 이자만 받음</text><rect x="170" y="78" width="140" height="104" rx="8" fill="var(--accent-soft)"/><text x="240" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent)">지분 (투자)</text><text x="240" y="120" text-anchor="middle" font-size="11.5" font-weight="500" fill="var(--ink)">이자가 없어요</text><text x="240" y="137" text-anchor="middle" font-size="11.5" font-weight="500" fill="var(--ink)">안 갚아도 돼요</text><text x="240" y="154" text-anchor="middle" font-size="11.5" font-weight="500" fill="var(--ink)">회사 조각을 내줘요</text><text x="240" y="173" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">잘되면 투자자도 같이 벎</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/debt.html">부채(빚)</a> · <a href="../../../learn/deal/t/lbo.html">차입 매수(LBO)</a></p></section>
