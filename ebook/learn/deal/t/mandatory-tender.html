<h1>의무 공개매수</h1>
<p class="sub">Mandatory tender offer · 깊이 알아 둘 말</p>
<p class="lead">경영권 지분을 살 때 일반 주주의 주식도 같은 값에 사 주도록 하는 제도. 한국은 도입을 추진해 왔어요.</p><section><h3>이렇게 나와요</h3><p>지금까지는 대주주만 경영권 프리미엄을 받고 팔 수 있었어요.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 170" role="img" xmlns="http://www.w3.org/2000/svg"><text x="160" y="14" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">공개매수: 모든 주주에게 같은 값으로 '파세요'</text><rect x="40" y="68" width="80" height="60" rx="8" fill="var(--sunk)"/><text x="80" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">10,000원</text><text x="80" y="144" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)">지금 주가</text><rect x="200" y="38" width="80" height="90" rx="8" fill="var(--accent)"/><text x="240" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent-ink)">13,000원</text><text x="240" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">공개매수 값</text><path d="M128 96L192 76M192 76L187.83219398903591 80.3161780610827M192 76L186.1161861981995 74.82495313040623" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="160" y="70" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--accent)">+30% 웃돈</text><text x="160" y="163" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">기간(보통 20일~두 달)과 살 수량을 미리 알려요</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/tender.html">공개매수</a> · <a href="../../../learn/deal/t/premium.html">프리미엄</a> · <a href="../../../learn/deal/t/minority-sh.html">소액 주주·일반 주주</a></p></section>
