<h1>관리보수</h1>
<p class="sub">Management fee · 깊이 알아 둘 말</p>
<p class="lead">운용사가 펀드를 굴리는 수고비로 매년 받는 돈. 보통 약정액의 2% 안팎.</p><section class="box"><h3>비유하면</h3><p>농부의 월급. 풍년이든 흉년이든 받아요.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 150" role="img" xmlns="http://www.w3.org/2000/svg"><text x="160" y="14" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">펀드가 100을 벌면</text><rect x="8" y="24" width="242" height="40" rx="6" fill="var(--ink)"/><text x="129" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="var(--surface)">출자자(LP) 몫 80</text><rect x="252" y="24" width="60" height="40" rx="6" fill="var(--accent)"/><text x="282" y="49" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent-ink)">운용사 20</text><text x="282" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--accent)">성과보수(캐리)</text><text x="129" y="80" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">원금을 다 돌려준 다음의 이익만 나눠요</text><rect x="8" y="96" width="304" height="44" rx="8" fill="var(--sunk)"/><text x="160" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">따로, 해마다 맡긴 돈의 2%쯤을 관리보수로 받아요</text><text x="160" y="131" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">'2와 20' — 월급은 2, 큰돈은 20에서</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/carry.html">성과보수(캐리)</a> · <a href="../../../learn/deal/t/gp.html">운용사(GP)</a></p></section>
