<h1>순이익</h1>
<p class="sub">Net income · 보통 알아 둘 말</p>
<p class="lead">영업이익에서 이자·세금까지 다 뺀 최종 이익.</p><section class="box"><h3>비유하면</h3><p>사장이 진짜 집에 가져갈 수 있는 돈.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 176" role="img" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="24" width="300" height="28" rx="6" fill="var(--ink)"/><text x="160" y="43" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--surface)">매출 100  (계산대에 찍힌 총액)</text><rect x="10" y="62" width="90" height="28" rx="6" fill="var(--accent)"/><text x="55" y="81" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent-ink)">영업이익 30</text><rect x="102" y="62" width="208" height="28" rx="6" fill="var(--sunk)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="206" y="81" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">− 재료비·인건비·월세 70</text><rect x="10" y="100" width="60" height="28" rx="6" fill="var(--up)"/><text x="40" y="119" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">순이익 20</text><text x="80" y="119" text-anchor="start" font-size="10.5" font-weight="500" fill="var(--muted)">− 이자·세금 10</text><text x="160" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">장사 실력은 영업이익, 주주 몫은 순이익</text><text x="160" y="166" text-anchor="middle" font-size="10" font-weight="500" fill="var(--muted)">적자 스타트업은 이익 대신 '매출이 얼마나 빨리 크나'를 봐요</text><text x="160" y="14" text-anchor="middle" font-size="10" font-weight="500" fill="var(--muted)">가게로 치면</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/op-profit.html">영업이익</a> · <a href="../../../learn/deal/t/per.html">주가수익비율(PER)</a></p></section>
