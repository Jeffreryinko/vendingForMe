<h1>주가수익비율(PER)</h1>
<p class="sub">P/E ratio · 보통 알아 둘 말</p>
<p class="lead">시가총액 ÷ 순이익. 이익의 몇 년 치로 값이 매겨졌나.</p><section class="box"><h3>비유하면</h3><p>PER 20배 = 지금 이익이 20년 이어져야 본전. 높을수록 '앞으로 더 벌 것'이라는 기대가 큰 것.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 110" role="img" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="26" width="84" height="46" rx="8" fill="var(--sunk)"/><text x="52" y="46" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">1년 이익</text><text x="52" y="63" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)">100억</text><text x="110" y="55" text-anchor="middle" font-size="18" font-weight="500" fill="var(--muted)">×</text><rect x="126" y="26" width="68" height="46" rx="8" fill="var(--accent-soft)"/><text x="160" y="46" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--accent)">배수</text><text x="160" y="63" text-anchor="middle" font-size="14" font-weight="800" fill="var(--accent)">12배</text><text x="210" y="55" text-anchor="middle" font-size="18" font-weight="500" fill="var(--muted)">=</text><rect x="226" y="26" width="84" height="46" rx="8" fill="var(--ink)"/><text x="268" y="46" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--surface)">회사 값</text><text x="268" y="63" text-anchor="middle" font-size="14" font-weight="800" fill="var(--surface)">1,200억</text><text x="160" y="94" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">배수는 업종마다 달라요 — 빨리 크는 업종일수록 높게 쳐요</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/multiple.html">멀티플(배수)</a> · <a href="../../../learn/deal/t/net-income.html">순이익</a> · <a href="../../../learn/deal/t/pbr.html">주가순자산비율(PBR)</a></p></section>
