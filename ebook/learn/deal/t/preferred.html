<h1>우선주</h1>
<p class="sub">Preferred stock · 보통 알아 둘 말</p>
<p class="lead">투자자가 받는 주식. 회사가 팔리거나 망할 때 먼저 돌려받는 권리가 붙어요.</p><section class="box"><h3>비유하면</h3><p>앞줄 좌석. 불이 나면 먼저 나갈 수 있어요.</p></section><section><h3>이렇게 나와요</h3><p>스타트업 투자는 거의 다 우선주(한국은 상환전환우선주가 많음)로 해요.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 160" role="img" xmlns="http://www.w3.org/2000/svg"><text x="160" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">100억 투자받은 회사가 150억에 팔리면</text><rect x="20" y="30" width="280" height="26" rx="6" fill="var(--sunk)"/><rect x="20" y="30" width="187" height="26" rx="6" fill="var(--accent)"/><text x="113" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent-ink)">① 투자자가 먼저 100억</text><text x="254" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">② 남은 50억</text><path d="M254 60L254 82M254 82L251.12344676837478 76.73450462865776M254 82L256.8765532316252 76.73450462865776" stroke="var(--muted)" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="170" y="86" width="130" height="30" rx="6" fill="var(--ink)"/><text x="235" y="106" text-anchor="middle" font-size="11" font-weight="500" fill="var(--surface)">창업자·직원이 나눔</text><text x="160" y="138" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">신문엔 '150억 매각'이지만 창업팀 몫은 50억일 수 있어요</text><text x="160" y="153" text-anchor="middle" font-size="9.5" font-weight="500" fill="var(--muted)">(우선주에 붙은 '청산 우선권' 때문 — 조건은 계약마다 달라요)</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/common.html">보통주</a> · <a href="../../../learn/deal/t/liq-pref.html">청산 우선권</a> · <a href="../../../learn/deal/t/rcps.html">상환전환우선주(RCPS)</a></p></section>
