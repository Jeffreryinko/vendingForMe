<h1>상장사</h1>
<p class="sub">Public company · 꼭 알아 둘 말</p>
<p class="lead">주식이 거래소에서 매일 사고팔리는 회사. 누구나 살 수 있고 정보를 공개(공시)해야 해요.</p><section class="box"><h3>비유하면</h3><p>시장 한복판에 좌판을 편 가게. 값이 매 순간 바뀌어요.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 150" role="img" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="10" width="148" height="132" rx="8" fill="var(--sunk)"/><text x="82" y="32" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)">비상장</text><text x="82" y="54" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">🔒 허락받은 사람만 사요</text><text x="82" y="74" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">값은 투자받을 때만 정해져요</text><text x="82" y="94" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">공개 의무가 적어요</text><text x="82" y="126" text-anchor="middle" font-size="10" font-weight="500" fill="var(--muted)">스타트업 대부분</text><rect x="164" y="10" width="148" height="132" rx="8" fill="var(--up-soft)"/><text x="238" y="32" text-anchor="middle" font-size="14" font-weight="800" fill="var(--up)">상장</text><text x="238" y="54" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">🏪 누구나 거래소에서 사요</text><text x="238" y="74" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">값이 매일 바뀌어요 (주가)</text><text x="238" y="94" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">중요한 일을 공시해야 해요</text><text x="238" y="126" text-anchor="middle" font-size="10" font-weight="500" fill="var(--muted)">삼성전자, 쿠팡, 네이버…</text><path d="M150 112L170 112M170 112L164.73450462865776 114.87655323162522M170 112L164.73450462865776 109.12344676837478" stroke="var(--up)" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/ipo.html">기업공개(IPO)·상장</a> · <a href="../../../learn/deal/t/mcap.html">시가총액</a> · <a href="../../../learn/deal/t/disclosure.html">공시</a></p></section>
