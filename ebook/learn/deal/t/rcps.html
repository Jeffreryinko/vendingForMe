<h1>상환전환우선주(RCPS)</h1>
<p class="sub">RCPS · 깊이 알아 둘 말</p>
<p class="lead">돈으로 돌려달라고 할 권리(상환) + 보통주로 바꿀 권리(전환)가 붙은 우선주. 한국 벤처 투자의 표준.</p><section class="box"><h3>비유하면</h3><p>환불도 되고 교환도 되는 상품권.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 168" role="img" xmlns="http://www.w3.org/2000/svg"><rect x="100" y="8" width="120" height="36" rx="8" fill="var(--ink)"/><text x="160" y="31" text-anchor="middle" font-size="12" font-weight="700" fill="var(--surface)">전환사채(CB)</text><path d="M130 48L82 74M82 74L85.25985394975426 68.96280313802691M82 74L87.99996160996133 74.02146343379381" stroke="var(--muted)" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M190 48L238 74M238 74L232.00003839003867 74.02146343379381M238 74L234.74014605024573 68.96280313802691" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="8" y="78" width="146" height="80" rx="8" fill="var(--sunk)"/><text x="81" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">주가가 안 오르면</text><text x="81" y="117" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">채권으로 들고 있기</text><text x="81" y="133" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">이자 받고</text><text x="81" y="149" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">만기에 원금 돌려받기</text><rect x="166" y="78" width="146" height="80" rx="8" fill="var(--accent-soft)"/><text x="239" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent)">주가가 오르면</text><text x="239" y="117" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">미리 정한 값에</text><text x="239" y="133" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">주식으로 바꾸기</text><text x="239" y="149" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--accent)">→ 차익은 내 것</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/preferred.html">우선주</a> · <a href="../../../learn/deal/t/cb.html">전환사채
