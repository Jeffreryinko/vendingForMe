<h1>우회 상장(역합병)</h1>
<p class="sub">Reverse merger · 깊이 알아 둘 말</p>
<p class="lead">비상장 회사가 상장사와 합쳐 심사 없이 상장 효과를 얻는 것.</p><section class="box"><h3>비유하면</h3><p>뒷문 입장.</p></section><section><h3>이렇게 나와요</h3><p>카카오-다음(2014). 스팩 합병도 같은 원리.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 170" role="img" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="20" width="96" height="74" rx="8" fill="var(--sunk)"/><text x="56" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">① 빈 회사가</text><text x="56" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">먼저 상장</text><text x="56" y="76" text-anchor="middle" font-size="10" font-weight="500" fill="var(--muted)">가진 것: 현금뿐</text><path d="M106 57L114 57M114 57L108.73450462865776 59.876553231625216M114 57L108.73450462865776 54.123446768374784" stroke="var(--muted)" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="116" y="20" width="88" height="74" rx="8" fill="var(--sunk)"/><text x="160" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">② 2년 안에</text><text x="160" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">진짜 회사 찾기</text><text x="160" y="76" text-anchor="middle" font-size="10" font-weight="500" fill="var(--muted)">못 찾으면 해산</text><path d="M206 57L214 57M214 57L208.73450462865776 59.876553231625216M214 57L208.73450462865776 54.123446768374784" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="216" y="20" width="96" height="74" rx="8" fill="var(--accent-soft)"/><text x="264" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">③ 합병</text><text x="264" y="56" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">진짜 회사가</text><text x="264" y="72" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">상장사가 됨</text><text x="160" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">처음 돈 낸 사람은 합병이 싫으면 원금을 돌려받아요</text><text x="160" y="136" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">만든 쪽(스폰서)은 지분 20%쯤을 거의 공짜로 받아요</text><text x="160" y="154" text-anchor="middle" font-size="10.5" font-weight="500" fill="#D9534F">그래서 합병 뒤에 산 사람의 몫이 묽어져요</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/spac.html">스팩(SPAC)</a> · <a href="../../../learn/deal/t/merger.html">합병</a> · <a href="../../../learn/deal/t/ipo.html">기업공개(IPO)·상장</a></p></section>
