<h1>증권신고서(S-1)</h1>
<p class="sub">S-1 / Prospectus · 깊이 알아 둘 말</p>
<p class="lead">상장하려는 회사가 당국에 내는 두꺼운 자기소개서. 사업·숫자·위험이 다 들어 있어요.</p><section class="box"><h3>비유하면</h3><p>입학 원서 + 성적표. 미국은 S-1, 인도는 DRHP, 한국은 증권신고서.</p></section><section><h3>이렇게 나와요</h3><p>'S-1 제출 / files for IPO' = 상장 절차를 공식 시작했다(아직 상장은 아님).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/ipo.html">기업공개(IPO)·상장</a> · <a href="../../../learn/deal/t/disclosure.html">공시</a></p></section>
