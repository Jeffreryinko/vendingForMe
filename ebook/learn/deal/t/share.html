<h1>주식</h1>
<p class="sub">Share / Stock · 꼭 알아 둘 말</p>
<p class="lead">지분을 잘게 쪼개 종이(증서)로 만든 것. 주식을 가진 사람이 주주.</p><section class="box"><h3>비유하면</h3><p>피자 조각마다 붙인 이름표. 이름표를 사고팔면 주인이 바뀌어요.</p></section><section><h3>이렇게 나와요</h3><p>'주당 25달러에 인수' = 주식 한 장에 25달러씩 쳐서 전부 산다.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 170" role="img" xmlns="http://www.w3.org/2000/svg"><path d="M84 82L84 22A60 60 0 0 1 141.06339097770922 63.45898033750316Z" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><path d="M84 82L141.06339097770922 63.45898033750316A60 60 0 1 1 83.99999999999999 22Z" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/><text x="84" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">회사 = 피자 한 판</text><path d="M112 40L150 36M150 36L145.06456749607509 39.411965122799685M150 36L144.46230478566036 33.69046937385974" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="154" y="14" width="160" height="44" rx="8" fill="var(--accent-soft)"/><text x="234" y="33" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">지분 20%를 100억에 샀다</text><text x="234" y="49" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">= 조각 2개 값이 100억</text><rect x="154" y="76" width="160" height="62" rx="8" fill="var(--sunk)"/><text x="234" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)">그럼 한 판 값은?</text><text x="234" y="116" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--ink)">100억 ÷ 0.2 = 500억</text><text x="234" y="131" text-anchor="middle" font-size="10" font-weight="500" fill="var(--muted)">(이게 '기업가치')</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/equity.html">지분</a> · <a href="../../../learn/deal/t/common.html">보통주</a> · <a href="../../../learn/deal/t/preferred.html">우선주</a></p></section>
