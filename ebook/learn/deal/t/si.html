<h1>전략적 투자자(SI)</h1>
<p class="sub">Strategic investor · 보통 알아 둘 말</p>
<p class="lead">사업에 도움이 돼서 투자하는 회사. 같은 업종 기업이 많아요.</p><section class="box"><h3>비유하면</h3><p>옆 가게 사장이 '같이 하면 좋겠다'며 넣는 돈.</p></section><section><h3>이렇게 나와요</h3><p>'국내 SI 참전' = 같은 업종 기업이 인수전에 뛰어들었다.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/fi.html">재무적 투자자(FI)</a> · <a href="../../../learn/deal/t/cvc.html">기업형 벤처캐피털(CVC)</a> · <a href="../../../learn/deal/t/synergy.html">시너지</a></p></section>
