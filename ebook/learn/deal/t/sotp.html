<h1>사업별 가치 합산(SOTP)</h1>
<p class="sub">Sum of the parts · 깊이 알아 둘 말</p>
<p class="lead">여러 사업을 하는 회사를 사업마다 따로 값 매겨 더하는 방법.</p><section class="box"><h3>비유하면</h3><p>세트 메뉴를 단품 값으로 따져 보기.</p></section><section><h3>이렇게 나와요</h3><p>'쪼개면 더 비싸다'는 행동주의 펀드의 단골 논리.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/discount.html">할인(디스카운트)</a> · <a href="../../../learn/deal/t/spin-off.html">분할(스핀오프)</a></p></section>
