<h1>숏 스퀴즈</h1>
<p class="sub">Short squeeze · 깊이 알아 둘 말</p>
<p class="lead">공매도한 쪽이 주가 급등에 쫓겨 서둘러 되사면서 값이 더 뛰는 것.</p><section><h3>이렇게 나와요</h3><p>게임스톱(2021).</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 196" role="img" xmlns="http://www.w3.org/2000/svg"><text x="160" y="14" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">공매도: 빌려서 먼저 팔고, 나중에 사서 갚기</text><rect x="8" y="24" width="92" height="46" rx="8" fill="var(--sunk)"/><text x="54" y="43" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">① 빌려서 판다</text><text x="54" y="60" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">100원에</text><path d="M102 47L114 47M114 47L108.73450462865776 49.876553231625216M114 47L108.73450462865776 44.123446768374784" stroke="var(--muted)" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="116" y="24" width="196" height="46" rx="8" fill="var(--accent-soft)"/><text x="214" y="43" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">② 값이 60원으로 내리면</text><text x="214" y="60" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">60원에 사서 갚음 → 40원 벎</text><rect x="8" y="82" width="304" height="62" rx="8" fill="var(--surface)" stroke="#D9534F" stroke-width="1.5"/><text x="160" y="101" text-anchor="middle" font-size="11.5" font-weight="700" fill="#D9534F">거꾸로 150원으로 오르면?</text><text x="160" y="118" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">150원에 사서 갚아야 함 → 50원 잃음</text><text x="160" y="134" text-anchor="middle" font-size="10" font-weight="500" fill="var(--muted)">잃을 수 있는 돈에 끝이 없어요 (주가는 끝없이 오를 수 있으니)</text><text x="160" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">숏 스퀴즈 = 공매도한 사람들이 겁나서 한꺼번에 되사는 것</text><text x="160" y="181" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">되사니까 더 오르고, 더 오르니 또 되사요</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/short.html">공매도</a></p></section>
