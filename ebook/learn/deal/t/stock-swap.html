<h1>주식 교환</h1>
<p class="sub">Stock swap / All-stock deal · 깊이 알아 둘 말</p>
<p class="lead">현금 대신 사는 회사의 주식을 주고 인수하는 것.</p><section class="box"><h3>비유하면</h3><p>돈 대신 우리 가게 조각을 주고 너희 가게를 받는 맞교환.</p></section><section><h3>이렇게 나와요</h3><p>'전액 주식 교환 방식(all-stock deal)'.</p></section><div class="fig"><svg class="fg" viewBox="0 0 320 160" role="img" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="24" width="108" height="44" rx="8" fill="var(--ink)"/><text x="62" y="51" text-anchor="middle" font-size="12" font-weight="700" fill="var(--surface)">사는 회사 A</text><rect x="204" y="24" width="108" height="44" rx="8" fill="var(--sunk)" stroke="var(--muted)" stroke-width="1.5"/><text x="258" y="43" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">팔리는 회사 B의</text><text x="258" y="59" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">주주들</text><path d="M120 36L200 36M200 36L194.73450462865776 38.876553231625216M200 36L194.73450462865776 33.123446768374784" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="160" y="30" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--accent)">A의 새 주식</text><path d="M200 58L120 58M120 58L125.26549537134224 55.123446768374784M120 58L125.26549537134224 60.876553231625216" stroke="var(--muted)" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="160" y="74" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">B 주식 전부</text><rect x="8" y="92" width="304" height="58" rx="8" fill="var(--accent-soft)"/><text x="160" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)">현금이 한 푼도 안 들어요</text><text x="160" y="128" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--ink)">대신 A의 주주는 지분이 묽어져요(희석)</text><text x="160" y="143" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)">A 주가가 비쌀수록 적은 주식으로 살 수 있어요</text></svg></div><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/merger.html">합병</a></p></section>
