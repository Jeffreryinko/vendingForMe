<h1>티저·투자 설명서(IM)</h1>
<p class="sub">Teaser / IM · 깊이 알아 둘 말</p>
<p class="lead">매각 때 살 사람들에게 돌리는 자료. 티저는 이름을 가린 한 장, IM은 NDA 뒤에 주는 자세한 책자.</p><section class="box"><h3>비유하면</h3><p>매물 전단지와 상세 설명서.</p></section><section><h3>이렇게 나와요</h3><p>'티저 레터 발송' = 매각 절차가 시작됐다.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/bid.html">입찰·본입찰·우선협상대상자</a> · <a href="../../../learn/deal/t/nda.html">비밀 유지 계약(NDA)</a> · <a href="../../../learn/deal/t/stake-sale.html">'매각'과 '매물'</a></p></section>
