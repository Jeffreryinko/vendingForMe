<h1>팁스(TIPS)</h1>
<p class="sub">TIPS · 보통 알아 둘 말</p>
<p class="lead">한국 정부 프로그램. 민간 투자사가 먼저 고른 초기 회사에 정부가 연구개발비를 얹어 줘요.</p><section class="box"><h3>비유하면</h3><p>선생님(투자사)이 추천한 학생에게 나라가 장학금을 주는 제도.</p></section><section><h3>이렇게 나와요</h3><p>'팁스 선정' = 투자사 추천 + 정부 지원금을 받게 됐다.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/seed.html">시드</a> · <a href="../../../learn/deal/t/grant.html">지원금·보조금</a></p></section>
