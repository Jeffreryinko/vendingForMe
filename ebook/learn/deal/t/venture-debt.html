<p class="sub">Venture debt · 깊이 알아 둘 말</p>
<p class="lead">투자를 받은 스타트업에 빌려주는 돈. 지분을 덜 내주고 런웨이를 늘려요.</p><section class="box"><h3>비유하면</h3><p>투자금이라는 월급이 들어올 걸 믿고 내주는 마이너스 통장.</p></section><section><h3>이렇게 나와요</h3><p>실리콘밸리은행이 이걸로 유명했어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/debt.html">부채(빚)</a> · <a href="../../../learn/deal/t/runway.html">런웨이</a> · <a href="../../../learn/deal/t/warrant.html">신주인수권(워런트)</a></p></section>
