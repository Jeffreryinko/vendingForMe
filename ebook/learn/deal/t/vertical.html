<h1>수직·수평 결합</h1>
<p class="sub">Vertical / Horizontal · 보통 알아 둘 말</p>
<p class="lead">수평: 경쟁사끼리 합침. 수직: 원료-제조-판매처럼 위아래 단계를 합침.</p><section class="box"><h3>비유하면</h3><p>빵집이 옆 빵집을 사면 수평, 밀가루 공장을 사면 수직.</p></section><section><h3>이렇게 나와요</h3><p>수평 결합이 반독점 심사에서 더 깐깐하게 봐져요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/antitrust.html">기업결합 심사(반독점)</a> · <a href="../../../learn/deal/t/synergy.html">시너지</a></p></section>
