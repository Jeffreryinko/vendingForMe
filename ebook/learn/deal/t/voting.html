<h1>의결권·차등 의결권</h1>
<p class="sub">Voting rights / Dual-class · 보통 알아 둘 말</p>
<p class="lead">주총에서 표를 던질 권리. 보통 한 주 한 표지만, 창업자 주식에 여러 표를 주는 나라도 있어요.</p><section><h3>이렇게 나와요</h3><p>구글, 메타, 쿠팡이 차등 의결권. 한국은 비상장 벤처에만 일부 허용(2023~).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/control.html">경영권</a> · <a href="../../../learn/deal/t/agm.html">주주총회</a> · <a href="../../../learn/deal/t/preferred.html">우선주</a></p></section>
