<h1>워크아웃·법정관리(회생)</h1>
<p class="sub">Workout / Court receivership · 보통 알아 둘 말</p>
<p class="lead">빚을 못 갚게 된 회사를 살리는 두 절차. 워크아웃은 채권단과 합의, 법정관리(회생)는 법원이 주도.</p><section><h3>이렇게 나와요</h3><p>태영건설(워크아웃 2024), 홈플러스(회생 2025), 티몬·위메프(회생 2024).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/deal/t/distressed.html">부실 자산 인수·회생 M&amp;A</a> · <a href="../../../learn/deal/t/debt.html">부채(빚)</a></p></section>
