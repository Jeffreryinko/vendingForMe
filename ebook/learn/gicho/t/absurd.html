<h1>부조리</h1>
<p class="sub">The Absurd · 보통 알아 둘 말</p>
<p class="lead">의미를 찾으려는 사람과 아무 대답 없는 세계 사이의 어긋남(카뮈).</p><section class="box"><h3>비유하면</h3><p>바위를 밀어 올리면 굴러떨어지고, 다시 밀어 올리는 시시포스.</p></section><section><h3>이렇게 나와요</h3><p>카뮈의 답: 도망치지도 포기하지도 말고 그 어긋남을 안은 채 살아라. '시시포스가 행복하다고 상상해야 한다.'</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/exist.html">실존주의</a> · <a href="../../../learn/gicho/t/nihil.html">허무주의</a></p></section>
