<h1>절대영도</h1>
<p class="sub">Absolute zero · 보통 알아 둘 말</p>
<p class="lead">더 내려갈 수 없는 가장 낮은 온도. 0켈빈 = 영하 273.15도.</p><section class="box"><h3>비유하면</h3><p>관객이 모두 자리에 앉아 버린 상태. 그런데 양자역학 때문에 완전히 멈추지는 못해요.</p></section><section><h3>이렇게 나와요</h3><p>초전도, 양자컴퓨터는 절대영도 가까이에서 작동해요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/temp.html">온도</a> · <a href="../../../learn/gicho/t/uncert.html">불확정성 원리</a></p></section>
