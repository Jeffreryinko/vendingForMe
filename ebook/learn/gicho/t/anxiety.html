<h1>불안 장애</h1>
<p class="sub">Anxiety disorder · 보통 알아 둘 말</p>
<p class="lead">실제 위험에 비해 지나친 걱정과 두려움이 오래 이어져 생활을 방해하는 상태.</p><section class="box"><h3>비유하면</h3><p>너무 예민하게 맞춰진 화재경보기.</p></section><section><h3>이렇게 나와요</h3><p>공황 장애, 사회 불안, 범불안 장애. 피할수록 두려움이 커지고, 조금씩 마주할수록 줄어요(노출).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/amyg.html">편도체</a> · <a href="../../../learn/gicho/t/cbt.html">인지행동치료</a> · <a href="../../../learn/gicho/t/stress.html">스트레스 반응</a></p></section>
