<h1>선험과 후험</h1>
<p class="sub">A priori / a posteriori · 깊이 알아 둘 말</p>
<p class="lead">경험하기 전에 알 수 있는 것(선험)과 경험해 봐야 아는 것(후험).</p><section class="box"><h3>비유하면</h3><p>'총각은 결혼하지 않았다'는 조사 없이 알고, '철수는 총각이다'는 알아봐야 알아요.</p></section><section><h3>이렇게 나와요</h3><p>칸트는 시간·공간·인과 같은 틀은 경험보다 먼저 우리 안에 있다고 봤어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/phenom.html">현상과 물자체</a> · <a href="../../../learn/gicho/t/rational.html">합리론</a> · <a href="../../../learn/gicho/t/empir.html">경험론</a></p></section>
