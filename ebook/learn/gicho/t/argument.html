<h1>논증</h1>
<p class="sub">Argument · 꼭 알아 둘 말</p>
<p class="lead">근거(전제)를 대고 거기서 주장(결론)을 이끌어 내는 것. 철학의 기본 도구.</p><section class="box"><h3>비유하면</h3><p>다리. 기둥(전제)이 튼튼하고 상판(추론)이 이어져야 건너편(결론)에 닿아요.</p></section><section><h3>이렇게 나와요</h3><p>따질 것은 두 가지 — 전제가 참인가, 전제에서 결론이 따라 나오는가.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/deduct.html">연역</a> · <a href="../../../learn/gicho/t/induct.html">귀납</a> · <a href="../../../learn/gicho/t/fallacy.html">오류</a></p></section>
