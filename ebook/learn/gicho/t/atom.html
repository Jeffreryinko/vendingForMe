<h1>원자</h1>
<p class="sub">Atom · 꼭 알아 둘 말</p>
<p class="lead">원소의 성질을 가진 가장 작은 단위. 가운데 원자핵과 그 둘레의 전자로 이루어져요.</p><section class="box"><h3>비유하면</h3><p>원자를 야구장만 하게 키우면 원자핵은 한가운데 놓인 구슬. 나머지는 거의 빈 공간이에요.</p></section><section><h3>이렇게 나와요</h3><p>사람 몸은 약 7 × 10²⁷개의 원자로 이루어져 있어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/electron.html">전자</a> · <a href="../../../learn/gicho/t/nucleus.html">원자핵</a> · <a href="../../../learn/gicho/t/periodic.html">주기율표</a> · <a href="../../../learn/gicho/t/molecule.html">분자</a></p></section>
