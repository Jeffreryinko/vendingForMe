<h1>주의</h1>
<p class="sub">Attention · 보통 알아 둘 말</p>
<p class="lead">많은 정보 가운데 일부만 골라 처리하는 기능. 용량이 한정돼 있어요.</p><section class="box"><h3>비유하면</h3><p>어두운 무대의 손전등. 비춘 곳만 보이고 나머지는 있는 줄도 몰라요.</p></section><section><h3>이렇게 나와요</h3><p>'보이지 않는 고릴라' 실험 — 공 패스를 세느라 화면을 가로지르는 고릴라를 절반쯤이 못 봤어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/wmem.html">작업 기억</a> · <a href="../../../learn/gicho/t/sys12.html">시스템 1·시스템 2</a></p></section>
