<p class="lead">머릿속에 쉽게 떠오르는 일일수록 자주 일어난다고 판단하는 경향.</p><section class="box"><h3>비유하면</h3><p>비행기 사고 뉴스를 본 뒤 비행기가 차보다 위험하게 느껴지는 것.</p></section><section><h3>이렇게 나와요</h3><p>실제로는 자동차 사고로 숨질 위험이 훨씬 커요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/heur.html">휴리스틱</a> · <a href="../../../learn/gicho/t/sys12.html">시스템 1·시스템 2</a></p></section>
