<h1>블랙홀</h1>
<p class="sub">Black hole · 보통 알아 둘 말</p>
<p class="lead">중력이 너무 세서 빛조차 빠져나오지 못하는 영역. 그 경계를 사건의 지평선이라 해요.</p><section class="box"><h3>비유하면</h3><p>폭포 바로 위의 강. 어느 선을 넘으면 아무리 빨리 헤엄쳐도 돌아올 수 없어요.</p></section><section><h3>이렇게 나와요</h3><p>2019년 사건의 지평선 망원경이 M87 은하 중심 블랙홀의 그림자를 찍었어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/grel.html">일반상대성이론</a> · <a href="../../../learn/gicho/t/gwave.html">중력파</a> · <a href="../../../learn/gicho/t/galaxy.html">은하</a></p></section>
