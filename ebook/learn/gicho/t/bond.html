<h1>화학 결합</h1>
<p class="sub">Chemical bond · 보통 알아 둘 말</p>
<p class="lead">원자들이 전자를 주고받거나(이온 결합) 함께 나눠 가지며(공유 결합) 붙어 있는 것.</p><section class="box"><h3>비유하면</h3><p>이온 결합은 돈을 빌려주고 엮인 사이, 공유 결합은 공동 명의 통장.</p></section><section><h3>이렇게 나와요</h3><p>소금(NaCl)은 이온 결합, 물(H₂O)은 공유 결합.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/electron.html">전자</a> · <a href="../../../learn/gicho/t/molecule.html">분자</a> · <a href="../../../learn/gicho/t/periodic.html">주기율표</a></p></section>
