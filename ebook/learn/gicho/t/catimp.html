<h1>정언명령</h1>
<p class="sub">Categorical imperative · 보통 알아 둘 말</p>
<p class="lead">칸트의 도덕 원칙. '네 행동의 규칙이 모든 사람의 법칙이 되어도 좋을 때에만 그렇게 하라', '사람을 수단으로만 대하지 말고 늘 목적으로 대하라'.</p><section class="box"><h3>비유하면</h3><p>'모두가 이렇게 하면 어떻게 될까?'라는 시험.</p></section><section><h3>이렇게 나와요</h3><p>모두가 거짓 약속을 하면 약속이라는 것 자체가 사라져요. 그래서 거짓 약속은 안 돼요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/deont.html">의무론</a></p></section>
</main>
