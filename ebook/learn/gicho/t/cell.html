<h1>세포</h1>
<p class="sub">Cell · 꼭 알아 둘 말</p>
<p class="lead">생명의 기본 단위. 모든 생물은 세포로 이루어지고, 세포는 세포에서만 나와요.</p><section class="box"><h3>비유하면</h3><p>생명이라는 건물의 벽돌이자, 벽돌 하나하나가 작은 공장.</p></section><section><h3>이렇게 나와요</h3><p>사람 몸의 세포는 약 30조~37조 개.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/dna.html">DNA</a> · <a href="../../../learn/gicho/t/protein.html">단백질</a> · <a href="../../../learn/gicho/t/neuron.html">뉴런</a></p></section>
