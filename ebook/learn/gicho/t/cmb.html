<h1>우주배경복사</h1>
<p class="sub">Cosmic microwave background · 보통 알아 둘 말</p>
<p class="lead">빅뱅 약 38만 년 뒤 우주가 처음 투명해졌을 때 풀려난 빛. 지금은 식어서 마이크로파로 온 하늘에서 와요.</p><section class="box"><h3>비유하면</h3><p>우주의 아기 사진. 꺼진 불의 남은 온기.</p></section><section><h3>이렇게 나와요</h3><p>1965년 펜지어스와 윌슨이 안테나 잡음을 없애려다 발견했어요. 온도는 약 2.7K.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/bigbang.html">빅뱅</a> · <a href="../../../learn/gicho/t/redshift.html">적색편이</a></p></section>
