<h1>코기토</h1>
<p class="sub">Cogito, ergo sum · 꼭 알아 둘 말</p>
<p class="lead">'나는 생각한다, 그러므로 나는 존재한다.' 모든 것을 의심해도 의심하고 있는 나는 의심할 수 없다는 데카르트의 출발점.</p><section class="box"><h3>비유하면</h3><p>꿈속이라도 꿈꾸는 나는 있어요.</p></section><section><h3>이렇게 나와요</h3><p>《방법서설》(1637). 근대 철학이 '나'에서 시작하게 된 순간.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/skeptic.html">회의주의</a> · <a href="../../../learn/gicho/t/rational.html">합리론</a> · <a href="../../../learn/gicho/t/dualism.html">심신 이원론</a></p></section>
