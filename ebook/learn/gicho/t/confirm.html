<h1>확증 편향</h1>
<p class="sub">Confirmation bias · 꼭 알아 둘 말</p>
<p class="lead">이미 믿는 것을 뒷받침하는 정보만 찾고, 반대 증거는 깎아내리는 경향.</p><section class="box"><h3>비유하면</h3><p>좋아하는 팀 경기에서는 상대 반칙만 눈에 들어오는 것.</p></section><section><h3>이렇게 나와요</h3><p>검색할 때 '○○ 효과'라고 치면 효과 있다는 글만 나와요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/falsify.html">반증 가능성</a> · <a href="../../../learn/gicho/t/dissonance.html">인지 부조화</a> · <a href="../../../learn/gicho/t/schema.html">스키마</a></p></section>
