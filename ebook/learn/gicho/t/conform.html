<h1>동조</h1>
<p class="sub">Conformity · 꼭 알아 둘 말</p>
<p class="lead">집단의 판단이나 행동에 자기 것을 맞추는 현상.</p><section class="box"><h3>비유하면</h3><p>다들 박수 칠 때 혼자 가만있기 어려운 것.</p></section><section><h3>이렇게 나와요</h3><p>애시의 선분 실험(1951) — 뻔히 틀린 답을 여럿이 말하면 참가자의 약 3분의 1의 응답이 따라갔어요. 한 명이라도 다른 답을 말하면 동조가 크게 줄어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/obey.html">권위에 대한 복종</a> · <a href="../../../learn/gicho/t/bystander.html">방관자 효과</a></p></section>
