<h1>사회계약</h1>
<p class="sub">Social contract · 꼭 알아 둘 말</p>
<p class="lead">국가의 권위는 신이나 혈통이 아니라 사람들 사이의 합의에서 나온다는 생각.</p><section class="box"><h3>비유하면</h3><p>아파트 관리 규약. 서로 편하려고 약속을 만들고 관리인을 둬요.</p></section><section><h3>이렇게 나와요</h3><p>홉스(안전을 위해 강한 주권자에게), 로크(권리를 지키려고, 어기면 바꿀 수 있다), 루소(모두의 뜻이 곧 법).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/natright.html">자연권</a> · <a href="../../../learn/gicho/t/veil.html">무지의 베일</a> · <a href="../../../learn/gicho/t/justice.html">정의</a></p></section>
