<h1>대조군</h1>
<p class="sub">Control group · 꼭 알아 둘 말</p>
<p class="lead">실험에서 아무 처치도 하지 않고 비교 기준으로 두는 집단.</p><section class="box"><h3>비유하면</h3><p>새 비료를 준 밭 옆에 안 준 밭을 나란히 두는 것. 옆 밭이 없으면 비료 덕인지 날씨 덕인지 몰라요.</p></section><section><h3>이렇게 나와요</h3><p>신약 시험에서 가짜 약(위약)을 먹는 집단.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/placebo.html">위약 효과</a> · <a href="../../../learn/gicho/t/corr.html">상관과 인과</a> · <a href="../../../learn/gicho/t/repl.html">재현성</a></p></section>
