<h1>유전자 가위</h1>
<p class="sub">CRISPR · 깊이 알아 둘 말</p>
<p class="lead">DNA의 원하는 자리를 찾아 자르고 고치는 기술. 세균이 바이러스를 막던 면역 체계에서 따왔어요.</p><section class="box"><h3>비유하면</h3><p>문서 편집기의 '찾아 바꾸기'.</p></section><section><h3>이렇게 나와요</h3><p>다우드나와 샤르팡티에가 2020년 노벨 화학상을 받았어요. 겸상 적혈구병 치료제가 허가됐어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/dna.html">DNA</a> · <a href="../../../learn/gicho/t/gene.html">유전자</a> · <a href="../../../learn/gicho/t/mutation.html">돌연변이</a></p></section>
