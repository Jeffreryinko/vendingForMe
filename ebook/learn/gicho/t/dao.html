<h1>도(道)</h1>
<p class="sub">Dao (the Way) · 꼭 알아 둘 말</p>
<p class="lead">노자·장자가 말한, 만물이 생겨나고 흘러가는 근본 이치. 말로 붙잡을 수 없다고 해요.</p><section class="box"><h3>비유하면</h3><p>물길. 물은 다투지 않고 낮은 곳으로 흐르지만 결국 바위를 깎아요.</p></section><section><h3>이렇게 나와요</h3><p>'말할 수 있는 도는 늘 그러한 도가 아니다'(《도덕경》 첫 줄).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/wuwei.html">무위(無爲)</a> · <a href="../../../learn/gicho/t/ren.html">인(仁)</a></p></section>
