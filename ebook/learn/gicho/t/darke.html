<h1>암흑에너지</h1>
<p class="sub">Dark energy · 깊이 알아 둘 말</p>
<p class="lead">우주 팽창을 점점 빠르게 만드는 정체 모를 에너지. 우주 전체 에너지의 약 68%.</p><section class="box"><h3>비유하면</h3><p>공을 위로 던졌는데 떨어지기는커녕 점점 빨리 올라가는 상황.</p></section><section><h3>이렇게 나와요</h3><p>우주 구성: 암흑에너지 약 68%, 암흑물질 약 27%, 우리가 아는 물질 약 5%.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/expand.html">우주 팽창</a> · <a href="../../../learn/gicho/t/darkm.html">암흑물질</a></p></section>
