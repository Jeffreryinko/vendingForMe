<h1>암흑물질</h1>
<p class="sub">Dark matter · 보통 알아 둘 말</p>
<p class="lead">빛을 내지도 흡수하지도 않지만 중력으로 존재가 드러나는 정체 모를 물질. 우주 물질의 약 85%.</p><section class="box"><h3>비유하면</h3><p>투명 인간이 탄 시소. 안 보이지만 시소가 기울어 있으니 누가 타고 있는 거예요.</p></section><section><h3>이렇게 나와요</h3><p>은하의 바깥쪽 별들이 계산보다 너무 빨리 돌아요. 보이는 물질만으로는 붙잡을 수 없는 속도예요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/darke.html">암흑에너지</a> · <a href="../../../learn/gicho/t/galaxy.html">은하</a> · <a href="../../../learn/gicho/t/stdmodel.html">표준모형</a></p></section>
