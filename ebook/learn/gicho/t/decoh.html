<h1>결어긋남</h1>
<p class="sub">Decoherence · 깊이 알아 둘 말</p>
<p class="lead">양자 상태가 주변 환경과 얽히면서 중첩의 흔적(간섭)이 순식간에 사라지는 현상.</p><section class="box"><h3>비유하면</h3><p>조용한 방에서는 들리던 속삭임이 시끄러운 광장에서는 묻혀 버리는 것.</p></section><section><h3>이렇게 나와요</h3><p>큰 물체가 양자처럼 안 보이는 이유. 양자컴퓨터가 극저온·진공을 쓰는 이유.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/measure.html">측정 문제</a> · <a href="../../../learn/gicho/t/superpos.html">중첩</a> · <a href="../../../learn/gicho/t/qubit.html">큐비트</a></p></section>
