<h1>방어기제</h1>
<p class="sub">Defense mechanism · 보통 알아 둘 말</p>
<p class="lead">불안을 덜기 위해 무의식적으로 쓰는 마음의 전략.</p><section class="box"><h3>비유하면</h3><p>마음의 에어백. 충격은 줄여 주지만 터진 채로는 운전하기 어려워요.</p></section><section><h3>이렇게 나와요</h3><p>부정('그럴 리 없어'), 투사('네가 화난 거잖아'), 합리화('어차피 안 하려고 했어').</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/uncon.html">무의식</a> · <a href="../../../learn/gicho/t/dissonance.html">인지 부조화</a></p></section>
