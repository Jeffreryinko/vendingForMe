<h1>결정론</h1>
<p class="sub">Determinism · 보통 알아 둘 말</p>
<p class="lead">모든 사건은 앞선 원인에 의해 정해져 있다는 입장.</p><section class="box"><h3>비유하면</h3><p>당구공. 처음 친 힘과 각도를 알면 그 뒤는 다 계산돼요.</p></section><section><h3>이렇게 나와요</h3><p>라플라스의 악마 — 우주 모든 입자의 위치와 속도를 아는 존재는 미래를 다 안다. 양자역학은 여기에 확률을 끼워 넣었어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/freewill.html">자유의지</a> · <a href="../../../learn/gicho/t/uncert.html">불확정성 원리</a></p></section>
