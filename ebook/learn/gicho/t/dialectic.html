<h1>변증법</h1>
<p class="sub">Dialectic · 깊이 알아 둘 말</p>
<p class="lead">맞서는 두 생각이 부딪쳐 둘을 넘어서는 더 높은 생각으로 나아가는 과정.</p><section class="box"><h3>비유하면</h3><p>토론. 내 말과 네 말이 부딪친 끝에 둘 다 생각 못 한 제3의 답이 나오는 것.</p></section><section><h3>이렇게 나와요</h3><p>소크라테스에게는 문답법, 헤겔에게는 역사와 정신이 발전하는 방식, 마르크스에게는 사회 변화의 법칙.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/argument.html">논증</a></p></section>
