<h1>DNA</h1>
<p class="sub">Deoxyribonucleic acid · 꼭 알아 둘 말</p>
<p class="lead">유전 정보를 담은 이중나선 분자. 네 가지 염기(A·T·G·C)의 순서가 곧 정보예요.</p><section class="box"><h3>비유하면</h3><p>네 글자로 쓰인 요리책. 사람의 책은 약 30억 글자예요.</p></section><section><h3>이렇게 나와요</h3><p>A는 T와, G는 C와만 짝을 지어요. 그래서 한 가닥이 있으면 다른 가닥을 복사할 수 있어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/gene.html">유전자</a> · <a href="../../../learn/gicho/t/dogma.html">중심원리</a> · <a href="../../../learn/gicho/t/mutation.html">돌연변이</a> · <a href="../../../learn/gicho/t/protein.html">단백질</a></p></section>
