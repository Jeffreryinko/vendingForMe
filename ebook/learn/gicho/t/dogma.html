<h1>중심원리</h1>
<p class="sub">Central dogma · 보통 알아 둘 말</p>
<p class="lead">유전 정보가 DNA → RNA → 단백질 순서로 흐른다는 분자생물학의 기본 틀.</p><section class="box"><h3>비유하면</h3><p>도서관 원본(DNA)을 복사해(RNA) 부엌에 가져가 요리(단백질)를 만드는 것. 원본은 도서관 밖으로 안 나가요.</p></section><section><h3>이렇게 나와요</h3><p>mRNA 백신은 이 가운데 단계(RNA)를 몸에 넣어 주는 방식이에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/dna.html">DNA</a> · <a href="../../../learn/gicho/t/protein.html">단백질</a> · <a href="../../../learn/gicho/t/gene.html">유전자</a></p></section>
