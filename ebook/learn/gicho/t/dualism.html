<h1>심신 이원론</h1>
<p class="sub">Mind–body dualism · 보통 알아 둘 말</p>
<p class="lead">마음과 몸(물질)은 서로 다른 종류의 것이라는 입장.</p><section class="box"><h3>비유하면</h3><p>운전자와 자동차.</p></section><section><h3>이렇게 나와요</h3><p>데카르트. 문제는 '종류가 다른 둘이 어떻게 서로 영향을 주는가'.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/material.html">물리주의</a> · <a href="../../../learn/gicho/t/cogito.html">코기토</a> · <a href="../../../learn/gicho/t/qualia.html">감각질</a></p></section>
