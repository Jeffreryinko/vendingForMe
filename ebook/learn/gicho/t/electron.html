<h1>전자</h1>
<p class="sub">Electron · 꼭 알아 둘 말</p>
<p class="lead">음전하를 띤 아주 가벼운 기본 입자. 원자핵 둘레에 '구름'처럼 퍼져 있어요.</p><section class="box"><h3>비유하면</h3><p>태양을 도는 행성이 아니라, 선풍기 날개처럼 '어디쯤 있을 확률'로 퍼져 있는 것.</p></section><section><h3>이렇게 나와요</h3><p>전류는 전자의 흐름. 화학 반응은 전자를 주고받거나 나눠 갖는 일이에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/atom.html">원자</a> · <a href="../../../learn/gicho/t/bond.html">화학 결합</a> · <a href="../../../learn/gicho/t/pauli.html">배타 원리</a></p></section>
