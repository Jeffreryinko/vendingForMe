<h1>질량-에너지 등가</h1>
<p class="sub">E = mc² · 꼭 알아 둘 말</p>
<p class="lead">질량과 에너지는 같은 것의 두 얼굴이라는 식. 아주 작은 질량이 엄청난 에너지에 해당해요.</p><section class="box"><h3>비유하면</h3><p>환율이 '빛의 속도의 제곱'인 환전. 1g이 히로시마 원자폭탄급 에너지와 맞먹어요.</p></section><section><h3>이렇게 나와요</h3><p>태양은 매초 약 400만 톤의 질량을 빛으로 바꾸고 있어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/srel.html">특수상대성이론</a> · <a href="../../../learn/gicho/t/fission.html">핵분열</a> · <a href="../../../learn/gicho/t/fusion.html">핵융합</a></p></section>
