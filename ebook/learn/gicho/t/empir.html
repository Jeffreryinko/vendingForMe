<h1>경험론</h1>
<p class="sub">Empiricism · 보통 알아 둘 말</p>
<p class="lead">모든 지식은 감각 경험에서 온다는 입장.</p><section class="box"><h3>비유하면</h3><p>마음은 처음에 빈 서판(백지). 경험이 그 위에 글씨를 써요.</p></section><section><h3>이렇게 나와요</h3><p>로크, 버클리, 흄. 근대 과학의 태도와 잘 맞아요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/rational.html">합리론</a> · <a href="../../../learn/gicho/t/induprob.html">귀납의 문제</a> · <a href="../../../learn/gicho/t/apriori.html">선험과 후험</a></p></section>
