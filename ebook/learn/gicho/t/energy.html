<h1>에너지</h1>
<p class="sub">Energy · 꼭 알아 둘 말</p>
<p class="lead">일을 할 수 있는 능력. 운동·열·빛·화학·전기 등으로 모양을 바꾸지만 전체 양은 변하지 않아요.</p><section class="box"><h3>비유하면</h3><p>돈과 비슷해요. 현금·예금·주식으로 모양은 바뀌어도 한 푼도 저절로 생기지 않아요.</p></section><section><h3>이렇게 나와요</h3><p>밥(화학 에너지) → 근육(운동) → 체온(열).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/conserve.html">보존 법칙</a> · <a href="../../../learn/gicho/t/entropy.html">엔트로피</a> · <a href="../../../learn/gicho/t/emc2.html">질량-에너지 등가</a></p></section>
