<h1>실존주의</h1>
<p class="sub">Existentialism · 꼭 알아 둘 말</p>
<p class="lead">사람은 정해진 본질 없이 먼저 세상에 던져져 있고, 스스로의 선택으로 자기를 만들어 간다는 사상.</p><section class="box"><h3>비유하면</h3><p>가위는 '자르는 것'으로 만들어졌지만 사람에게는 사용 설명서가 없어요.</p></section><section><h3>이렇게 나와요</h3><p>'실존은 본질에 앞선다'(사르트르). 키르케고르, 니체, 하이데거, 카뮈, 보부아르.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/absurd.html">부조리</a> · <a href="../../../learn/gicho/t/nihil.html">허무주의</a> · <a href="../../../learn/gicho/t/freewill.html">자유의지</a></p></section>
