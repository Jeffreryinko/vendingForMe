<h1>장</h1>
<p class="sub">Field · 보통 알아 둘 말</p>
<p class="lead">공간의 모든 점마다 값이 매겨져 있는 것. 힘은 물체가 직접 닿지 않아도 장을 통해 전해져요.</p><section class="box"><h3>비유하면</h3><p>일기도의 기온 분포. 지도 위 어느 점에나 기온 값이 있죠.</p></section><section><h3>이렇게 나와요</h3><p>전기장, 자기장, 중력장. 현대 물리학에서는 입자도 장의 떨림으로 봐요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/emwave.html">전자기파</a> · <a href="../../../learn/gicho/t/higgs.html">힉스 입자</a> · <a href="../../../learn/gicho/t/stdmodel.html">표준모형</a></p></section>
