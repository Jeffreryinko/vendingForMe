<h1>힘</h1>
<p class="sub">Force (F=ma) · 꼭 알아 둘 말</p>
<p class="lead">물체의 속도를 바꾸는 것. 힘 = 질량 × 가속도.</p><section class="box"><h3>비유하면</h3><p>같은 힘으로 밀어도 빈 카트는 휙 가고 짐 실은 카트는 느릿해요.</p></section><section><h3>이렇게 나와요</h3><p>뉴턴의 제2법칙. 중력, 마찰력, 전기력이 모두 힘이에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/inertia.html">관성</a> · <a href="../../../learn/gicho/t/gravity.html">중력</a> · <a href="../../../learn/gicho/t/field.html">장</a></p></section>
