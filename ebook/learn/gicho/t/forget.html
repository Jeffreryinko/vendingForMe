<h1>망각 곡선</h1>
<p class="sub">Forgetting curve · 보통 알아 둘 말</p>
<p class="lead">배운 직후에 가장 빠르게 잊고 그 뒤로는 천천히 잊는다는 곡선(에빙하우스, 1885).</p><section class="box"><h3>비유하면</h3><p>새 눈 위의 발자국. 처음 몇 시간에 가장 많이 덮여요.</p></section><section><h3>이렇게 나와요</h3><p>간격을 두고 다시 떠올리면 곡선이 완만해져요. 이 앱의 복습 상자(1·3·7·16·35일)가 그 원리예요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/ltm.html">장기 기억</a> · <a href="../../../learn/gicho/t/metacog.html">메타인지</a></p></section>
