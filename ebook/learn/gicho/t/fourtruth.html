<h1>사성제</h1>
<p class="sub">Four Noble Truths · 꼭 알아 둘 말</p>
<p class="lead">붓다의 핵심 가르침 네 가지. 삶에는 괴로움이 있다, 원인은 집착이다, 괴로움은 끝날 수 있다, 그 길이 있다(팔정도).</p><section class="box"><h3>비유하면</h3><p>의사의 진료 순서와 같아요. 증상 → 원인 → 나을 수 있음 → 처방.</p></section><section><h3>이렇게 나와요</h3><p>기원전 5세기경. 오늘날 마음챙김 명상의 뿌리.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/emptiness.html">연기와 공</a> · <a href="../../../learn/gicho/t/cbt.html">인지행동치료</a></p></section>
