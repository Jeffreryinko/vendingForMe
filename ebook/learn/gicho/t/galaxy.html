<h1>은하</h1>
<p class="sub">Galaxy · 보통 알아 둘 말</p>
<p class="lead">수천억 개의 별과 가스, 암흑물질이 중력으로 묶인 큰 무리.</p><section class="box"><h3>비유하면</h3><p>별들의 도시. 우리 은하는 그런 도시 2조 개쯤 가운데 하나예요.</p></section><section><h3>이렇게 나와요</h3><p>우리 은하의 지름은 약 10만 광년, 별은 1천억~4천억 개.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/darkm.html">암흑물질</a> · <a href="../../../learn/gicho/t/blackhole.html">블랙홀</a> · <a href="../../../learn/gicho/t/lightyear.html">광년</a></p></section>
