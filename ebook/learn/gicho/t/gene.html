<h1>유전자</h1>
<p class="sub">Gene · 꼭 알아 둘 말</p>
<p class="lead">DNA 가운데 단백질 하나(또는 기능 하나)를 만드는 정보가 담긴 구간.</p><section class="box"><h3>비유하면</h3><p>요리책 속 레시피 하나.</p></section><section><h3>이렇게 나와요</h3><p>사람의 유전자는 약 2만 개. 포도(약 3만 개)보다 적어요. 수보다 어떻게 켜고 끄는지가 중요해요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/dna.html">DNA</a> · <a href="../../../learn/gicho/t/protein.html">단백질</a> · <a href="../../../learn/gicho/t/nature.html">본성과 양육</a></p></section>
