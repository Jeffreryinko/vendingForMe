<h1>중력</h1>
<p class="sub">Gravity · 꼭 알아 둘 말</p>
<p class="lead">질량이 있는 모든 것이 서로 끌어당기는 힘. 뉴턴은 힘으로, 아인슈타인은 시공간의 휘어짐으로 설명했어요.</p><section class="box"><h3>비유하면</h3><p>사과가 떨어지는 것과 달이 지구를 도는 것이 같은 힘이라는 발견.</p></section><section><h3>이렇게 나와요</h3><p>거리가 2배 멀어지면 힘은 4분의 1로 줄어요(역제곱 법칙).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/grel.html">일반상대성이론</a> · <a href="../../../learn/gicho/t/force.html">힘</a> · <a href="../../../learn/gicho/t/blackhole.html">블랙홀</a></p></section>
