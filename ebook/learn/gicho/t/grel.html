<h1>일반상대성이론</h1>
<p class="sub">General relativity · 꼭 알아 둘 말</p>
<p class="lead">중력은 힘이 아니라 질량이 시공간을 휘게 한 결과라는 이론(1915).</p><section class="box"><h3>비유하면</h3><p>팽팽한 천 위에 볼링공을 놓으면 천이 꺼지고, 옆의 구슬이 그 굴곡을 따라 굴러요.</p></section><section><h3>이렇게 나와요</h3><p>1919년 일식 때 별빛이 태양 옆에서 휘는 것이 관측돼 확인됐어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/spacetime.html">시공간</a> · <a href="../../../learn/gicho/t/blackhole.html">블랙홀</a> · <a href="../../../learn/gicho/t/gwave.html">중력파</a> · <a href="../../../learn/gicho/t/gravity.html">중력</a></p></section>
