<h1>중력파</h1>
<p class="sub">Gravitational wave · 깊이 알아 둘 말</p>
<p class="lead">무거운 천체가 격하게 움직일 때 시공간의 흔들림이 빛의 속도로 퍼져 나가는 것.</p><section class="box"><h3>비유하면</h3><p>연못에 돌을 던지면 번지는 물결. 연못이 시공간 자체예요.</p></section><section><h3>이렇게 나와요</h3><p>2015년 라이고(LIGO)가 13억 광년 밖 블랙홀 두 개의 충돌을 처음 잡아냈어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/grel.html">일반상대성이론</a> · <a href="../../../learn/gicho/t/blackhole.html">블랙홀</a></p></section>
