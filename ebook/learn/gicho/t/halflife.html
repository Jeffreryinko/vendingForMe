<h1>반감기</h1>
<p class="sub">Half-life · 보통 알아 둘 말</p>
<p class="lead">방사성 원자의 절반이 붕괴하는 데 걸리는 시간. 원자 종류마다 정해져 있어요.</p><section class="box"><h3>비유하면</h3><p>팝콘이 튀는 것. 어느 알이 언제 튈지는 몰라도 전체의 절반이 튀는 시간은 일정해요.</p></section><section><h3>이렇게 나와요</h3><p>탄소-14의 반감기는 약 5,730년 — 유물의 나이를 재는 시계로 써요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/isotope.html">동위원소</a> · <a href="../../../learn/gicho/t/nucleus.html">원자핵</a></p></section>
