<h1>힉스 입자</h1>
<p class="sub">Higgs boson · 깊이 알아 둘 말</p>
<p class="lead">우주에 가득한 힉스 장의 떨림. 기본 입자들은 이 장과 얽히는 정도만큼 질량을 얻어요.</p><section class="box"><h3>비유하면</h3><p>파티장에 유명인이 들어서면 사람들이 몰려 걸음이 무거워지는 것.</p></section><section><h3>이렇게 나와요</h3><p>1964년에 예측되고 2012년 유럽입자물리연구소(CERN)의 대형 강입자 충돌기에서 발견됐어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/stdmodel.html">표준모형</a> · <a href="../../../learn/gicho/t/field.html">장</a></p></section>
