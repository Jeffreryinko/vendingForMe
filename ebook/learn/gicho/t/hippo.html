<p class="sub">Hippocampus · 보통 알아 둘 말</p>
<p class="lead">새로운 사건 기억을 만들고 장기 기억으로 넘기는 데 꼭 필요한 부위.</p><section class="box"><h3>비유하면</h3><p>기억의 '저장' 버튼. 창고 자체는 아니에요.</p></section><section><h3>이렇게 나와요</h3><p>환자 H.M.은 1953년 해마를 잘라 낸 뒤 옛 기억은 남고 새 기억은 만들지 못했어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/ltm.html">장기 기억</a> · <a href="../../../learn/gicho/t/wmem.html">작업 기억</a> · <a href="../../../learn/gicho/t/plastic.html">신경가소성</a></p></section>
