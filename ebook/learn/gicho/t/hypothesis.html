<h1>가설</h1>
<p class="sub">Hypothesis · 꼭 알아 둘 말</p>
<p class="lead">아직 확인되지 않았지만 실험이나 관찰로 맞는지 틀리는지 가려 볼 수 있는 설명.</p><section class="box"><h3>비유하면</h3><p>'범인은 왼손잡이일 것이다'라는 형사의 추리. 증거로 확인하기 전까지는 추리일 뿐이에요.</p></section><section><h3>이렇게 나와요</h3><p>'빛은 파동이다' → 그렇다면 두 틈을 지나면 줄무늬가 생겨야 한다.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/theory.html">이론</a> · <a href="../../../learn/gicho/t/falsify.html">반증 가능성</a> · <a href="../../../learn/gicho/t/control.html">대조군</a></p></section>
