<h1>귀납</h1>
<p class="sub">Induction · 꼭 알아 둘 말</p>
<p class="lead">여러 사례에서 일반 규칙을 이끌어 내는 추론. 그럴듯하지만 반드시 참은 아니에요.</p><section class="box"><h3>비유하면</h3><p>'지금까지 해가 매일 떴으니 내일도 뜬다'.</p></section><section><h3>이렇게 나와요</h3><p>과학은 대부분 귀납에 기대요. 그래서 결론이 늘 잠정적이에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/deduct.html">연역</a> · <a href="../../../learn/gicho/t/induprob.html">귀납의 문제</a> · <a href="../../../learn/gicho/t/falsify.html">반증 가능성</a></p></section>
