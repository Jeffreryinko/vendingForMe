<h1>관성</h1>
<p class="sub">Inertia · 꼭 알아 둘 말</p>
<p class="lead">물체가 지금의 운동 상태를 그대로 지키려는 성질. 힘이 없으면 멈춘 것은 멈춰 있고 움직이는 것은 계속 움직여요.</p><section class="box"><h3>비유하면</h3><p>버스가 급정거하면 몸이 앞으로 쏠리는 것. 몸은 가던 대로 가려고 해요.</p></section><section><h3>이렇게 나와요</h3><p>뉴턴의 제1법칙. 우주선은 엔진을 꺼도 계속 날아가요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/force.html">힘</a> · <a href="../../../learn/gicho/t/momentum.html">운동량</a></p></section>
