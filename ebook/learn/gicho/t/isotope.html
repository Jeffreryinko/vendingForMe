<h1>동위원소</h1>
<p class="sub">Isotope · 보통 알아 둘 말</p>
<p class="lead">양성자 수는 같고 중성자 수만 다른 원자들. 화학 성질은 같고 무게와 안정성이 달라요.</p><section class="box"><h3>비유하면</h3><p>같은 집안 형제. 성은 같은데 몸무게가 달라요.</p></section><section><h3>이렇게 나와요</h3><p>탄소-12와 탄소-14. 우라늄-235는 핵분열하고 우라늄-238은 잘 안 해요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/nucleus.html">원자핵</a> · <a href="../../../learn/gicho/t/halflife.html">반감기</a></p></section>
