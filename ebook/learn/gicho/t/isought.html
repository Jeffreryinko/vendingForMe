<h1>사실과 당위</h1>
<p class="sub">Is–ought problem · 보통 알아 둘 말</p>
<p class="lead">'~이다'(사실)만으로는 '~해야 한다'(당위)를 이끌어 낼 수 없다는 문제(흄).</p><section class="box"><h3>비유하면</h3><p>'자연에서는 강한 것이 살아남는다'에서 '강한 자가 지배해야 한다'로 건너뛸 수 없어요.</p></section><section><h3>이렇게 나와요</h3><p>'자연스러우니까 옳다'는 흔한 오류(자연주의의 오류).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/fallacy.html">오류</a> · <a href="../../../learn/gicho/t/relativ.html">도덕 상대주의</a></p></section>
