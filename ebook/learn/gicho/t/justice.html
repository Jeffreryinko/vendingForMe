<h1>정의</h1>
<p class="sub">Justice · 보통 알아 둘 말</p>
<p class="lead">각자에게 마땅한 몫을 주는 것. 무엇이 '마땅한가'에 따라 여러 이론이 갈려요.</p><section class="box"><h3>비유하면</h3><p>피자 나누기. 똑같이? 배고픈 만큼? 돈 낸 만큼? 만든 만큼?</p></section><section><h3>이렇게 나와요</h3><p>롤스(공정으로서의 정의), 노직(정당하게 얻은 것은 건드리지 말라), 샌델(공동체가 기리는 덕).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/veil.html">무지의 베일</a> · <a href="../../../learn/gicho/t/util.html">공리주의</a> · <a href="../../../learn/gicho/t/liberty.html">해악의 원칙</a></p></section>
