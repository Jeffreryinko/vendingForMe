<h1>해악의 원칙</h1>
<p class="sub">Harm principle · 보통 알아 둘 말</p>
<p class="lead">남에게 해를 끼치지 않는 한 개인의 자유를 막아서는 안 된다는 원칙(밀, 《자유론》 1859).</p><section class="box"><h3>비유하면</h3><p>'네 주먹을 휘두를 자유는 내 코앞에서 끝난다'.</p></section><section><h3>이렇게 나와요</h3><p>밀은 틀린 의견도 막지 말라고 했어요. 틀린 의견과 부딪쳐야 옳은 의견이 살아 있는 진리로 남기 때문이에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/util.html">공리주의</a> · <a href="../../../learn/gicho/t/natright.html">자연권</a> · <a href="../../../learn/gicho/t/justice.html">정의</a></p></section>
