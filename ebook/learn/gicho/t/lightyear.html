<h1>광년</h1>
<p class="sub">Light-year · 보통 알아 둘 말</p>
<p class="lead">빛이 1년 동안 가는 거리. 약 9조 5천억 km. 시간이 아니라 거리의 단위예요.</p><section class="box"><h3>비유하면</h3><p>'차로 3시간 거리'처럼 걸리는 시간으로 거리를 말하는 것.</p></section><section><h3>이렇게 나와요</h3><p>가장 가까운 별까지 약 4.2광년, 안드로메다 은하까지 약 250만 광년. 멀리 본다는 것은 과거를 본다는 뜻이에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/lightspeed.html">광속</a> · <a href="../../../learn/gicho/t/galaxy.html">은하</a></p></section>
