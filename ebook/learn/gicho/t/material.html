<h1>물리주의</h1>
<p class="sub">Physicalism · 보통 알아 둘 말</p>
<p class="lead">존재하는 것은 결국 모두 물리적인 것이고, 마음도 뇌의 작용이라는 입장.</p><section class="box"><h3>비유하면</h3><p>소프트웨어는 하드웨어 없이 돌아가지 않아요.</p></section><section><h3>이렇게 나와요</h3><p>현대 신경과학의 기본 가정. 숙제는 '뇌의 전기 신호가 어떻게 느낌이 되는가'.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/dualism.html">심신 이원론</a> · <a href="../../../learn/gicho/t/qualia.html">감각질</a> · <a href="../../../learn/gicho/t/determin.html">결정론</a></p></section>
