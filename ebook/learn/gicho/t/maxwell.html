<h1>맥스웰 방정식</h1>
<p class="sub">Maxwell's equations · 깊이 알아 둘 말</p>
<p class="lead">전기와 자기의 모든 현상을 네 개의 식으로 묶은 것. 여기서 '빛은 전자기파'라는 결론이 나왔어요.</p><section class="box"><h3>비유하면</h3><p>따로 놀던 전기 가게와 자석 가게가 사실 한 회사였다는 것을 밝힌 장부.</p></section><section><h3>이렇게 나와요</h3><p>식에서 계산한 파동의 속도가 측정된 빛의 속도와 딱 맞았어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/emwave.html">전자기파</a> · <a href="../../../learn/gicho/t/lightspeed.html">광속</a> · <a href="../../../learn/gicho/t/srel.html">특수상대성이론</a></p></section>
