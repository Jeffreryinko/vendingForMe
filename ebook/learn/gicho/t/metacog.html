<p class="sub">Metacognition · 꼭 알아 둘 말</p>
<p class="lead">내가 무엇을 알고 모르는지를 아는 것. 생각에 대한 생각.</p><section class="box"><h3>비유하면</h3><p>운전하면서 계기판을 보는 것. 내 머리의 계기판이에요.</p></section><section><h3>이렇게 나와요</h3><p>'다 안다'는 느낌이 드는 건 익숙해서일 뿐일 수 있어요. 책을 덮고 떠올려 봐야 진짜 아는지 드러나요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/dk.html">더닝-크루거 효과</a> · <a href="../../../learn/gicho/t/forget.html">망각 곡선</a> · <a href="../../../learn/gicho/t/sys12.html">시스템 1·시스템 2</a></p></section>
