<p class="sub">Model · 보통 알아 둘 말</p>
<p class="lead">복잡한 자연을 다룰 수 있게 줄여서 나타낸 그림이나 수식. 맞는 범위가 정해져 있어요.</p><section class="box"><h3>비유하면</h3><p>지하철 노선도. 실제 거리와 다르지만 갈아타는 데는 완벽해요.</p></section><section><h3>이렇게 나와요</h3><p>보어의 원자 모형은 수소에는 잘 맞고 큰 원자에는 안 맞아요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/theory.html">이론</a> · <a href="../../../learn/gicho/t/atom.html">원자</a></p></section>
