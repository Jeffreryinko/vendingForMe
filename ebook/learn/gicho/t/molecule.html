<h1>분자</h1>
<p class="sub">Molecule · 보통 알아 둘 말</p>
<p class="lead">둘 이상의 원자가 결합해 만든 덩어리. 물질의 성질을 가진 가장 작은 단위예요.</p><section class="box"><h3>비유하면</h3><p>원자가 글자라면 분자는 낱말. 같은 글자도 순서가 다르면 뜻이 달라져요.</p></section><section><h3>이렇게 나와요</h3><p>산소 분자 O₂는 숨 쉬는 데 쓰이고 오존 O₃는 독성이 있어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/atom.html">원자</a> · <a href="../../../learn/gicho/t/bond.html">화학 결합</a> · <a href="../../../learn/gicho/t/protein.html">단백질</a></p></section>
