<h1>운동량</h1>
<p class="sub">Momentum · 보통 알아 둘 말</p>
<p class="lead">질량 × 속도. 움직이는 물체가 가진 '멈추기 어려운 정도'.</p><section class="box"><h3>비유하면</h3><p>느린 트럭과 빠른 탁구공 가운데 어느 쪽에 맞기 싫은지 생각하면 돼요.</p></section><section><h3>이렇게 나와요</h3><p>당구공이 부딪칠 때 운동량의 합은 변하지 않아요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/conserve.html">보존 법칙</a> · <a href="../../../learn/gicho/t/uncert.html">불확정성 원리</a></p></section>
