<h1>돌연변이</h1>
<p class="sub">Mutation · 보통 알아 둘 말</p>
<p class="lead">DNA 글자가 바뀌는 것. 대부분은 영향이 없거나 해롭고, 드물게 이로워요. 진화의 재료예요.</p><section class="box"><h3>비유하면</h3><p>책을 베껴 쓰다 생긴 오타. 대개는 뜻이 안 바뀌고, 가끔 더 좋은 문장이 돼요.</p></section><section><h3>이렇게 나와요</h3><p>어른이 되어서도 우유를 소화하는 능력은 수천 년 전의 돌연변이 덕분이에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/natsel.html">자연선택</a> · <a href="../../../learn/gicho/t/dna.html">DNA</a> · <a href="../../../learn/gicho/t/evolution.html">진화</a></p></section>
