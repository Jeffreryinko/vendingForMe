<h1>자연선택</h1>
<p class="sub">Natural selection · 꼭 알아 둘 말</p>
<p class="lead">환경에 더 잘 맞는 변이를 가진 개체가 자손을 더 많이 남겨, 그 변이가 집단에 퍼지는 과정.</p><section class="box"><h3>비유하면</h3><p>체로 치는 것. 체는 아무 계획이 없지만 지나고 나면 맞는 알갱이만 남아요.</p></section><section><h3>이렇게 나와요</h3><p>조건 셋: 변이가 있다 · 유전된다 · 살아남고 번식하는 데 차이가 난다.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/evolution.html">진화</a> · <a href="../../../learn/gicho/t/mutation.html">돌연변이</a></p></section>
