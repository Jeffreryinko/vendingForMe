<h1>신경전달물질</h1>
<p class="sub">Neurotransmitter · 보통 알아 둘 말</p>
<p class="lead">시냅스에서 신호를 전하는 화학 물질. 종류에 따라 다음 뉴런을 흥분시키거나 가라앉혀요.</p><section class="box"><h3>비유하면</h3><p>뉴런끼리 주고받는 쪽지. 쪽지 종류에 따라 '달려!'도 되고 '멈춰!'도 돼요.</p></section><section><h3>이렇게 나와요</h3><p>도파민, 세로토닌, 아세틸콜린, 가바(GABA).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/dopamine.html">도파민</a> · <a href="../../../learn/gicho/t/synapse.html">시냅스</a> · <a href="../../../learn/gicho/t/depress.html">우울증</a></p></section>
