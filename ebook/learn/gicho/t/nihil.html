<h1>허무주의</h1>
<p class="sub">Nihilism · 보통 알아 둘 말</p>
<p class="lead">삶과 세계에 타고난 의미나 절대적 가치는 없다는 입장.</p><section class="box"><h3>비유하면</h3><p>지도도 목적지도 없이 바다에 떠 있는 배.</p></section><section><h3>이렇게 나와요</h3><p>니체의 '신은 죽었다'는 허무주의의 선언이 아니라, 옛 가치가 무너진 뒤 닥칠 허무를 어떻게 넘을지 묻는 경고였어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/exist.html">실존주의</a> · <a href="../../../learn/gicho/t/absurd.html">부조리</a> · <a href="../../../learn/gicho/t/relativ.html">도덕 상대주의</a></p></section>
