<h1>원자핵</h1>
<p class="sub">Nucleus · 보통 알아 둘 말</p>
<p class="lead">원자 한가운데에 양성자와 중성자가 뭉쳐 있는 곳. 원자 질량의 99.9% 이상이 여기 있어요.</p><section class="box"><h3>비유하면</h3><p>크기는 원자의 10만분의 1인데 무게는 거의 전부.</p></section><section><h3>이렇게 나와요</h3><p>양성자 수가 원소의 종류를 정해요. 1개면 수소, 6개면 탄소, 79개면 금.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/atom.html">원자</a> · <a href="../../../learn/gicho/t/isotope.html">동위원소</a> · <a href="../../../learn/gicho/t/fission.html">핵분열</a> · <a href="../../../learn/gicho/t/quark.html">쿼크</a></p></section>
