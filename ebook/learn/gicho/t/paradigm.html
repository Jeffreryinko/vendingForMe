<h1>패러다임</h1>
<p class="sub">Paradigm · 꼭 알아 둘 말</p>
<p class="lead">한 시대의 과학자들이 함께 받아들이는 이론·방법·문제의식의 틀. 틀이 통째로 바뀌는 것이 과학 혁명이에요.</p><section class="box"><h3>비유하면</h3><p>게임의 규칙책. 평소엔 규칙 안에서 문제를 풀고, 가끔 규칙책 자체가 바뀌어요.</p></section><section><h3>이렇게 나와요</h3><p>천동설 → 지동설, 뉴턴 역학 → 상대성이론·양자역학. 토머스 쿤 《과학혁명의 구조》(1962).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/falsify.html">반증 가능성</a> · <a href="../../../learn/gicho/t/theory.html">이론</a></p></section>
