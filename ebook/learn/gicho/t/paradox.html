<h1>역설</h1>
<p class="sub">Paradox · 보통 알아 둘 말</p>
<p class="lead">멀쩡해 보이는 전제와 추론에서 받아들이기 어려운 결론이 나오는 것.</p><section class="box"><h3>비유하면</h3><p>'이 문장은 거짓이다' — 참이면 거짓이고 거짓이면 참.</p></section><section><h3>이렇게 나와요</h3><p>제논의 역설(아킬레우스는 거북이를 못 따라잡는다), 테세우스의 배(널빤지를 다 갈아도 같은 배인가).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/thoughtx.html">사고실험</a> · <a href="../../../learn/gicho/t/argument.html">논증</a></p></section>
