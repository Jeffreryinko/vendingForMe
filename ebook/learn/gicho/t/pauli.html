<h1>배타 원리</h1>
<p class="sub">Pauli exclusion principle · 보통 알아 둘 말</p>
<p class="lead">전자 같은 입자 두 개는 똑같은 양자 상태에 함께 있을 수 없다는 원리.</p><section class="box"><h3>비유하면</h3><p>한 좌석에 한 사람. 먼저 온 전자가 안쪽 자리를 채우면 다음 전자는 바깥 자리로 가야 해요.</p></section><section><h3>이렇게 나와요</h3><p>원소마다 화학 성질이 다르고, 바닥이 발을 받쳐 주는 이유.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/spin.html">스핀</a> · <a href="../../../learn/gicho/t/periodic.html">주기율표</a> · <a href="../../../learn/gicho/t/electron.html">전자</a></p></section>
