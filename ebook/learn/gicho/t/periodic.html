<h1>주기율표</h1>
<p class="sub">Periodic table · 꼭 알아 둘 말</p>
<p class="lead">원소를 양성자 수 순서로 늘어놓은 표. 같은 세로줄은 성질이 비슷해요.</p><section class="box"><h3>비유하면</h3><p>달력처럼 일정 간격으로 같은 성격이 되돌아와요. 그래서 '주기'.</p></section><section><h3>이렇게 나와요</h3><p>멘델레예프는 1869년 빈칸을 남겨 두고 아직 발견 안 된 원소의 성질을 맞혔어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/atom.html">원자</a> · <a href="../../../learn/gicho/t/pauli.html">배타 원리</a> · <a href="../../../learn/gicho/t/bond.html">화학 결합</a></p></section>
