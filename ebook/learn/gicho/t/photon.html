<h1>광자</h1>
<p class="sub">Photon · 꼭 알아 둘 말</p>
<p class="lead">빛 에너지의 가장 작은 알갱이. 진동수가 높을수록 알갱이 하나의 에너지가 커요.</p><section class="box"><h3>비유하면</h3><p>빛은 수돗물처럼 이어진 게 아니라 물방울처럼 하나씩 와요.</p></section><section><h3>이렇게 나와요</h3><p>자외선은 광자 하나가 세서 피부를 태우고, 적외선은 아무리 쬐어도 못 태워요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/quantum.html">양자</a> · <a href="../../../learn/gicho/t/duality.html">파동-입자 이중성</a> · <a href="../../../learn/gicho/t/planckc.html">플랑크 상수</a></p></section>
