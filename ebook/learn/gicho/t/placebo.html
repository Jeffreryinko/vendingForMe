<h1>위약 효과</h1>
<p class="sub">Placebo effect · 보통 알아 둘 말</p>
<p class="lead">약효가 없는 가짜 약인데도 나을 거라는 기대만으로 증상이 나아지는 현상.</p><section class="box"><h3>비유하면</h3><p>'엄마 손은 약손'.</p></section><section><h3>이렇게 나와요</h3><p>그래서 신약은 가짜 약보다 더 잘 듣는다는 것을 보여야 허가돼요. 통증·기분에는 잘 나타나고 종양 크기에는 안 나타나요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/control.html">대조군</a></p></section>
