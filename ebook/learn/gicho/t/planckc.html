<h1>플랑크 상수</h1>
<p class="sub">Planck constant (h) · 깊이 알아 둘 말</p>
<p class="lead">양자 세계의 '한 칸 크기'를 정하는 아주 작은 숫자. 광자의 에너지 = h × 진동수.</p><section class="box"><h3>비유하면</h3><p>화면의 픽셀 크기. 너무 작아서 일상에서는 세상이 매끄럽게 보여요.</p></section><section><h3>이렇게 나와요</h3><p>약 6.6 × 10⁻³⁴ J·s. 2019년부터 킬로그램의 정의에 쓰여요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/quantum.html">양자</a> · <a href="../../../learn/gicho/t/photon.html">광자</a> · <a href="../../../learn/gicho/t/uncert.html">불확정성 원리</a></p></section>
