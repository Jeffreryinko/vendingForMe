<h1>감각질</h1>
<p class="sub">Qualia · 깊이 알아 둘 말</p>
<p class="lead">빨강의 빨간 느낌, 커피 향의 그 느낌처럼 경험이 주관적으로 '어떠한가'.</p><section class="box"><h3>비유하면</h3><p>색을 평생 못 본 색채 과학자 메리가 처음 빨강을 보면 새로 배우는 것이 있을까요?(잭슨의 사고실험)</p></section><section><h3>이렇게 나와요</h3><p>'의식의 어려운 문제' — 뇌 활동을 다 설명해도 왜 느낌이 있는지는 남는다는 물음(차머스).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/material.html">물리주의</a> · <a href="../../../learn/gicho/t/dualism.html">심신 이원론</a></p></section>
