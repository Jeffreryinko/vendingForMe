<h1>쿼크</h1>
<p class="sub">Quark · 깊이 알아 둘 말</p>
<p class="lead">양성자와 중성자를 이루는 기본 입자. 혼자서는 발견되지 않고 늘 묶여 있어요.</p><section class="box"><h3>비유하면</h3><p>고무줄로 묶인 구슬 셋. 떼려고 당길수록 더 세게 당겨져요.</p></section><section><h3>이렇게 나와요</h3><p>양성자 = 위 쿼크 둘 + 아래 쿼크 하나.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/stdmodel.html">표준모형</a> · <a href="../../../learn/gicho/t/nucleus.html">원자핵</a></p></section>
