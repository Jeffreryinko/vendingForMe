<h1>큐비트</h1>
<p class="sub">Qubit · 보통 알아 둘 말</p>
<p class="lead">양자컴퓨터의 정보 단위. 0과 1의 중첩 상태를 가질 수 있어요.</p><section class="box"><h3>비유하면</h3><p>보통 비트가 켜짐·꺼짐 스위치라면 큐비트는 방향을 가진 화살표.</p></section><section><h3>이렇게 나와요</h3><p>큐비트를 얽히게 하면 특정 문제(소인수분해, 분자 모의실험)에서 큰 이점이 생겨요. 모든 계산이 빨라지는 건 아니에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/superpos.html">중첩</a> · <a href="../../../learn/gicho/t/entangle.html">양자 얽힘</a> · <a href="../../../learn/gicho/t/decoh.html">결어긋남</a></p></section>
