<h1>도덕 상대주의</h1>
<p class="sub">Moral relativism · 보통 알아 둘 말</p>
<p class="lead">옳고 그름은 문화나 개인에 따라 다르고 모두에게 통하는 기준은 없다는 입장.</p><section class="box"><h3>비유하면</h3><p>'로마에서는 로마법을 따르라'를 끝까지 민 것.</p></section><section><h3>이렇게 나와요</h3><p>문화마다 도덕이 '다르다'는 사실과 '그래서 어느 쪽도 틀리지 않다'는 주장은 별개예요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/isought.html">사실과 당위</a> · <a href="../../../learn/gicho/t/nihil.html">허무주의</a></p></section>
