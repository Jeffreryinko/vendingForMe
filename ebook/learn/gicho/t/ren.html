<h1>인(仁)</h1>
<p class="sub">Ren (benevolence) · 꼭 알아 둘 말</p>
<p class="lead">공자 사상의 중심. 사람을 사람답게 대하는 마음, 어짊.</p><section class="box"><h3>비유하면</h3><p>한자 仁은 '사람(人) 둘(二)'. 사람 사이에서 드러나는 덕이에요.</p></section><section><h3>이렇게 나와요</h3><p>'내가 바라지 않는 것을 남에게 하지 말라'(《논어》).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/zhongyong.html">중용</a> · <a href="../../../learn/gicho/t/virtue.html">덕 윤리</a> · <a href="../../../learn/gicho/t/dao.html">도(道)</a></p></section>
