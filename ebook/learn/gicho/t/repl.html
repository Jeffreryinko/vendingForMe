<p class="sub">Reproducibility · 꼭 알아 둘 말</p>
<p class="lead">다른 사람이 같은 방법으로 했을 때 같은 결과가 나오는 성질.</p><section class="box"><h3>비유하면</h3><p>레시피대로 했더니 누가 해도 같은 맛이 나야 진짜 레시피예요.</p></section><section><h3>이렇게 나와요</h3><p>2010년대 심리학 '재현 위기' — 유명한 실험 상당수가 다시 해 보니 같은 결과가 안 나왔어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/peer.html">동료 평가</a> · <a href="../../../learn/gicho/t/sigma.html">통계적 유의성</a> · <a href="../../../learn/gicho/t/control.html">대조군</a></p></section>
