<h1>스키마</h1>
<p class="sub">Schema · 깊이 알아 둘 말</p>
<p class="lead">세상이 어떻게 생겼는지에 대해 머릿속에 미리 짜 둔 틀. 새 정보를 빠르게 이해하게 하지만 틀에 안 맞는 것은 놓치게 해요.</p><section class="box"><h3>비유하면</h3><p>'식당'이라는 말만 들어도 메뉴판·주문·계산이 떠오르는 것.</p></section><section><h3>이렇게 나와요</h3><p>아이는 새 경험을 기존 틀에 끼워 넣거나(동화), 틀을 고쳐요(조절) — 피아제.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/ltm.html">장기 기억</a> · <a href="../../../learn/gicho/t/confirm.html">확증 편향</a></p></section>
