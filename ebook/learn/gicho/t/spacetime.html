<h1>시공간</h1>
<p class="sub">Spacetime · 보통 알아 둘 말</p>
<p class="lead">공간 3차원과 시간 1차원을 하나로 묶은 4차원 무대. 물질이 있으면 휘어져요.</p><section class="box"><h3>비유하면</h3><p>약속을 잡으려면 '어디서'와 '언제'가 다 필요하죠. 둘은 원래 한 묶음이에요.</p></section><section><h3>이렇게 나와요</h3><p>'물질은 시공간에게 어떻게 휠지 말하고, 시공간은 물질에게 어떻게 움직일지 말한다'(물리학자 휠러).</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/grel.html">일반상대성이론</a> · <a href="../../../learn/gicho/t/srel.html">특수상대성이론</a></p></section>
