<h1>스펙트럼</h1>
<p class="sub">Spectrum · 보통 알아 둘 말</p>
<p class="lead">빛을 파장별로 펼쳐 놓은 것. 원소마다 내는 색 줄무늬가 달라서 지문처럼 쓰여요.</p><section class="box"><h3>비유하면</h3><p>프리즘이 만든 무지개. 별빛의 무지개에 난 검은 줄을 보면 그 별에 어떤 원소가 있는지 알아요.</p></section><section><h3>이렇게 나와요</h3><p>가 본 적 없는 태양에 헬륨이 있다는 것을 스펙트럼으로 먼저 알았어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/emwave.html">전자기파</a> · <a href="../../../learn/gicho/t/redshift.html">적색편이</a> · <a href="../../../learn/gicho/t/atom.html">원자</a></p></section>
