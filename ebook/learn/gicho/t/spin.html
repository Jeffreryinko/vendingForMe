<h1>스핀</h1>
<p class="sub">Spin · 깊이 알아 둘 말</p>
<p class="lead">입자가 타고난 각운동량. 전자는 재면 늘 '위' 아니면 '아래' 두 값만 나와요.</p><section class="box"><h3>비유하면</h3><p>'자전'이라고 번역하지만 실제로 도는 팽이가 아니에요. 질량이나 전하 같은 타고난 성질이에요.</p></section><section><h3>이렇게 나와요</h3><p>MRI는 몸속 수소 원자핵의 스핀을 이용해요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/pauli.html">배타 원리</a> · <a href="../../../learn/gicho/t/qubit.html">큐비트</a></p></section>
