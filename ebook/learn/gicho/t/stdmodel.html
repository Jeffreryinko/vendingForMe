<p class="sub">Standard Model · 보통 알아 둘 말</p>
<p class="lead">물질을 이루는 기본 입자(쿼크·렙톤)와 중력을 뺀 세 가지 힘을 설명하는 현대 입자물리학의 뼈대.</p><section class="box"><h3>비유하면</h3><p>자연의 레고 설명서. 블록 17종으로 눈에 보이는 모든 물질을 조립해요.</p></section><section><h3>이렇게 나와요</h3><p>실험과 소수점 열 자리까지 맞지만 중력, 암흑물질, 암흑에너지는 담지 못해요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/quark.html">쿼크</a> · <a href="../../../learn/gicho/t/higgs.html">힉스 입자</a> · <a href="../../../learn/gicho/t/field.html">장</a> · <a href="../../../learn/gicho/t/darkm.html">암흑물질</a></p></section>
