<h1>매몰 비용 오류</h1>
<p class="sub">Sunk cost fallacy · 보통 알아 둘 말</p>
<p class="lead">이미 써 버려서 되찾을 수 없는 돈·시간이 아까워 손해 보는 선택을 계속하는 것.</p><section class="box"><h3>비유하면</h3><p>재미없는 영화를 '표 값이 아까워서' 끝까지 보는 것.</p></section><section><h3>이렇게 나와요</h3><p>앞으로의 이득과 비용만 따져야 해요. 이미 쓴 것은 어느 쪽을 골라도 돌아오지 않아요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/lossav.html">손실 회피</a> · <a href="../../../learn/gicho/t/dissonance.html">인지 부조화</a></p></section>
