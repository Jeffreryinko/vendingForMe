<h1>시냅스</h1>
<p class="sub">Synapse · 꼭 알아 둘 말</p>
<p class="lead">뉴런과 뉴런이 만나는 아주 좁은 틈. 여기서 화학 물질로 신호가 건너가요.</p><section class="box"><h3>비유하면</h3><p>강을 사이에 둔 두 나루터. 배(신경전달물질)가 건너가야 소식이 이어져요.</p></section><section><h3>이렇게 나와요</h3><p>뉴런 하나가 수천 개의 시냅스를 가져요. 배운다는 것은 시냅스의 세기가 바뀐다는 뜻이에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/neuron.html">뉴런</a> · <a href="../../../learn/gicho/t/neurotx.html">신경전달물질</a> · <a href="../../../learn/gicho/t/plastic.html">신경가소성</a></p></section>
