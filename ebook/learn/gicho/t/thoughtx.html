<h1>사고실험</h1>
<p class="sub">Thought experiment · 꼭 알아 둘 말</p>
<p class="lead">실제로 하지 않고 머릿속에서 상황을 꾸며 생각의 귀결을 따져 보는 방법.</p><section class="box"><h3>비유하면</h3><p>머릿속 실험실. 장비 값이 들지 않아요.</p></section><section><h3>이렇게 나와요</h3><p>갈릴레이의 낙하하는 두 공, 아인슈타인의 빛을 따라 달리기, 슈뢰딩거의 고양이, 트롤리 문제, 무지의 베일.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/schcat.html">슈뢰딩거의 고양이</a> · <a href="../../../learn/gicho/t/trolley.html">트롤리 문제</a> · <a href="../../../learn/gicho/t/veil.html">무지의 베일</a></p></section>
