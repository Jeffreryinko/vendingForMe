<h1>트롤리 문제</h1>
<p class="sub">Trolley problem · 꼭 알아 둘 말</p>
<p class="lead">선로를 바꾸면 다섯 명을 살리고 한 명이 죽는다. 바꿀 것인가? 결과와 원칙이 부딪치는 지점을 드러내는 사고실험.</p><section class="box"><h3>비유하면</h3><p>윤리 이론의 스트레스 테스트.</p></section><section><h3>이렇게 나와요</h3><p>선로 바꾸기에는 대부분 찬성하지만, 한 명을 직접 밀어 떨어뜨리는 것에는 대부분 반대해요. 계산은 같은데 왜 다를까요?</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/util.html">공리주의</a> · <a href="../../../learn/gicho/t/deont.html">의무론</a> · <a href="../../../learn/gicho/t/thoughtx.html">사고실험</a></p></section>
