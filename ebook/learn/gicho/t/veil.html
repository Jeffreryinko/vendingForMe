<h1>무지의 베일</h1>
<p class="sub">Veil of ignorance · 꼭 알아 둘 말</p>
<p class="lead">내가 어떤 처지로 태어날지 모르는 상태에서 사회의 규칙을 정한다면 어떤 규칙을 고를까를 묻는 사고실험(롤스).</p><section class="box"><h3>비유하면</h3><p>케이크를 자르는 사람이 마지막에 고르게 하면 공평하게 잘라요.</p></section><section><h3>이렇게 나와요</h3><p>롤스의 결론: 기본 자유는 모두 똑같이, 불평등은 가장 어려운 사람에게 이로울 때만.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/justice.html">정의</a> · <a href="../../../learn/gicho/t/contract.html">사회계약</a> · <a href="../../../learn/gicho/t/thoughtx.html">사고실험</a></p></section>
