<h1>덕 윤리</h1>
<p class="sub">Virtue ethics · 보통 알아 둘 말</p>
<p class="lead">'어떤 행동이 옳은가'보다 '어떤 사람이 되어야 하는가'를 묻는 윤리. 좋은 성품은 습관으로 길러져요.</p><section class="box"><h3>비유하면</h3><p>운동과 같아요. 용기 있는 행동을 거듭해야 용기 있는 사람이 돼요.</p></section><section><h3>이렇게 나와요</h3><p>아리스토텔레스의 중용 — 용기는 비겁과 무모 사이. 공자의 군자도 닮은 생각이에요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/util.html">공리주의</a> · <a href="../../../learn/gicho/t/deont.html">의무론</a> · <a href="../../../learn/gicho/t/zhongyong.html">중용</a></p></section>
