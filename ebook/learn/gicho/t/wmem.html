<h1>작업 기억</h1>
<p class="sub">Working memory · 꼭 알아 둘 말</p>
<p class="lead">지금 머릿속에 잠깐 붙들고 다루는 기억. 용량이 아주 작아요.</p><section class="box"><h3>비유하면</h3><p>책상 위 공간. 서랍(장기 기억)은 넓은데 책상에는 서너 가지만 올릴 수 있어요.</p></section><section><h3>이렇게 나와요</h3><p>전화번호를 듣고 누를 때까지 외우는 것. 옛 연구는 7±2개, 요즘은 4개 안팎으로 봐요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/ltm.html">장기 기억</a> · <a href="../../../learn/gicho/t/attention.html">주의</a> · <a href="../../../learn/gicho/t/sys12.html">시스템 1·시스템 2</a></p></section>
