<h1>무위(無爲)</h1>
<p class="sub">Wu wei · 보통 알아 둘 말</p>
<p class="lead">억지로 하지 않음. 아무것도 안 하는 게 아니라 흐름을 거스르지 않고 하는 것.</p><section class="box"><h3>비유하면</h3><p>수영할 때 힘을 빼야 뜨는 것.</p></section><section><h3>이렇게 나와요</h3><p>장자의 포정 이야기 — 소의 결을 따라 칼을 놀려 19년을 써도 칼날이 새것 같았다.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/gicho/t/dao.html">도(道)</a></p></section>
