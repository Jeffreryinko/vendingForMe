<h1>아사드 정권의 붕괴</h1>
<p class="sub">2024.12</p>
<p>13년 내전을 버틴 시리아 아사드 정권이 반군의 열흘 남짓한 공세에 무너졌어요. 후원자 러시아·이란·헤즈볼라가 다른 전쟁으로 약해진 틈이었어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>이란의 '저항의 축'에서 한가운데 고리가 빠졌어요. 새 정부의 소수 종파 보호, 제재 해제, 난민 귀환, 이스라엘·튀르키예의 개입이 남은 뉴스예요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/proxy.html">대리전</a> · <a href="../../../learn/sisa/t/refugee.html">난민</a> · <a href="../../../learn/sisa/t/sanction.html">제재</a></p></section>
