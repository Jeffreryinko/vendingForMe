<h1>중일전쟁</h1>
<p class="sub">1937~45</p>
<p>일본이 중국 본토를 전면 침공했어요. 난징에서는 6주 동안 대규모 학살이 있었어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>중국 반일 감정의 뿌리. 일본 정치인의 야스쿠니 참배, 교과서 문제에 중국이 강하게 반응하는 까닭이에요.</p></section><section><h3>숫자로 보면</h3><ul><li><b>1,500만~2,000만 명</b> — 중국 쪽 사망자(추정)</li></ul></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/warcrime.html">전쟁범죄·집단학살</a></p></section>
