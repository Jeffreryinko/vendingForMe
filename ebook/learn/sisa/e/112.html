<h1>베이징 올림픽</h1>
<p class="sub">2008</p>
<p>중국이 '다시 일어섰다'는 것을 세계에 보여 준 행사. 같은 해 미국발 금융위기로 서방이 흔들렸어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>이 무렵부터 중국이 대외적으로 자신감 있는 태도로 바뀌었다는 분석이 많아요.</p></section><section><h3>그 뒤</h3><p>금융위기 때 4조 위안 규모의 경기 부양으로 세계 경제를 받쳤지만, 그때 쌓인 지방정부 빚이 지금의 부담이에요.</p></section>
