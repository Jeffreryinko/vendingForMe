<h1>제로 코로나와 백지 시위</h1>
<p class="sub">2020~22</p>
<p>중국은 확진자 0명을 목표로 도시를 통째로 봉쇄했어요. 2022년 상하이가 두 달 봉쇄됐고, 그해 11월 여러 도시에서 흰 종이를 든 시위가 일어났어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>시위 직후 방역을 갑자기 풀었어요. 공급망 차질, 청년층의 불만, 통제 능력과 그 한계를 함께 보여 준 사건이에요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/supplychain.html">공급망</a> · <a href="../../../learn/sisa/t/authoritarian.html">권위주의·일당제</a></p></section>
