<h1>오키나와 반환</h1>
<p class="sub">1972</p>
<p>전쟁 뒤 27년 동안 미국이 다스리던 오키나와가 일본에 돌아왔어요. 미군 기지는 그대로 남았어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>주일 미군 시설의 약 70%가 일본 땅의 0.6%인 오키나와에 몰려 있어요. 기지 이전(후텐마 → 헤노코) 갈등 뉴스의 배경이에요. 대만과 가까워 군사적 가치가 커졌어요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/alliance.html">동맹</a></p></section>
