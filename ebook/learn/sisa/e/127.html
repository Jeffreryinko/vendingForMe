<h1>민주당 정권 교체와 좌절</h1>
<p class="sub">2009~12</p>
<p>반세기 만에 자민당이 선거로 정권을 내줬어요. 하지만 오키나와 기지 문제, 대지진 대응, 소비세 인상으로 3년 만에 무너졌어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>이 경험 때문에 일본 유권자는 '자민당이 싫어도 대안이 없다'고 느껴요. 야당이 여럿으로 갈라져 있는 지금 구도의 배경이에요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/ruling.html">여당과 야당</a> · <a href="../../../learn/sisa/t/coalition.html">연립정부(연정)</a></p></section>
