<h1>4·19 혁명</h1>
<p class="sub">1960</p>
<p>3·15 부정선거에 항의한 학생·시민의 시위로 이승만 대통령이 물러났어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>시민이 정권을 바꾼 첫 경험. 헌법 전문에 '불의에 항거한 4·19 민주이념'이 적혀 있어요.</p></section><section><h3>그 뒤</h3><p>내각제 정부가 들어섰지만 1년 뒤 5·16 군사 쿠데타로 끝났어요.</p></section>
</main>
