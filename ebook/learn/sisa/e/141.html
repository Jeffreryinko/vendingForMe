<h1>월드컵과 촛불, 그리고 인터넷 정치</h1>
<p class="sub">2002</p>
<p>월드컵 거리 응원, 미군 장갑차에 숨진 두 여중생을 추모하는 촛불 집회, 인터넷 지지자 모임이 만든 대통령 당선이 한 해에 일어났어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>'광장'과 '온라인'이 한국 정치의 무대가 된 출발점이에요. 촛불 집회라는 형식이 이때 자리 잡았어요.</p></section>
