<h1>세월호 참사</h1>
<p class="sub">2014</p>
<p>수학여행 가던 고등학생 등 304명이 배 침몰로 숨졌어요. 구조 실패와 정부 대응이 큰 분노를 불렀어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>'국가는 무엇을 하는가'라는 물음을 남겼어요. 안전·재난 대응 기사(이태원 참사 등)에서 늘 비교되는 사건이에요.</p></section>
