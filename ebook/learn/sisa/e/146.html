<p class="sub">2019~</p>
<p>BTS, 기생충, 오징어 게임이 세계 1위를 했어요. 한국 문화가 수출 산업이자 외교 자산이 됐어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>넷플릭스 같은 플랫폼 의존, 중국의 한한령, 저작권·AI 문제 기사의 배경. '소프트파워'는 군사·경제력이 아니라 매력으로 남을 움직이는 힘이에요.</p></section>
