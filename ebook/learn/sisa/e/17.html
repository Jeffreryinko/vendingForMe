<h1>체르노빌 원전 사고</h1>
<p class="sub">1986</p>
<p>소련 우크라이나의 원전에서 원자로가 폭발했어요. 소련 정부는 며칠 동안 숨겼고, 방사능이 유럽으로 퍼졌어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>원전 안전 논쟁의 출발점. 소련 체제의 거짓말이 드러나 붕괴를 앞당겼다는 평가도 있어요. 2022년 러시아군이 이곳과 자포리자 원전을 점령해 다시 뉴스가 됐어요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/nuclearpower.html">원자력 발전·SMR</a> · <a href="../../../learn/sisa/t/iaea.html">국제원자력기구(IAEA)</a></p></section>
