<h1>루스벨트와 전쟁 대통령</h1>
<p class="sub">1929~45</p>
<p>루스벨트는 대공황과 2차 대전을 거치며 네 번 당선됐어요. 연방 정부의 크기와 대통령의 힘이 이때 크게 커졌어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>뒤에 헌법을 고쳐 대통령을 두 번까지만 하게 했어요(수정헌법 22조). '3선' 이야기가 나올 때마다 이 조항이 뉴스에 나와요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/constitution.html">헌법</a> · <a href="../../../learn/sisa/t/executiveorder.html">행정명령</a></p></section>
