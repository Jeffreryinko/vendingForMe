<h1>매카시즘</h1>
<p class="sub">1947~54</p>
<p>냉전 초, 상원의원 매카시가 '정부 안에 공산주의자가 있다'며 근거 없는 고발을 이어 갔어요. 수많은 공무원·배우·교수가 일자리를 잃었어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>근거 없이 사람을 몰아세우는 것을 '매카시즘', '마녀사냥'이라 부르게 된 유래. 정치적 반대자 조사 뉴스에 비유로 쓰여요.</p></section>
</main>
