<h1>스페인 독감</h1>
<p class="sub">1918~20</p>
<p>1차 대전 끝 무렵 퍼진 독감으로 세계 인구의 3분의 1이 걸리고 수천만 명이 숨졌어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>코로나19 때 가장 많이 비교된 사건. 마스크·휴교·집회 금지가 그때도 있었어요.</p></section><section><h3>숫자로 보면</h3><ul><li><b>5,000만 명 안팎</b> — 사망자 추정(1,700만~1억까지 갈림)</li></ul></section>
