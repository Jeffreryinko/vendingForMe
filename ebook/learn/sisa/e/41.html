<h1>냉전 뒤의 호황과 NAFTA</h1>
<p class="sub">1991~2000</p>
<p>소련이 사라지고 인터넷이 뜨면서 미국은 긴 호황을 누렸어요. 1994년 캐나다·멕시코와 자유무역협정(NAFTA)을 맺었어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>공장이 멕시코로 옮겨 가면서 중서부 노동자의 불만이 쌓였어요. 2020년 USMCA로 고쳐졌고, 지금 관세 협상의 바탕이에요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/fta.html">자유무역협정(FTA)</a> · <a href="../../../learn/sisa/t/protectionism.html">보호무역</a> · <a href="../../../learn/sisa/t/supplychain.html">공급망</a></p></section>
