<h1>오바마 시대</h1>
<p class="sub">2009~17</p>
<p>첫 흑인 대통령. 금융위기 수습, 건강보험 개혁(오바마케어), 이란 핵 합의, 파리협정, 쿠바 수교.</p><section class="box"><h3>지금과 이어지는 점</h3><p>뒤이은 정부가 이 가운데 여럿을 뒤집었어요. 미국 정책이 정권에 따라 크게 흔들린다는 것을 세계가 알게 된 시기예요.</p></section><section><h3>그 뒤</h3><p>'아시아로의 회귀'를 내걸었지만 중동에서 발을 빼지 못했어요. 시리아의 화학무기 '레드라인'을 지키지 못했다는 비판이 남았어요.</p></section>
</main>
