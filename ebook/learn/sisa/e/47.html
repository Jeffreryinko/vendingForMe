<h1>조지 플로이드와 '흑인의 생명도 소중하다'</h1>
<p class="sub">2020</p>
<p>미니애폴리스에서 흑인 남성이 경찰의 무릎에 목이 눌려 숨졌어요. 영상이 퍼지자 미국 전역과 세계에서 시위가 일어났어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>경찰 개혁, 인종 문제, 기업·대학의 다양성 정책(DEI)과 그에 대한 반발 — 지금 미국 문화 전쟁의 한 축이에요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/culturewar.html">문화 전쟁</a></p></section>
