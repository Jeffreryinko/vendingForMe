<h1>대처와 영국의 변화</h1>
<p class="sub">1979~90</p>
<p>'영국병'으로 불리던 불황 속에 대처 총리가 국영 기업을 팔고 노조의 힘을 꺾고 세금을 낮췄어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>레이건과 함께 <b>신자유주의</b>의 얼굴. 지금 영국의 지역 격차, 금융 중심 경제의 뿌리로 꼽혀요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/union.html">노동조합·파업</a> · <a href="../../../learn/sisa/t/tax.html">세금: 직접세와 간접세</a> · <a href="../../../learn/sisa/t/inequality.html">불평등·지니계수</a></p></section>
