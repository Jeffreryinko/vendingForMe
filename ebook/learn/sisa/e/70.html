<h1>대조국전쟁</h1>
<p class="sub">1941~45</p>
<p>독일의 침공으로 소련은 2,700만 명쯤을 잃었지만 끝내 베를린을 점령했어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>러시아의 가장 큰 국가 기억. 5월 9일 승전 기념일 행진, '나치와 싸운다'는 구호가 지금 전쟁의 명분으로 쓰이는 배경이에요.</p></section><section><h3>숫자로 보면</h3><ul><li><b>약 2,700만 명</b> — 소련 사망자</li><li><b>872일</b> — 레닌그라드 봉쇄</li></ul></section>
</main>
