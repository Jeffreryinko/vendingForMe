<h1>러시아 디폴트</h1>
<p class="sub">1998</p>
<p>아시아 금융위기와 유가 하락 속에 러시아가 나랏빚을 못 갚겠다고 선언했어요. 루블 값이 폭락하고 예금이 사라졌어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>1990년대의 혼란과 굴욕의 정점. '안정'을 내건 푸틴이 이듬해 등장한 배경이에요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/default.html">디폴트(채무 불이행)</a> · <a href="../../../learn/sisa/t/fx.html">환율</a></p></section>
