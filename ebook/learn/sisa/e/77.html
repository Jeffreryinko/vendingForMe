<h1>조지아 전쟁</h1>
<p class="sub">2008</p>
<p>나토가 조지아·우크라이나의 가입 가능성을 열어 둔 넉 달 뒤, 러시아가 조지아와 닷새 동안 전쟁을 벌이고 두 분리 지역(남오세티야·압하지야)의 독립을 인정했어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>'2014년 크림, 2022년 전면 침공의 예고편'으로 불려요. 서방의 대응이 약했다는 반성이 지금 논쟁에 나와요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/nato.html">나토(NATO)</a> · <a href="../../../learn/sisa/t/greyzone.html">회색지대·하이브리드전</a></p></section>
