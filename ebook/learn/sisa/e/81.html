<h1>바그너 반란</h1>
<p class="sub">2023</p>
<p>용병 회사 바그너의 수장 프리고진이 국방부를 비난하며 모스크바로 진군하다 하루 만에 멈췄어요. 두 달 뒤 비행기 추락으로 숨졌어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>푸틴 체제의 틈이 드러난 사건. 바그너의 아프리카 사업은 국방부가 넘겨받았어요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/coup.html">쿠데타·계엄</a> · <a href="../../../learn/sisa/t/proxy.html">대리전</a></p></section>
