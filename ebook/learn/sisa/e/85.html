<h1>수에즈 위기</h1>
<p class="sub">1956</p>
<p>이집트가 수에즈 운하를 국유화하자 영국·프랑스·이스라엘이 침공했지만 미국과 소련의 압박으로 물러났어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>영국·프랑스가 더는 강대국이 아님을 보여 준 사건. 운하는 지금도 세계 무역의 12%쯤이 지나는 길목이라 홍해 불안 기사에 꼭 나와요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/hormuz.html">호르무즈 해협·수에즈 운하</a></p></section>
