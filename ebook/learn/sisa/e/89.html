<h1>레바논과 헤즈볼라</h1>
<p class="sub">1982~2006</p>
<p>이스라엘이 레바논을 침공하자 이란의 지원으로 시아파 무장 조직 헤즈볼라가 생겼어요. 정당이자 군대이자 복지 조직으로 커졌어요.</p><section class="box"><h3>지금과 이어지는 점</h3><p>2024년 이스라엘의 '삐삐 폭발' 작전과 공습으로 지도부를 잃었어요. 레바논의 종파별 권력 나누기, 경제 붕괴, 베이루트 항구 폭발(2020) 기사의 배경이에요.</p></section><section><h3>함께 볼 낱말</h3><p class="chips"><a href="../../../learn/sisa/t/hamas.html">하마스·헤즈볼라·후티</a> · <a href="../../../learn/sisa/t/proxy.html">대리전</a></p></section>
