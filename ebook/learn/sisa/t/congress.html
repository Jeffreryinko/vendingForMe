<h1>미국 의회: 상원과 하원</h1>
<p class="sub">Senate / House · 보통 알아 둘 말</p>
<p class="lead">상원은 주마다 2명씩 100명(임기 6년), 하원은 인구 비례 435명(임기 2년). 법은 둘 다 통과해야 해요.</p><section class="box"><h3>비유하면</h3><p>두 번 결재받는 구조.</p></section><section><h3>이렇게 나와요</h3><p>'필리버스터' 때문에 상원은 사실상 60표가 필요한 경우가 많아요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/sisa/t/filibuster.html">필리버스터</a> · <a href="../../../learn/sisa/t/midterm.html">미국 중간선거</a> · <a href="../../../learn/sisa/t/shutdown.html">셧다운</a></p></section>
