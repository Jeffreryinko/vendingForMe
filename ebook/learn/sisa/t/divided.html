<h1>여소야대</h1>
<p class="sub">Divided government · 보통 알아 둘 말</p>
<p class="lead">대통령의 당이 국회에서 소수인 상태. 법과 예산이 잘 안 통과돼요.</p><section class="box"><h3>비유하면</h3><p>운전대는 내가 잡았는데 기름 넣을 카드는 남이 쥔 상태.</p></section><section><h3>이렇게 나와요</h3><p>미국에서는 '분점 정부', 예산이 막히면 '셧다운'.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/sisa/t/presidential.html">대통령제</a> · <a href="../../../learn/sisa/t/veto.html">거부권(재의 요구)</a> · <a href="../../../learn/sisa/t/shutdown.html">셧다운</a></p></section>
