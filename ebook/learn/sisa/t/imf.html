<h1>IMF와 세계은행</h1>
<p class="sub">IMF / World Bank · 보통 알아 둘 말</p>
<p class="lead">IMF는 외환이 바닥난 나라에 조건을 달아 돈을 빌려주는 곳, 세계은행은 개발도상국 개발에 돈을 대는 곳.</p><section class="box"><h3>비유하면</h3><p>IMF는 응급실, 세계은행은 재활 병원.</p></section><section><h3>이렇게 나와요</h3><p>한국은 1997년 IMF 구제금융을 받았어요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/sisa/t/reserves.html">외환보유액</a> · <a href="../../../learn/sisa/t/default.html">디폴트(채무 불이행)</a></p></section>
