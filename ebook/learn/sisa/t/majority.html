<h1>과반·의결 정족수</h1>
<p class="sub">Majority / Quorum · 보통 알아 둘 말</p>
<p class="lead">과반은 절반을 넘는 수. 안건마다 통과에 필요한 수가 달라요(일반 법안은 과반, 개헌·탄핵은 3분의 2 등).</p><section class="box"><h3>비유하면</h3><p>반장 선거는 과반, 교칙 바꾸기는 3분의 2.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/sisa/t/bill.html">법안과 입법 과정</a> · <a href="../../../learn/sisa/t/impeach.html">탄핵</a> · <a href="../../../learn/sisa/t/amend.html">개헌</a></p></section>
