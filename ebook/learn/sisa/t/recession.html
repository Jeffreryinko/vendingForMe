<h1>경기 침체</h1>
<p class="sub">Recession · 꼭 알아 둘 말</p>
<p class="lead">경제가 한동안 쪼그라드는 것. 흔히 GDP가 두 분기 연속 줄면 침체로 봐요.</p><section class="box"><h3>비유하면</h3><p>가게 매출이 두 철 연속 줄어든 것.</p></section><section><h3>이렇게 나와요</h3><p>'연착륙' = 침체 없이 물가만 잡는 것, '경착륙' = 침체가 오는 것.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/sisa/t/gdp.html">국내총생산(GDP)</a> · <a href="../../../learn/sisa/t/stagflation.html">스태그플레이션</a> · <a href="../../../learn/sisa/t/rate.html">기준금리</a></p></section>
