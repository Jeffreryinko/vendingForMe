<h1>세금: 직접세와 간접세</h1>
<p class="sub">Tax · 보통 알아 둘 말</p>
<p class="lead">직접세는 번 사람이 직접 내는 세금(소득세·법인세), 간접세는 물건값에 붙는 세금(부가가치세).</p><section><h3>이렇게 나와요</h3><p>'감세'와 '증세'는 늘 누구의 세금인지 확인하세요.</p></section><section><h3>이어지는 말</h3><p class="chips"><a href="../../../learn/sisa/t/budget.html">예산과 재정</a></p></section>
