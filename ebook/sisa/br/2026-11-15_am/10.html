<h1>뉴올리언스에서 유조선과 크루즈선이 부딪혔어요</h1>
<p class="sub">10/14</p>
<p class="tag">재난</p><p class="lead">미시시피강에서 승객 130명 안팎의 크루즈선이 유조선과 충돌해 일부 침몰했어요.</p><p>AP는 구조 작업이 진행 중이라고 전했어요. 푸블리쿠는 32명이 다쳤다고 전했고, 매체에 따라 승객은 129~150명으로 달라요.</p>
