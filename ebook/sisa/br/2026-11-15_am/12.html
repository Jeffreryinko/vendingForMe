<h1>마크롱이 우크라이나 지원 축소론을 비판했어요</h1>
<p class="sub">12/14</p>
<p class="tag">정치</p><p class="lead">마크롱 대통령은 지원을 줄이자는 주장이 더 많은 전쟁을 부를 수 있다고 말했어요.</p><p>스트레이츠타임스는 마크롱이 지원 축소가 더 많은 전쟁을 예고한다고 말했다고 전했어요. 피가로는 부당한 평화를 강요하려는 것이라고 주장했다고 전했어요.</p>
