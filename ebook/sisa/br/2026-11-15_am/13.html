<h1>남수단이 첫 전국 선거를 2월로 미뤘어요</h1>
<p class="sub">13/14</p>
<p class="tag">정치</p><p class="lead">남수단이 첫 전국 선거를 2027년 2월 11일로 연기했어요.</p><p>스트레이츠타임스는 선거가 2027년 2월 11일로 미뤄졌다고 전했어요. 닛케이는 준비 기간 확보를 이유로 들었다고 전했어요.</p>
