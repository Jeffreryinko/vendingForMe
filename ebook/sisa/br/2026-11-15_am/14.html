<h1>미국이 홍역 퇴치 지위를 잃었어요</h1>
<p class="sub">14/14</p>
<p class="tag">사회</p><p class="lead">미국이 홍역 퇴치 상태를 유지하지 못했다고 슬래시닷과 솔리돗이 전했어요.</p><p>슬래시닷은 질병이 계속 퍼져 목표 달성에 공식적으로 실패했다고 전했어요.</p>
