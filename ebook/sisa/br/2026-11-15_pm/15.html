<h1>필리핀과 호주가 방위 협력을 맺었어요</h1>
<p class="sub">15/19</p>
<p class="tag">분쟁</p><p class="lead">필리핀과 호주가 중국을 겨냥한 새 방위 협력을 맺었어요.</p><p>로이터는 필리핀과 호주가 중국을 겨냥해 방위 협력을 체결했다고 전했어요. 중앙통신사는 남중국해 영토 확장을 억제하기 위한 새 국방 협약이라고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>남중국해를 둘러싼 안보 협력이 넓어지고 있어요.</p></section>
