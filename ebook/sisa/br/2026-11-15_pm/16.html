<h1>요르단이 교회 테러 사건에 사형을 선고했어요</h1>
<p class="sub">16/19</p>
<p class="tag">분쟁</p><p class="lead">요르단 법원이 교회 폭격 사건에 연루된 3명에게 사형을 선고했어요.</p><p>BBC 아랍어는 요르단 국가보안법원이 사형 판결을 내렸다고 전했어요. 스트레이츠타임스는 총격범들이 장례식에 난입해 9명이 숨지고 25명이 다쳤다고 전했어요.</p>
