<h1>교황 레오 14세가 페루 안데스 마을을 찾았어요</h1>
<p class="sub">17/19</p>
<p class="tag">사회</p><p class="lead">교황 레오 14세가 헬리콥터로 페루 안데스 외딴 마을을 방문했어요.</p><p>BBC는 교황이 지역 사회의 고통을 언급했다고 전했어요. 알자지라는 폭력 중단을 촉구했다고 전했어요. 스페인 ABC는 교황이 과거 의사로 방문했던 때처럼 헬리콥터로 다시 찾았다고 전했어요.</p>
