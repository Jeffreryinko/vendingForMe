<h1>윌리엄 왕자 부부가 인도를 방문해요</h1>
<p class="sub">18/19</p>
<p class="tag">문화</p><p class="lead">영국 윌리엄 왕자가 케이트 왕세자빈과 함께 인도를 방문해요.</p><p>로이터는 윌리엄 왕자가 케이트와 함께 인도를 방문한다고 전했어요. 중앙통신사는 암 투병 뒤 가장 큰 규모의 해외 방문이라고 전했어요.</p>
