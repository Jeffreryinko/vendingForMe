<h1>마이애미 공항 활주로에서 비행기 두 대가 부딪혔어요</h1>
<p class="sub">19/19</p>
<p class="tag">재난</p><p class="lead">마이애미 공항에서 비행기 두 대가 충돌해 승객 두 명이 경미한 부상을 입었어요.</p><p>빌트는 활주로에서 두 대가 충돌했다고 전했어요. 스트레이츠타임스는 승객 두 명이 경미한 부상을 입었다고 전했어요.</p>
