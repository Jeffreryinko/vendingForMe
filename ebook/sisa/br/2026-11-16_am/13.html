<h1>요르단이 교회 총격범 3명에게 사형을 선고했어요</h1>

<p class="tag">분쟁</p><p class="lead">요르단 법원이 교회 공격에 연루된 3명에게 사형을 선고했어요.</p><p>BBC 아랍어판은 국가보안법원이 사형을 선고했다고 전했어요. 연합뉴스는 성탄절 행사도 취소됐다고 전했어요.</p>
