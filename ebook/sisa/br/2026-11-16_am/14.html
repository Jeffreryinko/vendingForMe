<h1>체코에서 공영 방송 개편에 반대하는 대규모 시위가 열렸어요</h1>
<p class="sub">14/18</p>
<p class="tag">사회</p><p class="lead">프라하에서 수십만 명이 정부의 공영방송 재정 개편에 반대해 시위했어요.</p><p>로이터는 수십만 명이 시위했다고 전했어요. ANSA와 폴란드 매체는 40만 명이라고 전했어요. 리베라시옹은 정치적 통제를 우려한다고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>공영 미디어의 독립성을 둘러싼 논란이 커지고 있어요.</p></section>
