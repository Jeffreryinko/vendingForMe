<h1>중국 전기 여객기가 승객을 태우고 날았어요</h1>
<p class="sub">17/17</p>
<p class="tag">기술</p><p class="lead">중국 전기 여객기 CE-25A가 승객을 태우고 첫 비행에 성공했어요.</p><p>하이제는 승객이 탑승해 비행했다고 전했어요. 요약에 따르면 COMAC이 개발했고 항속거리는 400km, 19명이 탈 수 있어요. VOZ는 18명을 태웠다고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>전기 항공기가 단거리 도시 간 이동에 쓰일 가능성을 보여줘요.</p></section>
</main>
