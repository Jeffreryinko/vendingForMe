<h1>미국 은행·항공사 시스템이 멈췄어요</h1>
<p class="sub">15/23</p>
<p class="tag">경제</p><p class="lead">JP모건 체이스 오류로 은행 서비스가 지연됐고 유나이티드항공은 400편 넘게 지연됐어요.</p><p>AP는 JP모건 체이스 기술 문제로 온라인 뱅킹이 지연됐다고 했어요. 중앙통신사는 항공편 400편 이상 지연을 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>금융과 항공이 동시에 영향을 받았어요.</p></section>
