<h1>민주당 최민희 사태로 계파 갈등이 커졌어요</h1>
<p class="sub">16/23</p>
<p class="tag">정치</p><p class="lead">최민희 의원이 사과했지만 김민석 대표 앞에서 신천지 문제로 맞서 갈등이 커졌어요.</p><p>한겨레는 최민희가 사과 뒤 신천지 역공을 폈다고 전했어요. 네이버 많이 본 기사에 따르면 최민희는 윤리심판원에 이첩됐어요.</p><section class="box"><h3>왜 중요해요</h3><p>여당 내 갈등이 드러났어요.</p></section>
