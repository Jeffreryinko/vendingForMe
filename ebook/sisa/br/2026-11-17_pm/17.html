<h1>르펜이 당선되면 우크라이나 재정 지원을 끊겠대요</h1>
<p class="sub">17/20</p>
<p class="tag">정치</p><p class="lead">르펜은 대통령이 되면 우크라이나 재정 지원을 중단하겠다고 했어요.</p><p>뉴시스에 따르면 르펜은 기존 약속은 지키고 물자·인도적 지원은 이어가겠다고 했어요.</p><section class="box"><h3>왜 중요해요</h3><p>프랑스 대선이 우크라이나 지원에 변수가 돼요.</p></section><section><h3>배경 지식</h3><p class="chips"><a href="../../../learn/sisa/t/farright.html">극우·극좌 정당</a></p></section>
