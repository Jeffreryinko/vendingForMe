<h1>미국이 중국의 AI 원격 접속을 막았어요</h1>
<p class="sub">13/20</p>
<p class="tag">기술</p><p class="lead">미국이 동남아 등을 통한 중국 기업의 AI 컴퓨팅 임대를 막았고 중국은 반발했어요.</p><p>BBC 중문은 미국이 '뒷문'을 막았다고 전했어요. 구글 뉴스 한국은 중국이 강하게 반발했다고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>미중 기술 갈등이 이어지는 모습이에요.</p></section><section><h3>배경 지식</h3><p class="chips"><a href="../../../learn/sisa/t/exportcontrol.html">수출 통제</a></p></section>
