<h1>김정은이 백두산에 올라 북미 대화설이 나와요</h1>
<p class="sub">14/20</p>
<p class="tag">정치</p><p class="lead">북미 대화 가능성이 거론되는 때에 김정은이 딸 김주애와 백두산을 찾았어요.</p><p>SBS는 중대 결심 신호인지 분석했어요. 국민일보는 중국 APEC을 앞두고 올랐다고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>북미 대화 가능성과 맞물려 주목돼요.</p></section>
