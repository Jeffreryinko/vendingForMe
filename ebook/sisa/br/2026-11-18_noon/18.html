<h1>애플 서비스가 한때 먹통이 됐어요</h1>
<p class="sub">18/20</p>
<p class="tag">기술</p><p class="lead">iCloud와 앱스토어 등 애플 서비스에 오류가 났고 애플은 내부 업데이트 탓이라고 밝혔어요.</p><p>로이터는 애플이 복구에 힘쓰고 있다고 전했어요. 브라질, 그리스, 라트비아에서도 불만이 접수됐어요.</p><section class="box"><h3>왜 중요해요</h3><p>전 세계 이용자에게 영향을 준 장애예요.</p></section>
