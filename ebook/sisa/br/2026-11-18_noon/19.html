<h1>이스라엘 의회 의장에 카하나가 뽑혔어요</h1>
<p class="sub">19/20</p>
<p class="tag">정치</p><p class="lead">아이젠코트 측근 마탄 카하나가 120석 중 66표로 의장에 뽑혀 네타냐후가 타격을 받았어요.</p><p>프랑스앵포는 네타냐후에게 큰 타격이라고 전했어요. 한델스블라트는 네타냐후가 의회에서 졌다고 보도했어요.</p><section class="box"><h3>왜 중요해요</h3><p>이스라엘 정국에 영향이 있어요.</p></section>
