<h1>경북 상주에서 규모 3.6 지진이 났어요</h1>
<p class="sub">12/18</p>
<p class="tag">재난</p><p class="lead">경북 상주 북서쪽에서 지진이 나 경북·충북이 흔들렸어요.</p><p>KBS에 따르면 규모 3.6이고, 기상청 속보에는 3.7로 나왔어요. 뉴스1에 따르면 유감 신고가 39건 접수됐어요.</p><section class="box"><h3>왜 중요해요</h3><p>수능 전날이라 관심이 컸어요.</p></section>
