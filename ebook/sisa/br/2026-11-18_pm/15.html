<h1>유럽 5개국이 르완다 송환센터를 추진해요</h1>
<p class="sub">15/18</p>
<p class="tag">정치</p><p class="lead">거부된 난민 신청자를 르완다로 보낼 센터 계획에 독일 SPD가 반대해요.</p><p>가디언에 따르면 EU 5개국이 계획을 발표했어요. 독일 매체에 따르면 40자리에 2천만 유로가 들 것으로 봐요. 인권단체가 우려한다고 CBC가 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>유럽 난민 정책이 더 엄격해져요.</p></section><section><h3>배경 지식</h3><p class="chips"><a href="../../../learn/sisa/t/refugee.html">난민</a></p></section>
