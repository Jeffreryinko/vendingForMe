<h1>한동훈 장인상에 정치권 조문이 이어졌어요</h1>
<p class="sub">8/18</p>
<p class="tag">정치</p><p class="lead">한동훈 의원 장인 빈소에 여야 인사가 찾았고 이 대통령은 조화를 보냈어요.</p><p>노컷뉴스에 따르면 장동혁 대표도 조문했고, 국민의힘은 조작 징계 논란으로 내홍 중이에요. 오세훈, 김문수, 정동영 등이 빈소를 찾았어요.</p><section class="box"><h3>왜 중요해요</h3><p>국민의힘 내부 갈등이 계속돼요.</p></section>
