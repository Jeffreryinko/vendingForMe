<h1>조국 전 대표가 일본 입국을 거부당했어요</h1>
<p class="sub">9/18</p>
<p class="tag">정치</p><p class="lead">조국 전 대표가 하네다공항에서 입국이 불허돼 일정이 무산됐고 혁신당은 사과를 요구했어요.</p><p>조선일보에 따르면 독도 방문 이력 때문일 수 있다는 관측이 나왔어요. KBS에 따르면 혁신당은 사과와 재발 방지를 요구했어요.</p><section class="box"><h3>왜 중요해요</h3><p>한일 외교 갈등으로 번질 수 있어요.</p></section>
