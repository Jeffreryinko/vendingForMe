<h1>강남 학원장이 초등생 성폭행 혐의로 체포됐어요</h1>
<p class="sub">12/18</p>
<p class="tag">사회</p><p class="lead">채팅앱으로 초등생을 유인해 성폭행한 혐의로 강남 학원장이 긴급체포됐어요.</p><p>연합뉴스에 따르면 30대 학원장이 긴급체포됐어요. SBS는 가출을 돕겠다며 유인했다고 전했어요. 뉴스1은 술을 먹였다고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>아동 대상 범죄와 채팅앱 문제를 다시 보게 해요.</p></section>
</main>
