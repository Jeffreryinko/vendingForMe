<h1>하남 헌옷수거함에서 신생아 시신이 나왔어요</h1>
<p class="sub">13/18</p>
<p class="tag">사회</p><p class="lead">경기 하남 아파트 헌옷수거함에서 신생아 시신이 발견돼 경찰이 수사해요.</p><p>연합뉴스에 따르면 헌옷수거함에서 아기 시신이 발견됐어요. 네이버 많이 본 기사는 탯줄이 붙은 상태였다고 전했어요.</p>
</main>
