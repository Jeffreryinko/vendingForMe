<h1>애플 서비스가 한때 오류를 일으켰어요</h1>
<p class="sub">16/18</p>
<p class="tag">기술</p><p class="lead">애플이 iCloud와 앱스토어 등의 오류 원인을 내부 업데이트 실패라고 밝혔어요.</p><p>로이터는 애플이 내부 업데이트로 중단된 서비스를 복구하고 있다고 전했어요. 메두자는 애플이 원인을 업데이트 실패로 설명했다고 전했어요.</p>
