<h1>보이저 1호가 빛의 하루 거리에 도달했어요</h1>
<p class="sub">17/18</p>
<p class="tag">기술</p><p class="lead">NASA의 보이저 1호가 지구에서 빛이 하루 걸리는 거리에 도달했어요.</p><p>로이터는 보이저 1호가 1광일 이정표에 닿았다고 전했어요. 세계일보는 49년 만의 새 이정표라고 전했어요. 르몽드는 259억 킬로미터 떨어졌다고 전했어요.</p>
