<h1>조태용 전 국정원장 징역 2년 6개월이 확정됐어요</h1>
<p class="sub">10/17</p>
<p class="tag">사회</p><p class="lead">대법원이 계엄 후 허위 발언을 한 조태용 전 국정원장에게 징역 2년 6개월을 확정했어요.</p><p>한겨레에 따르면 정치인 체포 지시가 없었다고 거짓 발언을 한 혐의예요. 경향신문은 위증과 정치 관여라고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>계엄 관련 재판에서 확정판결이 나왔어요.</p></section>
