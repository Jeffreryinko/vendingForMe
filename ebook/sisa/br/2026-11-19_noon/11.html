<h1>한동훈 장인상에 여야 조문이 이어졌어요</h1>
<p class="sub">11/17</p>
<p class="tag">정치</p><p class="lead">한동훈 의원 장인 빈소에 여야 인사가 찾았고 이 대통령과 장동혁 대표는 조화를 보냈어요.</p><p>국민일보에 따르면 빈소에서 한 의원과 장 대표가 껄끄럽게 마주쳤어요. 네이버 많이 본 기사에는 차기 대통령감 여론조사도 올랐어요.</p><section class="box"><h3>왜 중요해요</h3><p>여야 구도가 드러난 자리예요.</p></section>
