<h1>강남 학원장이 초등생 성폭행 혐의로 체포됐어요</h1>
<p class="sub">13/17</p>
<p class="tag">사회</p><p class="lead">채팅앱으로 초등생을 유인해 성폭행한 혐의로 30대 강남 학원장이 긴급체포됐어요.</p><p>연합뉴스에 따르면 경찰이 학원장을 긴급체포했어요. 뉴스1은 술을 먹이고 성폭행했다고 전했어요.</p>
