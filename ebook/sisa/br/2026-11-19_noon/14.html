<h1>하남 헌옷수거함 신생아 시신, 친모를 체포했어요</h1>
<p class="sub">14/17</p>
<p class="tag">사회</p><p class="lead">경기 하남 아파트 헌옷수거함에서 신생아 시신이 나왔고 30대 친모가 붙잡혔어요.</p><p>연합뉴스에 따르면 경찰이 친모를 검거했어요. 매일경제는 긴급체포라고 전했어요.</p><section><h3>지난번과 달라진 점</h3><p>지난 브리핑에서는 수사 중이었는데 친모가 검거됐어요.</p></section>
