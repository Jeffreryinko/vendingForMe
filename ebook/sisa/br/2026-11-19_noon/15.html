<h1>미국이 베네수엘라와 군사 협력을 강화해요</h1>
<p class="sub">15/17</p>
<p class="tag">분쟁</p><p class="lead">헤그세스 미 국방장관이 베네수엘라를 방문해 군사 협력을 발표했어요.</p><p>로이터에 따르면 협력 강화를 밝혔어요. BBC 문도는 마두로 체포를 언급했다고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>미국과 베네수엘라의 관계가 크게 바뀌었어요.</p></section>
