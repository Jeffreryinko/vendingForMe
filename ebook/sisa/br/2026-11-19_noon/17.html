<h1>이스라엘이 가자 중부에서 작전을 시작했어요</h1>
<p class="sub">17/17</p>
<p class="tag">분쟁</p><p class="lead">이스라엘군이 가자 중부에서 작전을 벌여 주민들이 대피했어요.</p><p>BBC에 따르면 옐로라인을 넘은 드문 지상 작전이에요. 알자지라는 주민이 난민촌에서 대피했다고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>휴전이 흔들릴 수 있어요.</p></section><section><h3>배경 지식</h3><p class="chips"><a href="../../../learn/sisa/t/ceasefire.html">휴전·정전·종전</a></p></section>
