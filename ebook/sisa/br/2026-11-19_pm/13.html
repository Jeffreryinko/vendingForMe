<h1>하남 헌옷수거함 신생아 시신, 친모를 잡았어요</h1>
<p class="sub">13/19</p>
<p class="tag">사회</p><p class="lead">하남 아파트 헌옷수거함에서 나온 신생아 시신과 관련해 30대 친모가 긴급체포됐어요.</p><p>연합뉴스에 따르면 30대 여성이 검거됐어요. 한국경제는 탯줄이 달린 시신이 발견됐다고 전했어요.</p><section><h3>지난번과 달라진 점</h3><p>지난 브리핑 뒤 친모가 체포됐어요.</p></section>
