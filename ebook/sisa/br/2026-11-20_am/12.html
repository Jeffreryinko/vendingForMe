<h1>푸틴이 크림 다리 공격에 보복을 예고했어요</h1>
<p class="sub">12/16</p>
<p class="tag">분쟁</p><p class="lead">우크라이나의 크림 다리 공격에 푸틴이 더 고통스러운 대응을 하겠다고 밝혔어요.</p><p>BBC에 따르면 푸틴은 훨씬 더 고통스러운 대응을 약속했어요. 한델스블라트는 푸틴이 우크라이나 회담 재개에 동의했다고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>전쟁이 더 확대될 수 있어요.</p></section>
