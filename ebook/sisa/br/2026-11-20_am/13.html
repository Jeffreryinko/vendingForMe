<h1>젤렌스키가 베를린에서 회담을 해요</h1>
<p class="sub">13/16</p>
<p class="tag">정치</p><p class="lead">젤렌스키가 유럽 관계자와 트럼프 측 특사를 만나려고 베를린에 도착했어요.</p><p>키이우 인디펜던트에 따르면 젤렌스키가 베를린에 도착했어요. 중앙사는 미국 특사 쿠슈너와 위트코프도 도착했다고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>우크라이나 문제를 둘러싼 외교가 이어져요.</p></section>
