<p class="tag">분쟁</p><p class="lead">후티 반군의 미사일이 사우디 리야드의 PIF 타워를 파손했어요.</p><p>Fox News는 후티가 리야드 최고층 빌딩을 공격했다고 전했어요. 네이버 뉴스 많이 본 기사는 빈 살만 왕세자 개혁의 상징이 파손됐다고 보도했어요.</p><section><h3>배경 지식</h3><p class="chips"><a href="../../../learn/sisa/t/hamas.html">하마스·헤즈볼라·후티</a></p></section>
