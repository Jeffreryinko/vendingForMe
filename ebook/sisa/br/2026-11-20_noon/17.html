<h1>트럼프가 이란 공격 재개를 고민한다고 해요</h1>
<p class="sub">17/17</p>
<p class="tag">분쟁</p><p class="lead">트럼프가 Axios에 이란 공격 재개를 검토 중이라고 밝혔다고 전해졌어요.</p><p>Folha는 트럼프가 네타냐후의 압력으로 이란 공격 재개를 고려한다고 전했어요. Times of Israel은 네타냐후가 4~7일간의 작전을 추진 중이라고 보도했어요.</p>
</main>
