<h1>코스피가 급락해 매도 사이드카가 발동했어요</h1>
<p class="sub">10/15</p>
<p class="tag">경제</p><p class="lead">코스피가 장중 5% 가까이 떨어져 매도 사이드카가 발동했어요. 코스닥도 이어서 발동했어요.</p><p>연합뉴스에 따르면 한국거래소가 오전 11시54분께 코스피에 매도 사이드카를 발동했어요. 한국경제는 코스피가 5.4% 급락했고 삼성전자와 하이닉스가 6%대 떨어졌다고 전했어요.</p><section><h3>배경 지식</h3><p class="chips"><a href="../../../learn/sisa/t/stockindex.html">주가지수</a></p></section>
