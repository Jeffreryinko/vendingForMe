<h1>민주유공자법이 본회의를 통과했어요</h1>
<p class="sub">11/15</p>
<p class="tag">정치</p><p class="lead">민주유공자법이 여당 주도로 국회 본회의를 통과했어요.</p><p>연합뉴스에 따르면 민주유공자법이 여당 주도로 통과했어요. 중앙일보는 26년 만의 입법이며 야당은 운동권 특혜라고 비판했다고 전했어요. 국민일보는 희생자와 유족에 예우와 의료비 등을 지원한다고 전했어요.</p><section><h3>배경 지식</h3><p class="chips"><a href="../../../learn/sisa/t/filibuster.html">필리버스터</a></p></section>
