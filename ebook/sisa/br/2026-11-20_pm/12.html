<h1>카카오 김범수가 2심도 무죄를 받았어요</h1>
<p class="sub">12/15</p>
<p class="tag">사회</p><p class="lead">SM엔터 시세조종 혐의를 받은 카카오 김범수 창업자가 항소심에서도 무죄를 받았어요.</p><p>한겨레에 따르면 김범수 창업자가 2심에서도 무죄를 받았어요. 한국경제는 김범수가 카카오의 불확실성이 해소됐고 과감한 변화가 필요하다고 말했다고 전했어요.</p>
