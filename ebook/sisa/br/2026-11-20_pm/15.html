<h1>GTA 6이 출시돼 세계가 들썩였어요</h1>
<p class="sub">15/15</p>
<p class="tag">기술</p><p class="lead">GTA 6이 출시돼 전 세계에서 큰 관심을 받았어요.</p><p>르 몽드는 GTA VI 출시 소식을 실시간으로 전했어요. FAZ는 가장 비싼 비디오 게임이라고 소개했어요. 로이터는 테이크투가 판매 기록을 경신할 것으로 예상했다고 전했어요.</p>
