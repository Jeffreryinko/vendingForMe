<h1>컬리에서 1만여 명 개인정보가 유출됐어요</h1>
<p class="sub">15/20</p>
<p class="tag">사회</p><p class="lead">컬리 큐레이터 1만여 명의 개인정보가 유출됐고 회사는 손해를 전액 보상하겠다고 했어요.</p><p>연합뉴스는 최대 15만원 적립금 보상을 전했어요. 세계일보는 주민번호와 계좌번호도 포함됐다고 했어요.</p><section class="box"><h3>왜 중요해요</h3><p>민감한 정보까지 유출돼 피해가 우려돼요.</p></section><section><h3>배경 지식</h3><p class="chips"><a href="../../../learn/sisa/t/privacy.html">개인정보·데이터 주권</a></p></section>
