<h1>한국 수출이 1조 달러를 달성했어요</h1>
<p class="sub">16/20</p>
<p class="tag">경제</p><p class="lead">대한민국 수출이 1조 달러를 달성했어요.</p><p>구글 뉴스 한국은 수출 1조 달러 달성을 전했어요. SBS는 화장품과 라면도 수출을 이끌었다고 전했어요.</p><section class="box"><h3>왜 중요해요</h3><p>한국 경제 규모를 보여 주는 이정표예요.</p></section>
