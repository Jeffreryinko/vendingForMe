<h1>법원이 김수현 소속사에 쿠쿠 배상을 명령했어요</h1>
<p class="sub">17/20</p>
<p class="tag">사회</p><p class="lead">법원이 김수현 소속사가 쿠쿠에 모델료 8억 7500만원가량을 돌려주라고 판결했어요.</p><p>연합뉴스는 사생활 논란으로 모델료를 돌려줘야 한다고 판결했다고 전했어요. 매체에 따라 금액은 8억 7000만~8억 7500만원이에요.</p><section class="box"><h3>왜 중요해요</h3><p>광고 계약 책임을 따진 판결이에요.</p></section>
</main>
