<h1>성북구 10대 살인 피의자 아들이 재판에 넘겨졌어요</h1>
<p class="sub">19/20</p>
<p class="tag">사회</p><p class="lead">피의자의 아들이 피해자에 대한 미성년자의제강간 혐의로 재판에 넘겨졌어요.</p><p>연합뉴스는 8개월 만에 재판에 넘겨졌다고 전했어요. 경찰이 이 사건을 살인의 배경 중 하나로 지목했다고 했어요.</p>
