<h1>리트 만점자가 숨진 뒤에도 수사가 이어져요</h1>
<p class="sub">10/21</p>
<p class="tag">사회</p><p class="lead">리트 만점자가 숨진 채 발견됐지만 커닝 의혹을 따지는 수사는 계속돼요.</p><p>한국일보는 타살 흔적이 없고 고발 사건 수사는 이어진다고 전했어요. 세계일보는 압수수색이 어려워 수사가 난항이라고 보도했어요. 고발한 변호사는 AI 부정행위 단서를 찾아달라고 촉구했어요.</p>
