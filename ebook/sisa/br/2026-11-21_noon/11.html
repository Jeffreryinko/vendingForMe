<h1>경부선 화물열차가 탈선했어요</h1>
<p class="sub">11/21</p>
<p class="tag">재난</p><p class="lead">21일 오전 경부선 소정리역에서 화물열차가 탈선해 천안~대전 일반열차 운행이 멈췄어요. KTX는 정상 운행했어요.</p><p>코레일에 따르면 오전 5시 37분쯤 사고가 났어요. 매일경제는 전차선 단전도 있었다고 전했어요. 수험생에게 다른 교통수단을 이용하라고 당부했어요.</p>
