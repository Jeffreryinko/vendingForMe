<h1>김종철 경찰청장 임명안이 재가됐어요</h1>
<p class="sub">12/21</p>
<p class="tag">정치</p><p class="lead">이재명 대통령이 김종철 경찰청장 후보자 임명안을 재가해 1년 11개월 공백이 끝났어요.</p><p>청와대 강유정 수석대변인이 20일 재가 사실을 알렸어요. 국회 행안위는 18일 청문회를 열고 보고서를 여야 합의로 채택했어요.</p>
