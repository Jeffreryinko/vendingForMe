<h1>김세의 대표가 또 기소됐어요</h1>
<p class="sub">13/21</p>
<p class="tag">사회</p><p class="lead">가로세로연구소 김세의 대표가 명예훼손·모욕 혐의로 추가 기소됐어요. 피해자는 13명이에요.</p><p>연합뉴스는 피해자가 13명이라고 전했어요. 경향신문은 은현장, 박선원, 권영세, 전광훈 등이 피해자라고 보도했어요.</p>
