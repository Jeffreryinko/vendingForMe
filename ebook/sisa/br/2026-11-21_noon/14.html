<h1>컬리에서 개인정보 1만여 명이 유출됐어요</h1>
<p class="sub">14/21</p>
<p class="tag">기술</p><p class="lead">컬리 큐레이터 1만여 명의 개인정보가 유출됐어요. 컬리는 피해를 보상하겠다고 했어요.</p><p>세계일보는 주민번호와 계좌번호도 포함됐다고 전했어요. 연합뉴스는 최대 15만 원 적립금 보상 방침을 보도했어요.</p><section><h3>배경 지식</h3><p class="chips"><a href="../../../learn/sisa/t/privacy.html">개인정보·데이터 주권</a></p></section>
