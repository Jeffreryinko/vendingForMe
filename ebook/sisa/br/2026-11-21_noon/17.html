<h1>덴마크가 러시아 군사 참사관을 추방해요</h1>
<p class="sub">17/21</p>
<p class="tag">정치</p><p class="lead">덴마크가 러시아 군사 참사관에게 7일 안에 떠나라고 했고 비자 발급도 강화해요.</p><p>메두자는 덴마크 외무장관이 기자회견에서 밝혔다고 전했어요. 타게스샤우는 테러 계획 의혹으로 러시아 대사와 면담을 중단했다고 보도했어요.</p>
