<h1>GTA 6가 첫날 38억 달러를 벌었어요</h1>
<p class="sub">20/21</p>
<p class="tag">문화</p><p class="lead">게임 GTA VI가 출시 첫날 약 37억 9천만 달러 매출을 기록했어요.</p><p>프랑스앙포는 개발사 발표라고 전했어요. 슬래시닷은 매출이 천문학적이라고 보도했어요. 3250만 부가 팔렸다는 보도도 있어요.</p>
