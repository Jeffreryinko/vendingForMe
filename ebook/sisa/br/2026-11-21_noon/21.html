<h1>미국 상원이 이란전 중단 요구를 부결했어요</h1>
<p class="sub">21/21</p>
<p class="tag">정치</p><p class="lead">미국 상원이 트럼프의 이란 관련 군사 권한을 제한하자는 안을 부결했어요.</p><p>연합뉴스는 공화당이 여전히 트럼프를 지지한다고 전했어요. 알자지라도 공화당 의원들이 제한 조치에 반대했다고 보도했어요.</p><section><h3>배경 지식</h3><p class="chips"><a href="../../../learn/sisa/t/congress.html">미국 의회: 상원과 하원</a></p></section>
