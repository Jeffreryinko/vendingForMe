<h1>GTA 6가 출시 첫날 약 38억 달러를 벌었어요</h1>
<p class="sub">17/17</p>
<p class="tag">경제</p><p class="lead">GTA 6가 출시 첫날 약 37억 9천만 달러 매출을 냈다고 개발사가 밝혔어요.</p><p>슈피겔과 슬래시닷 등이 이를 전했어요. 러시아 DTF는 사전 판매가 3250만 부라고 했어요. 전작의 첫 24시간 매출보다 거의 다섯 배라는 설명도 나왔어요.</p><section class="box"><h3>왜 중요해요</h3><p>게임 시장 기록을 크게 넘겼어요.</p></section>
