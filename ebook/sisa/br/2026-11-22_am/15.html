<h1>발트해에서 러시아 화물선이 드론 공격을 받았어요</h1>
<p class="sub">15/21</p>
<p class="tag">분쟁</p><p class="lead">핀란드만 공해상에서 칼리닌그라드로 가던 러시아 화물선이 드론 공격을 받았어요.</p><p>핀란드군이 공격을 감지했다고 르피가로가 전했어요. 르몽드는 핀란드가 러시아 헬리콥터의 영공 진입을 의심한다고 했어요.</p><section class="box"><h3>왜 중요해요</h3><p>발트해 긴장이 높아졌어요.</p></section>
</main>
