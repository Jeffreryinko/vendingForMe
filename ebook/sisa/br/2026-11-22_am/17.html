<h1>바레인 산업시설이 이란 공격으로 불탔어요</h1>
<p class="sub">17/22</p>
<p class="tag">분쟁</p><p class="lead">바레인은 이란의 공격으로 민간 산업시설에 불이 났다고 밝혔어요. 부상자는 없다고 해요.</p><p>로이터와 알아라비야에 따르면 바레인 내무부는 재산 피해는 확인됐지만 부상자 보고는 없다고 밝혔어요.</p>
