<h1>핀란드만에서 러시아행 선박이 드론 공격을 받았어요</h1>
<p class="sub">19/22</p>
<p class="tag">분쟁</p><p class="lead">핀란드 해역에서 러시아 상선이 드론에 공격당해 불이 났어요.</p><p>BBC와 타게스샤우에 따르면 핀란드만을 지나던 러시아행 선박이 공격받았어요. 탑승 인원 정보는 엇갈려요.</p>
