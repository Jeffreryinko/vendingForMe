<h1>덴마크가 러시아인 여행 제한을 요구했어요</h1>
<p class="sub">20/22</p>
<p class="tag">정치</p><p class="lead">덴마크는 러시아의 암살 시도 계획이 있었다며 EU 차원의 여행 제한을 요구했어요.</p><p>BBC에 따르면 덴마크는 러시아가 래퍼 암살을 계획했다고 비난했어요. 메두자는 덴마크가 러시아인에게 관광 비자 발급을 중단하라고 촉구했다고 전했어요.</p>
</main>
