<h1>리스본에서 생활비 항의 시위가 열렸어요</h1>
<p class="sub">21/22</p>
<p class="tag">사회</p><p class="lead">리스본에서 수천 명이 치솟는 생활비와 주택 문제에 항의했어요.</p><p>로이터에 따르면 폭우 속에서도 수천 명이 행진했어요. 알자지라는 유럽 곳곳에서 비슷한 시위가 있었다고 전했어요.</p>
