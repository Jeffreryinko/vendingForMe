<h1>서안에서 정착민 폭력이 크게 늘었어요</h1>
<p class="sub">22/22</p>
<p class="tag">사회</p><p class="lead">올리브 수확기에 이스라엘 정착민의 공격이 유엔 기록상 최근 20년 가운데 가장 많았다고 해요.</p><p>CBC는 올리브 수확 기간 정착민 공격이 가장 많았다고 전했어요. 하아레츠는 군이 정착민 거주지를 철거한 뒤 팔레스타인인들이 폭력 시위를 감당하게 됐다고 전했어요.</p>
