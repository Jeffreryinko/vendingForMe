<h1>진천에서 성범죄자가 전자발찌를 끊고 달아났어요</h1>
<p class="sub">5/22</p>
<p class="tag">사회</p><p class="lead">21일 오전 충북 진천에서 보호관찰 중인 50대 성범죄자가 전자발찌를 끊고 도주해 당국이 쫓고 있어요.</p><p>매일경제에 따르면 평택에 사는 50대 A씨는 승용차를 몰고 진천으로 와 차 안에서 전자발찌를 끊고 달아났어요. 당국이 추적하고 있어요.</p>
</main>
