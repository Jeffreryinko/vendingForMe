<h1>공기총 연습 중 날아간 총알에 행인이 숨졌어요</h1>
<p class="sub">7/22</p>
<p class="tag">재난</p><p class="lead">강원 평창에서 공기총 사격 연습 중 발사된 총알에 맞은 60대 행인이 숨졌어요.</p><p>한국일보에 따르면 21일 오전 평창군 방림면에서 사고가 났고, 60대 행인이 병원 치료 중 숨졌어요. 경찰은 사격한 60대를 중과실치사 혐의로 입건했어요.</p>
</main>
