<h1>홍대입구역 인근에서 버스가 인도로 돌진했어요</h1>
<p class="sub">11/24</p>
<p class="tag">재난</p><p class="lead">3중 추돌로 버스가 인도로 돌진해 6명이 가벼운 부상을 입었어요.</p><p>연합뉴스에 따르면 홍대입구역에서 추돌사고로 버스가 인도로 돌진해 6명이 다쳤어요. 구글 뉴스 한국은 버스 2대와 경차 1대가 추돌했다고 전했어요.</p>
</main>
