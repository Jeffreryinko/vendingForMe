<h1>금천구 건물에서 미라화된 시신이 나왔어요</h1>
<p class="sub">12/24</p>
<p class="tag">사회</p><p class="lead">보일러실에서 발견됐고 경찰은 범죄 가능성이 낮다고 봤어요.</p><p>연합뉴스에 따르면 서울 금천구 건물 지하에서 미라화된 시신이 발견돼 경찰이 수사해요. 뉴시스는 경찰이 범죄 가능성이 낮다고 했다고 전했어요.</p>
</main>
