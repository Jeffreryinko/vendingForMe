<h1>인도네시아 제과공장 불로 수십 명이 실종됐어요</h1>
<p class="sub">20/24</p>
<p class="tag">재난</p><p class="lead">반텐의 공장 화재로 3명이 숨지고 36명이 실종됐어요.</p><p>연합뉴스에 따르면 3명이 숨지고 36명이 실종됐어요. 매체에 따라 실종자는 36~50명이에요. 로이터는 시신 7구가 발견됐다고 전했어요.</p>
