<h1>바레인이 이란의 공격을 받았다고 밝혔어요</h1>
<p class="sub">14/19</p>
<p class="tag">분쟁</p><p class="lead">바레인은 이란이 민간 산업시설을 공격해 화재가 났고 2명이 다쳤다고 밝혔어요.</p><p>연합뉴스와 SBS가 전했어요. 이란 혁명수비대는 미국 기지가 표적이었다고 주장했어요.</p>
