<h1>프랑스에서 르펜 관련 정보 유출 의혹이 나왔어요</h1>
<p class="sub">18/19</p>
<p class="tag">정치</p><p class="lead">부지사 이메일이 르펜 측근 집에서 발견돼 정보 유출 의혹이 제기됐어요.</p><p>르몽드와 프랑스앵포에 따르면 수색 중 이메일이 발견됐어요. 르펜은 비밀 정보를 받은 적 없다고 했어요.</p>
