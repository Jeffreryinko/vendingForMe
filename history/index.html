<!doctype html><html lang="ko" class="ap ap-history"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>역사 자판기</title>

<style>
/* 역사 탭 — 로봇이 위키백과에서 긁어 온 역사 글 수만 편. 오늘 · 탐색 · 뒤편 · 서재. 읽기는 짧게 → 자세히 → 깊게.
   자료는 조각으로 나뉘어 있어 필요한 것만 불러옴 (data/history/_index.json 의 설명 참고). */
:root{--bg:#F2F2F7;--surface:#fff;--sunk:#E9E9EE;--ink:#000;--muted:#6E6E73;--line:#E5E5EA;--accent:#7F6545;--accent-ink:#fff;--accent-soft:#EFE7DC;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1C1C1E;--sunk:#2C2C2E;--ink:#fff;--muted:#98989F;--line:#38383A;--accent:#C8A87E;--accent-ink:#1C1C1E;--accent-soft:#3A3024;
  --coin:#FFB340;--coin-soft:#3A2E17;--back:#A5A4F5;--back-soft:#2B2A4A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--surface:#1C1C1E;--sunk:#2C2C2E;--ink:#fff;--muted:#98989F;--line:#38383A;--accent:#C8A87E;--accent-ink:#1C1C1E;--accent-soft:#3A3024;--coin:#FFB340;--coin-soft:#3A2E17;--back:#A5A4F5;--back-soft:#2B2A4A;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}

  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}a{color:var(--accent)}
.wrap{max-width:660px;margin:0 auto}

.card{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:14px 16px;margin:0 0 10px;position:relative;transition:transform .12s}.card:active{transform:scale(.985)}
.card.read{opacity:.5}.card.star{box-shadow:inset 0 0 0 1.5px var(--ap-orange)}

.btn.pri{background:var(--accent);color:var(--accent-ink)}.btn.sm{padding:8px 13px;font-size:14px;border-radius:10px}.more{width:100%;margin:6px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:6px -14px;padding:0 14px}.chips.scroll::-webkit-scrollbar{display:none}

.tiles button small{font-weight:400;color:var(--muted);font-size:11px}.tiles button.on{background:var(--accent);color:var(--accent-ink)}.tiles button.on small{color:inherit}

.list .li .t{font-weight:500;margin:0 0 2px;font-size:calc(14.5px*var(--fs))}.list .li .s{font-size:12.5px;color:var(--muted)}.list .li.read{opacity:.5}

.search{width:100%;padding:11px 14px;border-radius:10px;border:0;background:var(--ap-fill);color:inherit;font:inherit;font-size:16px;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}.sub{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--accent)}
/* 읽기 */
.read-top{display:flex;align-items:center;gap:8px;padding:8px 14px 6px;position:sticky;top:0;background:var(--ap-bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);z-index:5;margin:0 -14px}
.read-top .sp{flex:1}
h1.title{font:800 calc(26px*var(--fs))/1.25 var(--ap-display);letter-spacing:-.025em;margin:12px 0 4px}
.title-en{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.hero{width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin:10px 0 4px;background:var(--sunk)}
.depth{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--ap-fill);border-radius:10px;padding:2px;margin:14px 0}
.depth button{border:0;background:none;padding:7px;border-radius:8px;font-size:14px;font-weight:500}.depth button.on{background:var(--ap-seg-on);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}

.secs h3{font:700 calc(18px*var(--fs))/1.35 var(--ap-display);margin:22px 0 6px}.secs h4{font-size:calc(15.5px*var(--fs));margin:16px 0 4px;color:var(--muted)}.secs p{font-size:calc(16.5px*var(--fs));line-height:1.85;margin:0 0 10px;white-space:pre-wrap}
.secs details{background:var(--surface);border-radius:12px;margin:0 0 8px;padding:0 14px}.secs details summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:600;font-size:calc(15.5px*var(--fs));display:flex;justify-content:space-between;gap:8px}
.secs details summary::-webkit-details-marker{display:none}.secs details summary::after{content:"›";color:var(--ap-label3);font-size:20px;transform:rotate(90deg);flex:none}.secs details[open] summary::after{transform:rotate(-90deg)}.secs details summary small{color:var(--muted);font-weight:400;font-size:12px;margin-left:auto;padding-right:8px}
.secs details p{padding-bottom:4px}
.rel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.rel button{text-align:left;padding:12px 14px;border-radius:12px;border:0;background:var(--surface);font-size:14px;font-weight:600}
.rel button small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rel button[disabled]{opacity:.45}
.src{font-size:12.5px;color:var(--muted);border-top:.5px solid var(--ap-sep);padding:12px 0;margin-top:18px}
.memo{width:100%;min-height:90px;border:0;border-radius:12px;background:var(--surface);color:inherit;font:inherit;padding:10px;resize:vertical}
.rbar{position:fixed;left:0;right:0;bottom:0;background:var(--ap-bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--ap-sep);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;justify-content:space-around;z-index:6}
.rbar button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--accent);padding:4px 0}.rbar button b{font-size:21px;font-weight:400}.rbar button.on{color:var(--ap-orange)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;z-index:6}
nav.tabs button{flex:1;border:0;background:none;display:grid;justify-items:center;align-content:center;gap:1px}
nav.tabs button b{font-size:20px;font-weight:400;line-height:1.1}
.back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9500;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:84vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font:700 20px var(--ap-display)}.sheet .k{font-size:13px;color:var(--muted);margin:0 0 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.acts button{padding:12px;border-radius:12px;border:0;background:var(--surface);font-size:14px;font-weight:600;text-align:left}.acts button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.wiki{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;z-index:9400;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:9px 15px;border-radius:14px;font-size:13.5px;z-index:9600}
.live{font-size:13px;color:var(--muted);background:var(--surface);border-radius:12px;padding:10px 14px;margin:8px 0}
</style></head><body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs">
  <button data-v="today" aria-current="page"><b>☀︎</b>오늘</button>
  <button data-v="explore"><b>◎</b>탐색</button>
  <button data-v="back"><b>◑</b>뒤편</button>
  <button data-v="shelf"><b>☆</b>서재</button>
</nav>
<script>
"use strict";
/* ───── 저장 (폰 브라우저). 키 vfm:history:* → 자판기 공통 내보내기에 포함 ───── */
const LS = { g(k, d) { try { const v = localStorage.getItem("vfm:history:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             s(k, v) { try { localStorage.setItem("vfm:history:" + k, JSON.stringify(v)); } catch (e) { toast("저장 공간이 꽉 찼어요"); } } };
const S = { idx: null, top: null, cache: {}, buckets: {}, page: null, depth: LS.g("depth", "short"), recent: LS.g("recent", []),
  cfg: LS.g("cfg", { fs: 1, pics: true, hideRead: false }), star: LS.g("star", {}), memo: LS.g("memo", {}), tags: LS.g("tags", {}), tagdefs: LS.g("tagdefs", ["다시 읽기", "상식", "아이들에게", "재밌음"]),
  read: LS.g("read", {}), hide: LS.g("hide", {}), tmemo: LS.g("tmemo", {}), words: LS.g("words", {}), live: {} };
function save(k) { LS.s(k, S[k]); }
document.documentElement.style.setProperty("--fs", S.cfg.fs || 1);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
async function getJ(p) { if (S.cache[p]) return S.cache[p]; const r = await fetch("../data/history/" + p, { cache: "no-cache" }); if (!r.ok) throw new Error(p); const j = await r.json(); if (p.startsWith("pages/")) { const cl = window.vfmClean || (x => x); if (j.lead) j.lead = cl(j.lead); if (j.one) { j.one = cl(j.one); if (!/[.!?。)\]다요]\s*$/.test(j.one)) j.one = j.one.replace(/[,\s]+$/, "") + "…"; } } else S.cache[p] = j; return j; }
const KIND = { p: "인물", e: "사건", s: "나라·왕조", t: "시대", l: "전설·설", o: "기타" };
const yr = y => y == null ? "" : y < 0 ? `기원전 ${-y}` : `${y}`;
const span = e => e.y == null ? "연도 미상" : e.y2 != null && e.y2 !== e.y ? `${yr(e.y)}~${yr(e.y2)}` : yr(e.y);
const cko = c => ((S.idx || {}).countryKo || {})[c] || c;
const regName = rc => (S.regMap || {})[rc] || "";
const themeName = h => h >= 0 ? (S.idx.themes || [])[h] || "" : "";
const eraName = e => e >= 0 ? (S.idx.eras || [])[e] || "" : "";
const eraShort = e => e >= 0 ? (S.idx.eraShort || [])[e] || "" : "";
const todayKey = () => { const d = new Date(); return String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const seed = () => Math.floor(Date.now() / 864e5);
function pick(list, n, salt) { if (!list.length) return []; const s = seed() + (salt || 0); const out = []; for (let i = 0; i < Math.min(n, list.length); i++) out.push(list[(s * 7 + i * 13) % list.length]); return [...new Set(out)]; }
/* 색인 한 줄(배열) → 글 정보. 칸 순서는 _index.json 의 cols */
const E = a => ({ i: a[0], t: a[1], y: a[2], y2: a[3], e: a[4], r: a[5], c: a[6] || [], h: a[7], k: a[8], g: a[9] || "", n: a[10] || 0, v: a[11] || 0, m: a[12], md: a[13], o: a[14] || "", ya: a[15] });
const pagePath = id => { const pid = id.slice(1); return `pages/${pid.slice(0, 2).padStart(2, "0")}/${id}.json`; };

/* ───── 자료 불러오기 (조각) ───── */
async function loadIndex() { S.idx = await getJ("_index.json"); S.top = await getJ("top.json"); S.regMap = Object.fromEntries(S.idx.regions || []); }
async function rows(p) { try { return (await getJ(p)).map(E); } catch (e) { return []; } }
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ", CHO_M = { "ㄲ": "ㄱ", "ㄸ": "ㄷ", "ㅃ": "ㅂ", "ㅆ": "ㅅ", "ㅉ": "ㅈ" }, CHO14 = "ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ";
function sbucket(t) { const ch = (t || "?")[0]; const code = ch.charCodeAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3) { const c = CHO[Math.floor((code - 0xAC00) / 588)]; return "h" + CHO14.indexOf(CHO_M[c] || c); }
  if (/[A-Za-z]/.test(ch)) return "a" + ch.toLowerCase(); if (/[0-9]/.test(ch)) return "d"; return "x"; }
async function bucket(b) { if (!S.buckets[b]) { try { const l = await getJ("s/" + b + ".json"); S.buckets[b] = { list: l, map: new Map(l.map(x => [x[0], x])) }; } catch (e) { S.buckets[b] = { list: [], map: new Map() }; } } return S.buckets[b]; }
async function idOf(title) { if (!title) return null; const b = await bucket(sbucket(title)); const x = b.map.get(title); return x ? x[1] : null; }
const sRow = x => ({ i: x[1], t: x[0], y: x[2], k: x[3], r: x[4], c: [], g: "", h: -1, e: -1, n: 0 });
function dbucket(y) { if (y == null) return null; if (y >= 1500) return String(Math.floor(y / 10) * 10); if (y >= 0) return String(Math.floor(y / 50) * 50); return String(-Math.ceil(-y / 100) * 100); }
function findLocal(id) { for (const l of [S.top.all, S.top.recent, S.top.back, S.top.pron, S.top.korea, ...Object.values(S.top.region || {})]) { const x = (l || []).find(a => a[0] === id); if (x) return E(x); } const r = S.recent.find(e => e.i === id); return r || (S.star[id] || {}).item || null; }

/* ───── 카드·줄 ───── */
function badges(e) {
  return `${e.y != null ? `<span class="bd yr">${span(e)}</span>` : ""}${e.e >= 0 ? `<span class="bd">${esc(eraShort(e.e))}</span>` : ""}${e.r && e.r !== "xx" ? `<span class="bd">${esc(regName(e.r))}${e.c && e.c.length ? " · " + esc(cko(e.c[0])) : ""}</span>` : ""}${e.h >= 0 ? `<span class="bd th">${esc(themeName(e.h))}</span>` : ""}
    ${e.g.includes("B") ? '<span class="bd bk">야사</span>' : ""}${e.g.includes("P") ? '<span class="bd pr">대명사</span>' : ""}<span class="bd kd">${KIND[e.k] || ""}</span>${(S.tags[e.i] || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}${S.star[e.i] ? '<span class="bd pr">★</span>' : ""}`;

async function sameTime(e, n) {
  const y = e.ya != null ? e.ya : e.y; if (y == null) return [];
  const b = dbucket(y); if (!b) return [];
  const decs = S.idx.decades || []; const i = decs.indexOf(b); const bs = [b, decs[i - 1], decs[i + 1]].filter(Boolean);
  let l = []; for (const x of bs) l = l.concat(await rows("dec/" + x + ".json"));
  const w = Math.abs(y) > 1500 ? 6 : Math.abs(y) > 500 ? 30 : 80;
  l = l.filter(x => x.i !== e.i && (x.ya ?? x.y) != null && Math.abs((x.ya ?? x.y) - y) <= w && (x.c[0] !== (e.c || [])[0]) && !S.hide[x.i]).sort((a, b) => b.n - a.n);
  const seen = new Set(), res = [];
  for (const x of l) { const k = x.r + (x.c[0] || ""); if (seen.has(k) && res.length < n - 1) continue; seen.add(k); res.push(x); if (res.length >= n) break; }
  return res;
}

    <p class="k">로봇: 매일 새벽 5시 (남은 게 있으면 이어서) · 마지막 갱신 ${esc((S.idx.at || "").slice(0, 16).replace("T", " "))}<br>받은 글 ${((S.idx.counts || {}).total || 0).toLocaleString()}편 (전문 ${((S.idx.counts || {}).full || 0).toLocaleString()}) · 받을 차례 ${(S.idx.queue || 0).toLocaleString()}편 · 역사 글 아니라서 뺀 것 ${(S.idx.skipped || 0).toLocaleString()}편 · 저장 용량 ${bu.usedMB || 0} / ${bu.limitMB || 0} MB</p>
    <div class="row"><button class="btn" data-a="close">닫기</button></div></div>`;
  document.body.appendChild(back);
  back.addEventListener("click", e => {
    if (e.target === back) return back.remove(); const a = e.target.closest("[data-a]"); if (!a) return;
    if (a.dataset.a === "fs") { const st = [0.9, 1, 1.1, 1.25]; S.cfg.fs = st[(st.indexOf(S.cfg.fs || 1) + 1) % st.length]; save("cfg"); document.documentElement.style.setProperty("--fs", S.cfg.fs); a.firstChild.textContent = `글자 크기: ${Math.round(S.cfg.fs * 100)}%`; }
    else if (a.dataset.a === "pics") { S.cfg.pics = !S.cfg.pics; save("cfg"); back.remove(); route(); }
    else if (a.dataset.a === "hr") { S.cfg.hideRead = !S.cfg.hideRead; save("cfg"); back.remove(); route(); }
    else if (a.dataset.a === "depth") { const st = ["short", "more", "deep"]; S.depth = st[(st.indexOf(S.depth) + 1) % 3]; save("depth"); a.firstChild.textContent = `기본 읽기: ${{ short: "짧게", more: "자세히", deep: "깊게" }[S.depth]}`; }
    else if (a.dataset.a === "export") exportMine();
    else if (a.dataset.a === "hidden") { S.hide = {}; save("hide"); toast("숨긴 글을 되살렸어요"); back.remove(); route(); }
    else if (a.dataset.a === "close") back.remove();
  });
}
function exportMine() {
  const out = { app: "vendingForMe", part: "history", exportedAt: new Date().toISOString(), star: S.star, memo: S.memo, tags: S.tags, tagdefs: S.tagdefs, read: S.read, recent: S.recent, words: S.words, tmemo: S.tmemo };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" })); a.download = "자판기-역사-기록-" + new Date().toISOString().slice(0, 10) + ".json"; a.click(); toast("내보냈어요");
}

/* ───── 낱말 선택 → 떠 있는 막대 ───── */
let selBar = null, selTimer = null;
document.addEventListener("selectionchange", () => {
  const sel = document.getSelection(); const txt = sel ? sel.toString().trim() : ""; clearTimeout(selTimer);
  if (!txt || txt.length > 40 || !S.page) { selTimer = setTimeout(() => { if (selBar) { selBar.remove(); selBar = null; } }, 500); return; }
  if (selBar) { selBar.remove(); selBar = null; }
  const n = sel.anchorNode && sel.anchorNode.parentElement; if (!n || !n.closest("#body, .title, .oneb, .lead")) return;
  selBar = document.createElement("button"); selBar.className = "selbar"; selBar.textContent = "“" + txt + "” 메모·검색·저장";
  selBar.addEventListener("click", () => { clearTimeout(selTimer); const t = txt; try { document.getSelection().removeAllRanges(); } catch (x) { } if (selBar) selBar.remove(); selBar = null; openWord(t); });
  document.body.appendChild(selBar);
});

/* ───── 라우팅·클릭 ───── */
function setTab(v) { document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.v === v ? "page" : "false")); }
async function route() {
  const h = location.hash || "#today"; document.querySelector(".rbar")?.remove();
  if (h.startsWith("#p=")) { setTab(""); document.getElementById("tabs").hidden = true; return renderPage(decodeURIComponent(h.slice(3))); }
  document.getElementById("tabs").hidden = false; document.body.classList.remove("reading"); S.page = null;
  const v = h.slice(1).split("?")[0]; setTab(v);
  if (v === "explore") renderExplore(); else if (v === "back") renderBack(); else if (v === "shelf") renderShelf(); else renderToday();
}
window.vfmApp = { back: histBack, go: h => nav(h, true), route, top: () => nav("#today") };
window.addEventListener("hashchange", route);
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-v],[data-open],[data-act],[data-f],[data-bm],[data-sm],[data-stag],[data-depth],[data-rel],[data-word],[data-goc]"); if (!t) return;
  const d = t.dataset;
  if (d.v) { nav("#" + d.v); return; }
  if (d.open) return openPage(d.open);
  if (d.word) return openWord((S.words[d.word] || {}).w || d.word.slice(2));
  if (d.goc) { Object.assign(F, { region: "", country: d.goc, era: -2, theme: -2, kind: "", tag: "", shown: 0 }); nav("#explore"); return; }
  if (d.f) { F.shown = 0;
    if (d.f === "reset") { Object.assign(F, { region: "", country: "", era: -2, theme: -2, kind: "", tag: "", q: "", timeline: false }); return renderExplore(); }
    if (d.f === "timeline") { F.timeline = !F.timeline; return renderExplore(); }
    if (d.f === "region") { F.region = F.region === d.val ? "" : d.val; F.country = ""; return renderExplore(); }
    if (d.f === "era" || d.f === "theme") { const v = +d.val; F[d.f] = F[d.f] === v ? -2 : v; return renderExplore(); }
    if (d.f === "sort") F.sort = d.val; else F[d.f] = F[d.f] === d.val ? "" : d.val;
    return renderExplore(); }
  if (d.bm) { backMode = d.bm; return renderBack(); }
  if (d.sm) { shelfMode = d.sm; return renderShelf(); }
  if (d.stag) { F.stag = F.stag === d.stag ? "" : d.stag; return renderShelf(); }
  if (d.depth) { S.depth = d.depth; save("depth"); return renderPage(S.page.id); }
  if (d.rel) { const lists = (document.getElementById("rel") || {})._lists || {}; const l = lists[d.rel] || []; const box = document.getElementById("relBox"); if (!box) return;
    box.innerHTML = l.length ? `<p class="lbl">${{ prev: "그 이전", next: "그 이후", people: "관련 인물·사건", near: "같은 시기 다른 나라" }[d.rel]}</p>${relList(l)}` : '<p class="note">없어요</p>'; return; }
  if (d.act === "back") { if (!histBack()) nav("#today"); return; }
  if (d.act === "morex") return runExplore();
  if (d.act === "searchall") { e.preventDefault(); F.all = true; return runSearch(); }
  if (d.act === "cfg") return cfgSheet();
  if (d.act === "search") { nav("#explore"); setTimeout(() => document.getElementById("xq")?.focus(), 300); return; }
  if (d.act === "export") return exportMine();
  const p = S.page; if (!p) return; const id = p.id;
  if (d.act === "live") return loadLive(p, S.depth === "deep");
  if (d.act === "star") { if (S.star[id]) { delete S.star[id]; toast("별표 해제"); } else { S.star[id] = { at: Date.now(), item: entryOf(p), memo: S.memo[id] || "", tags: S.tags[id] || [] }; toast("별표"); } save("star"); renderPage(id); }
  else if (d.act === "hide") { S.hide[id] = 1; save("hide"); toast("목록에서 숨겼어요 (설정에서 되살리기)"); histBack() || nav("#today"); }
  else if (d.act === "tag") tagSheet(id);
  else if (d.act === "share") { const text = `${p.title} (${span(entryOf(p))})\n${p.one}\n${p.src.url}${S.memo[id] ? "\n메모: " + S.memo[id] : ""}`; if (navigator.share) navigator.share({ title: p.title, text, url: p.src.url }).catch(() => { }); else { try { await navigator.clipboard.writeText(text); toast("복사했어요"); } catch (x) { } } }
});

/* ───── 시작 ───── */
(async () => {
  try { await loadIndex(); } catch (e) { document.getElementById("app").innerHTML = `<div class="top"><h1 class="lt">역사</h1></div><p class="empty">아직 자료가 없어요. 로봇이 처음 돌고 나면 채워집니다.<br><small>${esc(e.message)}</small></p>`; return; }
  route();
  window.vfm = window.vfm || {}; window.vfm.historyExport = exportMine;
})();
</script>
