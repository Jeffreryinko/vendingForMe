<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C6E77">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>자판기</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#EEF2F3;color:#13232B}
  @media (prefers-color-scheme:dark){body{background:#142126;color:#EAF1F2}}
  .box{text-align:center;padding:24px}
  .box a{display:inline-block;margin:8px;padding:14px 22px;border-radius:14px;background:#0C6E77;color:#fff;text-decoration:none;font-weight:700;font-size:18px}
</style>
</head>
<body>
<div class="box">
  <p>자판기</p>
  <a href="sisa/">시사</a><a href="iyagi/">이야기</a><a href="ai/">AI</a>
</div>
<script>
  // 마지막에 보던 탭으로 바로 이동 (처음이면 시사)
  try{var t=localStorage.getItem("vfm:tab")||"sisa";if(t==="sisa"||t==="iyagi"||t==="ai")location.replace(t+"/");}catch(e){location.replace("sisa/");}
</script>
</body>
</html>
