<!-- 깊이 읽기(긴 글 26묶음, 약 850KB)는 첫 화면을 그린 뒤에 받아 와요. 다 오면 열려 있는 역사 화면만 다시 그려요. -->
<script>
(function () {
  /* 묶음 이름 → 개수.  long = 역사, tlong = 낱말, clong = 코스 카드 */
  var SETS = { long: 26, tlong: 10, clong: 0 }, files = [], left;
  for (var k in SETS) for (var i = 1; i <= SETS[k]; i++) files.push("deep-" + k + "-" + i + ".js?v=1");
  left = files.length;
  function done() { if (--left === 0) dispatchEvent(new Event("vfm-long")); }
  function go() { files.forEach(function (f) { var s = document.createElement("script"); s.src = f; s.async = true; s.onload = s.onerror = done; document.body.appendChild(s); }); }
  if (/^#(hist|ch)=/.test(location.hash)) go(); else (window.requestIdleCallback || function (f) { setTimeout(f, 300); })(go);
})();
</script>
