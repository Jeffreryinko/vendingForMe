<!doctype html><html lang="ko" class="ap ap-tools"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.VFM_APP="tools";</script>
<script src="../assets/claude-shim.js"></script>
<script src="../assets/deck.js"></script>
<link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#F2F2F7"><link rel="apple-touch-icon" href="../assets/icon-192.png">
<title>도구 자판기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/apple.css">
<style>
/* 도구 탭 — 요즘 뜨는 AI·개발 도구, 오픈소스, 클로드 코드·바이브코딩 활용법. 로봇(robot/tools_run.py)이 원천에서 하루 4번 모아 둠.
   오늘 · 구역(GitHub·긱뉴스·해커뉴스·유튜브·모음집·AI 앱) · 모음집 · 서재. 자료는 data/tools/
   보기 방식은 다른 앱과 같음: 넘겨보기(assets/deck.js, 한 장씩 옆으로 밀기, 본 카드는 다시 안 나옴) ↔ 목록 */
.vdk .bd{font-size:11.5px}.vdk-thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--sunk);margin:2px 0 12px;border:0;padding:0}
.vdk-owner{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:2px 0 2px}.vdk-owner img{width:28px;height:28px;border-radius:8px;background:var(--sunk)}
.vdk-emo{font-size:34px;line-height:1;margin:2px 0 6px}.vdk .meta{margin:4px 0 6px}
:root{--bg:#F2F2F7;--surface:#fff;--sunk:#E9E9EE;--ink:#000;--muted:#6E6E73;--line:#E5E5EA;--accent:#0A7A8C;--accent-ink:#fff;--accent-soft:#DDF3F6;
  --coin:#C24E00;--coin-soft:#FBE9D6;--fs:1;--r:14px;--nav-h:58px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1C1C1E;--sunk:#2C2C2E;--ink:#fff;--muted:#98989F;--line:#38383A;--accent:#5AD4E6;--accent-soft:#12343A;--coin:#FFB340;--coin-soft:#3A2E17;color-scheme:dark}
  html.ap.ap-tools:not([data-theme="light"]){--accent-ink:#00262B}}
:root[data-theme="dark"]{--bg:#000;--surface:#1C1C1E;--sunk:#2C2C2E;--ink:#fff;--muted:#98989F;--line:#38383A;--accent:#5AD4E6;--accent-soft:#12343A;--coin:#FFB340;--coin-soft:#3A2E17;color-scheme:dark}
html.ap.ap-tools[data-theme="dark"]{--accent-ink:#00262B}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ap-font,system-ui);font-size:calc(15px*var(--fs));line-height:1.55;word-break:keep-all;overflow-wrap:break-word;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}a{color:var(--accent)}
.wrap{max-width:660px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 2px 2px}
.lt{margin:0;font:800 34px/1.15 var(--ap-display);letter-spacing:-.03em}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:var(--ap-fill);color:var(--accent);display:grid;place-items:center;font-size:17px;font-weight:600;flex:none}
.sub{font-size:13px;color:var(--muted);margin:2px 2px 8px}
h2.sec{font:700 20px/1.25 var(--ap-display);letter-spacing:-.02em;margin:24px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec small{font:400 13px var(--ap-font);color:var(--muted);letter-spacing:0;flex:1}h2.sec button{background:none;border:0;color:var(--accent);font:600 14px var(--ap-font);padding:0;flex:none}
.note{font-size:13px;color:var(--muted);margin:0 2px 8px}.health{font-size:13px;color:var(--coin);margin:6px 2px}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:6px -14px;padding:0 14px}.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:0;background:var(--ap-fill);font-size:14px;color:var(--ink)}.chips button small{color:var(--muted);font-size:12px;margin-left:3px}
.chips button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}.chips button.on small{color:inherit;opacity:.8}
.card{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:13px 14px;margin:0 0 8px;position:relative;transition:transform .12s}.card:active{transform:scale(.985)}
.card.read{opacity:.5}.card.star{box-shadow:inset 0 0 0 1.5px var(--ap-orange)}
.card .bx{flex:1;min-width:0}
.card .t{font-weight:650;letter-spacing:-.015em;font-size:calc(15.5px*var(--fs));line-height:1.42;margin:0 0 3px}
.card .o{font-size:12.5px;color:var(--muted);margin:0 0 2px;font-weight:500}
.card .s{font-size:calc(13.5px*var(--fs));color:var(--muted);margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .th{flex:none;width:96px;height:54px;border-radius:8px;object-fit:cover;background:var(--sunk)}
.card .th.sq{width:44px;height:44px;border-radius:10px}.card .emo{flex:none;width:44px;height:44px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:24px}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.bd{display:inline-block;padding:2px 7px;border-radius:6px;font-weight:600;font-size:11.5px;background:var(--ap-fill)}
.bd.src{background:var(--accent-soft);color:var(--accent)}.bd.new{background:var(--coin-soft);color:var(--coin)}.bd.num{background:transparent;padding:0;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.btn{font-size:15px;font-weight:600;padding:11px 18px;border-radius:12px;border:0;background:var(--ap-fill);color:var(--accent);text-decoration:none;display:inline-block;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}.btn.sm{padding:8px 13px;font-size:14px;border-radius:10px}.more{width:100%;margin:4px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.tile{border:0;background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left}.tile b{display:block;font:700 16px var(--ap-display)}.tile small{color:var(--muted);font-size:12.5px}
.search{width:100%;padding:11px 14px;border-radius:10px;border:0;background:var(--ap-fill);color:inherit;font:inherit;font-size:16px;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
.list{background:var(--surface);border-radius:var(--r);padding:0 16px;margin:0 0 10px}
.list .li{display:block;width:100%;text-align:left;padding:11px 0;border:0;border-bottom:.5px solid var(--ap-sep);background:none;color:inherit;text-decoration:none}.list .li:last-child{border-bottom:0}
.list .li .t{font-weight:600;margin:0 0 2px;font-size:calc(14.5px*var(--fs))}.list .li .s{font-size:13px;color:var(--muted)}.list .li.read{opacity:.5}
.part{font-size:13px;color:var(--accent);font-weight:700;margin:16px 2px 6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;z-index:6}
nav.tabs button{flex:1;border:0;background:none;display:grid;justify-items:center;align-content:center;gap:1px}
nav.tabs button b{font-size:20px;font-weight:400;line-height:1.1}
.back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9500;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--ap-label3);margin:0 auto 10px}
.sheet h3{margin:0 0 4px;font:700 20px/1.35 var(--ap-display);letter-spacing:-.02em}.sheet .ko{font-size:15px;margin:0 0 6px;color:var(--ink)}
.sheet .orig{font-size:13px;color:var(--muted);margin:0 0 8px}
.sheet .body{background:var(--surface);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:calc(14.5px*var(--fs))}
.sheet .body p{margin:0 0 6px}.sheet .body p:last-child{margin:0}
.sheet textarea{width:100%;min-height:70px;border-radius:10px;border:0;background:var(--surface);padding:10px 12px;font:inherit;font-size:15px;color:inherit;resize:vertical}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sheet .vid{width:100%;aspect-ratio:16/9;border-radius:12px;background:#000;display:block;border:0}
.sheet .vid.short{aspect-ratio:9/16;max-height:62vh;width:auto;margin:0 auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:9px 15px;border-radius:14px;font-size:13.5px;z-index:9600}
.help{background:var(--surface);border-radius:var(--r);padding:12px 14px;margin:8px 0;font-size:13.5px;color:var(--muted)}.help b{color:var(--ink)}
</style></head><body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs">
  <button data-v="today" aria-current="page"><b>☀︎</b>오늘</button>
  <button data-v="secs"><b>▦</b>탐색</button>
  <button data-v="lists"><b>☰</b>모음집</button>
  <button data-v="shelf"><b>☆</b>보관함</button>
</nav>
<script>
"use strict";
/* ───── 상태 (폰 브라우저에만 저장) ───── */
const LS = { g(k, d) { try { const v = localStorage.getItem("vfm:tools:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             s(k, v) { try { localStorage.setItem("vfm:tools:" + k, JSON.stringify(v)); } catch (e) { toast("저장 공간이 꽉 찼어요"); } } };
const S = { star: LS.g("star", {}), read: LS.g("read", {}), hide: LS.g("hide", {}), memo: LS.g("memo", {}), cat: LS.g("cat", ""), idx: null, now: null, byId: {}, lists: {}, days: {} };
function save(k) { LS.s(k, S[k]); }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
const getJ = p => fetch("../data/tools/" + p, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); });
function num(n) { n = +n || 0; if (n >= 100000000) return (n / 1e8).toFixed(1).replace(/\.0$/, "") + "억"; if (n >= 10000) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "만"; return n.toLocaleString(); }
function ago(iso) { if (!iso) return ""; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); if (m < 60) return Math.max(m, 1) + "분 전"; const h = Math.floor(m / 60); if (h < 48) return h + "시간 전"; return Math.floor(h / 24) + "일 전"; }
function dayLbl(d) { if (!d) return ""; const t = new Date(); const td = t.toISOString().slice(0, 10); const y = new Date(t - 864e5).toISOString().slice(0, 10); return d === td ? "오늘" : d === y ? "어제" : (+d.slice(5, 7)) + "/" + (+d.slice(8, 10)); }
const SEC = { gh: "GitHub 급상승", gn: "긱뉴스", hn: "해커뉴스", yt: "유튜브 해설", ye: "영어 유튜브", list: "모음집 새 항목", hf: "써 보는 AI 앱", rd: "레딧" };
const SEC_NOTE = { gh: "며칠 새 별(★, GitHub의 '좋아요')이 확 늘어난 저장소. 영상에 나오는 도구 대부분이 여기서 먼저 뜹니다",
  gn: "개발·AI 도구 소식을 한국어로 요약해 주는 곳. 'Show GN'은 한국 개발자가 직접 만든 것", hn: "'Show HN'은 개발자가 직접 만든 도구를 올리는 게시판, '화제'는 AI·개발 글 중 추천(▲) 많은 것",
  yt: "도구·바이브코딩 해설 채널 새 영상 + 하루 한 번 검색 (하루당 조회수 순)", ye: "영어권 AI·코딩 채널(Fireship·Matt Wolfe 등) 새 영상 + 하루 한 번 미국 검색 · 제목·설명은 기계번역", list: "'모음 목록(awesome)' 저장소에 최근 새로 추가된 줄", hf: "설치 없이 브라우저에서 바로 써 보는 AI 데모 (허깅페이스 Spaces)", rd: "레딧 클로드·바이브코딩 게시판 인기 글" };
const ORDER = ["gh", "gn", "hn", "yt", "ye", "list", "hf", "rd"];
const isYT = p => p.sec === "yt" || p.sec === "ye";

/* ───── 자료 ───── */
async function loadAll() {
  [S.idx, S.now, S.ex] = await Promise.all([getJ("_index.json"), getJ("now.json"), getJ("explain.json").catch(() => ({}))]);
  S.byId = {};
  for (const [k, lst] of Object.entries(S.now.sec || {})) for (const p of lst) { p.sec = p.sec || k; S.byId[p.id] = p; }
  S.catName = Object.fromEntries((S.idx.cats || []).map(c => [c[0], c[1]]));
}
function visible(lst) { return lst.filter(p => !S.hide[p.id] && (!S.cat || (p.cats || []).includes(S.cat))); }

/* ───── 카드 ───── */
function metaOf(p) {
  const m = [];
  if (p.sec === "gh") { m.push(`<span class="bd num">★ ${num(p.stars)}</span>`); if (p.gain) m.push(`<span class="bd num">${p.kind === "오늘의 인기" ? "오늘" : "하루"} +${num(p.gain)}</span>`); if (p.lang) m.push(esc(p.lang)); }
  if (p.sec === "hn" || p.sec === "rd") { m.push(`<span class="bd num">▲ ${num(p.pts)}</span>`); if (p.cm) m.push(`댓글 ${num(p.cm)}`); }
  if (isYT(p)) { if (p.views) m.push(`<span class="bd num">조회 ${num(p.views)}</span>`); m.push(esc(p.ch || "")); }
  if (p.sec === "hf" && p.likes) m.push(`<span class="bd num">♥ ${num(p.likes)}</span>`);
  if (p.sec === "list" && p.part) m.push(esc(p.part));
  return m;
}
function card(p, opt = {}) {
  const read = S.read[p.id] ? " read" : "", star = S.star[p.id] ? " star" : "";
  const title = p.sec === "gh" ? p.title : (p.ko || p.title);
  const sum = p.ksum || p.sum || "";
  let th = "";
  if (p.vid) th = `<img class="th" loading="lazy" alt="" src="https://i.ytimg.com/vi/${esc(p.vid)}/mqdefault.jpg">`;
  else if (p.sec === "gh" && p.owner) th = `<img class="th sq" loading="lazy" alt="" src="https://github.com/${esc(p.owner)}.png?size=88">`;
  else if (p.img && window.vfm && vfm.pic) th = vfm.pic(p.img, 176, 99, "th");   // 글의 대표 사진
  else if (p.emoji) th = `<span class="emo">${esc(p.emoji)}</span>`;
  const badges = [`<span class="bd src">${esc(opt.noSrc ? p.kind : (SEC[p.sec] || p.kind))}</span>`];
  if (!opt.noSrc && p.kind && !isYT(p) && p.kind !== SEC[p.sec] && !/^(긱뉴스|AI 앱)$/.test(p.kind)) badges.push(`<span class="bd">${esc(p.kind)}</span>`);
  if (isYT(p) && p.kind === "쇼츠") badges.push('<span class="bd">쇼츠</span>');
  if (p.new) badges.push('<span class="bd new">NEW</span>');
  if (p.stale) badges.push('<span class="bd">지난 자료</span>');
  return `<button class="card${read}${star}" data-open="${esc(p.id)}">${th && !isYT(p) ? th : ""}<div class="bx">
    ${p.sec === "gh" && p.owner ? `<p class="o">${esc(p.owner)} /</p>` : ""}<p class="t">${esc(title)}</p>${sum ? `<p class="s">${esc(sum)}</p>` : ""}
    <div class="meta">${badges.join("")}${metaOf(p).map(x => `<span>${x}</span>`).join("")}<span>${dayLbl(p.date)}</span>${S.memo[p.id] ? "<span>✎ 메모</span>" : ""}</div></div>${th && isYT(p) ? th : ""}</button>`;
}
function catChips(lst) {
  const cnt = {}; for (const p of lst) for (const c of p.cats || []) cnt[c] = (cnt[c] || 0) + 1;
  const cats = (S.idx.cats || []).filter(c => cnt[c[0]]);
  return `<div class="chips"><button data-cat="" class="${S.cat ? "" : "on"}">전체</button>${cats.map(c => `<button data-cat="${c[0]}" class="${S.cat === c[0] ? "on" : ""}">${esc(c[1])}<small>${cnt[c[0]]}</small></button>`).join("")}</div>`;
}

/* ───── 넘겨보기 (assets/deck.js) ───── */
const D = window.VfmDeck || null;
const MODE = "tools";                                                       // 오늘·출처별이 같은 보기 방식을 씀
const isDeck = () => !!D && D.mode(MODE) === "deck";
function toList() { try { localStorage.setItem("vfm:mode:" + MODE, '"list"'); } catch (e) { } paint(); }
const OPEN_LBL = p => p.sec === "gh" ? "GitHub에서 보기 ↗" : isYT(p) ? "유튜브에서 보기 ↗" : p.sec === "hf" ? "바로 써 보기 ↗" : p.sec === "gn" ? "긱뉴스에서 보기 ↗" : "원문 보기 ↗";
function deckCard(p) {
  const ko = p.sec === "gh" ? "" : (p.ko && p.ko !== p.title ? p.ko : "");
  const sum = p.ksum || p.sum || "";
  const badges = [`<span class="bd src">${esc(SEC[p.sec] || "")}</span>`];
  if (p.kind && p.kind !== SEC[p.sec] && !/^(긱뉴스|AI 앱|영상)$/.test(p.kind)) badges.push(`<span class="bd">${esc(p.kind)}</span>`);
  if (p.new) badges.push('<span class="bd new">NEW</span>');
  return `<div class="vdk-body"><div class="vdk-k">${badges.join("")}<span>${dayLbl(p.date)}</span></div>
    ${p.vid ? `<button class="vdk-thumb" data-yt="${esc(p.vid)}"${p.short || p.kind === "쇼츠" || /\/shorts\//.test(p.url || "") || /#shorts?\b/i.test(p.title || "") ? " data-short" : ""} aria-label="여기서 영상 재생" style="background:url(https://i.ytimg.com/vi/${esc(p.vid)}/hqdefault.jpg) center/cover"></button>` : ""}
    ${!p.vid && p.img && window.vfm && vfm.pic ? `<span class="vdk-img vfm-picw${p.sec === "gh" ? " gh" : ""}">${vfm.pic(p.img, 820)}</span>` : ""}
    ${p.sec === "gh" && p.owner ? `<p class="vdk-owner"><img alt="" loading="lazy" src="https://github.com/${esc(p.owner)}.png?size=56">${esc(p.owner)} /</p>` : ""}${p.emoji ? `<p class="vdk-emo">${esc(p.emoji)}</p>` : ""}
    <h2 class="vdk-t">${p.sec === "gh" ? `<span>${esc(p.title)}</span>` : esc(ko || p.title)}</h2>${ko ? `<p class="vdk-note" style="margin:-6px 0 10px">${esc(p.title)}</p>` : ""}
    <div class="meta">${metaOf(p).map(x => `<span>${x}</span>`).join("")}${p.ch && !isYT(p) ? `<span>${esc(p.ch)}</span>` : ""}</div>
    ${p.cm && window.vfm && vfm.ytComments ? vfm.ytComments(p.cm) : ""}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-v],[data-go],[data-open],[data-cat],[data-kind],[data-act],[data-lrow]"); if (!t) return;
  const d = t.dataset;
  if (d.v) { if (closeSheet()) { } return nav("#" + d.v); }
  if (d.go) return nav(d.go);
  if (d.open) return openItem(d.open);
  if (d.lrow != null) return openListRow((location.hash.match(/#list=(.+)/) || [])[1], +d.lrow);
  if (d.cat != null) { S.cat = d.cat; save("cat"); if (D) D.stale("tools"); return paint(); }
  if (d.kind != null) { subKind = d.kind; return paint(); }
  const a = d.act;
  if (a === "back") { if (!back()) nav("#today"); return; }
  if (a === "find") return nav("#find");
  if (a === "helpok") { LS.s("helpSeen", 1); return paint(); }
  if (a === "unhide") { S.hide = {}; save("hide"); toast("다시 보여요"); return paint(); }
  if (a === "clearread") { S.read = {}; save("read"); toast("지웠어요"); return paint(); }
  const sh = t.closest(".back"); if (!sh) return;
  const id = sh.dataset.id, p = S.byId[id] || (S.star[id] && S.star[id].item) || {};
  if (a === "think") { if (window.vfm && window.vfm.think) window.vfm.think({ app: "tools", key: id, title: p.ko || p.title, url: p.url }); return; }
  if (a === "star") { if (S.star[id]) { delete S.star[id]; toast("별표 해제"); } else { S.star[id] = { at: Date.now(), item: entry(p), memo: S.memo[id] || "" }; toast("보관함에 넣었어요"); } save("star"); t.textContent = S.star[id] ? "★ 별표 해제" : "☆ 별표"; }
  else if (a === "hide") { S.hide[id] = 1; save("hide"); toast("숨겼어요 (보관함에서 되살리기)"); closeSheet(); }
  else if (a === "share") { const text = `${p.ko || p.title}\n${p.ksum || p.sum || ""}\n${p.url}${S.memo[id] ? "\n메모: " + S.memo[id] : ""}`; if (navigator.share) navigator.share({ title: p.title, text, url: p.url }).catch(() => { }); else { try { await navigator.clipboard.writeText(text); toast("복사했어요"); } catch (x) { } } }
});

window.vfmApp = { back, go: h => nav(h), route: paint, top: () => nav("#today") };
(async () => {
  try { await loadAll(); } catch (e) { document.getElementById("app").innerHTML = `<div class="top"><h1 class="lt">도구</h1></div><p class="empty">아직 자료가 없어요. 로봇이 처음 돌고 나면 채워집니다.<br><small>${esc(e.message)}</small></p>`; return; }
  paint();
})();
</script>
