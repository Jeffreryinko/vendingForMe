<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작업 현황판</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#F2F2F7;--card:#fff;--ink:#111;--sub:#6b6b70;--line:#e3e3e8;--acc:#0C6E77;
  --done:#1f8a4c;--ask:#c05b00;--stuck:#c62828;--run:#3a6fd8}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f2;--sub:#9a9aa0;--line:#2c2c2e;--acc:#4fc3cc;
  --done:#4cc27a;--ask:#ffa34d;--stuck:#ff6b6b;--run:#7aa2ff}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",system-ui,sans-serif;
  word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty;padding:env(safe-area-inset-top) 0 calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:10px;padding:18px 4px 6px}
header h1{flex:1;margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.ibtn{border:0;background:var(--card);color:var(--ink);width:42px;height:42px;border-radius:21px;font-size:19px;cursor:pointer}
.sub{color:var(--sub);font-size:14px;margin:0 4px 14px}
.tabs{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto}
.tabs button{border:0;background:var(--card);color:var(--sub);padding:8px 14px;border-radius:18px;font:inherit;font-size:15px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);font-weight:700}
.cap{font-size:13px;font-weight:700;color:var(--sub);margin:18px 6px 8px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;position:relative}
.card.new::before{content:"";position:absolute;left:7px;top:22px;width:7px;height:7px;border-radius:4px;background:var(--acc)}
.row{display:flex;align-items:center;gap:8px}
.chat{font-weight:700;font-size:17px;flex:1;min-width:0}
.st{font-size:13px;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap}
.st.완료{color:var(--done);background:color-mix(in srgb,var(--done) 14%,transparent)}
.st.질문{color:var(--ask);background:color-mix(in srgb,var(--ask) 14%,transparent)}
.st.막힘{color:var(--stuck);background:color-mix(in srgb,var(--stuck) 14%,transparent)}
.st.진행{color:var(--run);background:color-mix(in srgb,var(--run) 14%,transparent)}
.title{margin:6px 0 0;font-size:16px}
.note{margin:8px 0 0;color:var(--sub);font-size:15px;white-space:pre-wrap}
.meta{margin-top:8px;font-size:13px;color:var(--sub);display:flex;gap:12px;align-items:center}
.meta a{color:var(--acc);text-decoration:none;font-weight:600}
.more{border:0;background:none;color:var(--acc);font:inherit;font-size:14px;padding:0;cursor:pointer}
.hist{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.hist div{font-size:14px;color:var(--sub);padding:3px 0}
.empty,.gate{text-align:center;color:var(--sub);padding:50px 10px}
.gate p{margin:0 0 16px}
.btn{border:0;background:var(--acc);color:#fff;font:inherit;font-weight:700;padding:12px 20px;border-radius:14px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink)}
.sheet{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
.sheet p{margin:0 0 12px;color:var(--sub);font-size:15px}
.sheet .btns{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.hi{outline:2px solid var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>작업 현황판</h1><button class="ibtn" id="bell" title="알림" hidden>🔔</button><button class="ibtn" id="reload" title="새로고침">↻</button></header>
  <div id="app"><div class="gate">불러오는 중입니다.</div></div>
</div>
<div id="toast"></div>
<script src="../assets/sync-config.js"></script>
<script>
/* 작업 현황판 — 채팅들이 남긴 한 줄(public.work_log)을 채팅별로 모아 보고, 새 줄이 오면 폰 알림.
   읽기는 허용된 구글 계정(think_is_owner)만. 알림은 자판기 앱의 서비스 워커(../sw.js)를 같이 씀. */
const CFG = window.VFM_SYNC, $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let sb, rows = [], tab = '한눈에', open = new Set();
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); };
const gate = h => { $('#app').innerHTML = `<div class="gate">${h}</div>`; };

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  const d = new Date(iso); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
}

async function pull() {
  const { data, error } = await sb.from('work_log').select('*').order('at', { ascending: false }).limit(300);
  if (error) { toast('불러오지 못했어요'); return; }
  rows = data || [];
}

function render() {
  // 채팅별 최신 줄
  const by = new Map();
  for (const r of rows) { if (!by.has(r.chat)) by.set(r.chat, []); by.get(r.chat).push(r); }
  const chats = [...by.values()];
  const todo = chats.filter(l => l[0].state === '질문' || l[0].state === '막힘');
  const run = chats.filter(l => l[0].state === '진행');
  const done = chats.filter(l => l[0].state === '완료');
  const unseen = rows.filter(r => !r.seen).length;
  const lists = { '한눈에': chats, '할 일': todo, '진행 중': run, '끝남': done };
  const tabs = Object.keys(lists).map(k => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${k}${k === '한눈에' ? '' : ' ' + lists[k].length}</button>`).join('');
  const card = l => {
    const r = l[0], h = open.has(r.chat);
    return `<div class="card${l.some(x => !x.seen) ? ' new' : ''}" id="w${r.id}">
      <div class="row"><div class="chat">${esc(r.chat)}</div><span class="st ${r.state}">${r.state === '질문' ? '답 필요' : r.state === '진행' ? (Date.now() - new Date(r.at) > 3 * 3600e3 ? '진행 · 소식 없음' : '진행 중') : r.state}</span></div>
      <p class="title">${esc(r.title)}</p>
      ${r.note ? `<p class="note">${esc(r.note)}</p>` : ''}
      <div class="meta"><span>${ago(r.at)}</span>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">채팅 열기 ›</a>` : ''}
        ${l.length > 1 ? `<button class="more" data-chat="${esc(r.chat)}">${h ? '접기' : '지난 기록 ' + (l.length - 1)}</button>` : ''}</div>
      ${h ? `<div class="hist">${l.slice(1, 15).map(x => `<div>${ago(x.at)} · ${x.state} · ${esc(x.title)}</div>`).join('')}</div>` : ''}
    </div>`;
  };
  const list = lists[tab];
  const sec = (name, l, empty) => `<div class="cap">${name} ${l.length}</div>` + (l.length ? l.map(card).join('') : `<div class="card" style="color:var(--sub)">${empty}</div>`);
  const body = tab === '한눈에'
    ? (rows.length ? sec('🙋 내 답이 필요해요', todo, '없어요') + sec('⏳ 진행 중', run, '지금 일하는 채팅이 없어요') + sec('✅ 최근 끝남', done.slice(0, 6), '아직 없어요')
                   : '<div class="empty">아직 기록이 없어요.<br>채팅이 일을 시작하고 끝낼 때마다 여기에 한 줄씩 쌓여요.</div>')
    : list.length ? list.map(card).join('') : `<div class="empty">${tab === '할 일' ? '지금 답을 기다리는 채팅이 없어요.' : tab === '진행 중' ? '지금 일하는 채팅이 없어요.' : '여기엔 아직 없어요.'}</div>`;
  $('#app').innerHTML = `<p class="sub">채팅 ${chats.length}개 · 진행 중 ${run.length}개 · 새 소식 ${unseen}개</p><div class="tabs">${tabs}</div>
    <div id="pushBox"></div>${body}`;
  pushBox();
  const hit = location.hash.slice(1) && document.getElementById('w' + location.hash.slice(1));
  if (hit) { hit.classList.add('hi'); hit.scrollIntoView({ block: 'center' }); }
  const ids = rows.filter(r => !r.seen).map(r => r.id);
  if (ids.length && !document.hidden) setTimeout(() => sb.rpc('work_seen', { p_ids: ids }).then(() => ids.forEach(i => { const r = rows.find(x => x.id === i); if (r) r.seen = true; })), 1500);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; history.replaceState(null, '', location.pathname); render(); return; }
  const m = e.target.closest('.more'); if (m) { const c = m.dataset.chat; open.has(c) ? open.delete(c) : open.add(c); render(); }
});

/* ── 알림 ── */
const pushOk = () => 'PushManager' in window && 'serviceWorker' in navigator && 'Notification' in window;
const b64key = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function currentSub() { const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
async function pushOn() { const s = await currentSub(); if (!s) return false; const { data } = await sb.rpc('work_push_on', { p_endpoint: s.endpoint }); return !!data; }
async function pushBox() {
  if (!pushOk()) return;
  const on = await pushOn().catch(() => false);
  localStorage.setItem('vfm:work:push', on ? '1' : '');
  $('#bell').hidden = false; $('#bell').textContent = on ? '🔔' : '🔕';
  const box = $('#pushBox'); if (!box || on || localStorage.getItem('vfm:work:pushLater')) return;
  box.innerHTML = `<div class="sheet"><p>채팅이 일을 끝내거나 내 답이 필요할 때 폰으로 알려 드릴까요?</p>
    <div class="btns"><button class="btn" id="pushYes">알림 켜기</button><button class="btn ghost" id="pushNo">나중에</button></div></div>`;
  $('#pushYes').onclick = () => togglePush(true);
  $('#pushNo').onclick = () => { localStorage.setItem('vfm:work:pushLater', '1'); box.innerHTML = ''; };
}
async function togglePush(want) {
  try {
    if (Notification.permission === 'denied') return toast('알림이 막혀 있어요. 사이트 설정에서 허용해 주세요');
    if (await Notification.requestPermission() !== 'granted') return toast('알림을 허용해야 켤 수 있어요');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const { data: key } = await sb.rpc('planner_vapid_public');
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64key(key) });
    }
    const j = sub.toJSON();
    const { error } = await sb.rpc('work_push_sub', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_on: want });
    if (error) throw error;
    if (want) { await sb.rpc('work_push_test'); toast('켰어요 — 시험 알림을 보냈어요'); } else toast('알림을 껐어요');
    render();
  } catch (x) { toast('알림 설정 실패: ' + (x.message || x)); }
}
$('#bell').onclick = async () => togglePush(!(await pushOn()));
$('#reload').onclick = async () => { await pull(); render(); toast('새로 불러왔어요'); };

async function boot() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
  try {
    await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'; s.crossOrigin = 'anonymous'; s.onload = ok; s.onerror = no; document.head.append(s); });
    sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, detectSessionInUrl: true, flowType: 'pkce' } });
  } catch { return gate('<p>로그인 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p><button class="btn" onclick="location.reload()">다시 열기</button>'); }
  const { data } = await sb.auth.getSession();
  const user = data.session?.user;
  if (!user) {
    gate('<p>여러 채팅에 맡긴 일이 어디까지 왔는지 한눈에 봅니다.</p><button class="btn" id="login">Google 계정으로 로그인</button>');
    $('#login').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    return;
  }
  const { data: ok } = await sb.rpc('think_is_owner');
  if (!ok) {
    gate(`<p>${esc(user.email)} 계정으로는 열 수 없어요.</p><button class="btn ghost" id="out">다른 계정으로 로그인</button>`);
    $('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
    return;
  }
  await pull(); render();
  document.addEventListener('visibilitychange', async () => { if (!document.hidden) { await pull(); render(); } });
  setInterval(async () => { if (!document.hidden) { await pull(); render(); } }, 60000);
}
boot();
</script>
</body>
</html>
